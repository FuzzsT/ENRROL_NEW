org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# API 37 can be delivered as a minor platform (for example android-37.1) while
# AGP compileSdk=37 resolves android-37. CI intentionally aliases that platform
# for native builds; suppress only the resulting external-native path warning.
android.sync.suppressAgpWarnings=EXTERNAL_NATIVE_BUILD_CONFIGURATION
