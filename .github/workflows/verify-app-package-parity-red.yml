name: Verify RED Task 7 app package parity

on:
  push:
    branches:
      - feat/dpc-aio-130-app-package-parity
    paths:
      - tools/tests/test_130_app_package_parity_contract.py
      - .github/workflows/verify-app-package-parity-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require Task 7 contract failure before implementation
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/tests/test_130_app_package_parity_contract.py; then
            echo 'Task 7 contract unexpectedly passed before implementation' >&2
            exit 1
          fi
          echo 'RED confirmed: Task 7 app/package parity contract fails before implementation.'
