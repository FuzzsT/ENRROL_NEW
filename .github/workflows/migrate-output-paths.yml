name: One-shot DPC output path migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-output-paths.yml

permissions:
  contents: write
  actions: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Apply output-path fix and regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          targets = [
              Path('.github/workflows/build-aio-enrollment.yml'),
              Path('.github/workflows/build-emergency-enrollment.yml'),
              Path('plugins/chatgpt-companion/skills/dpc-aio-build/SKILL.md'),
              Path('plugins/chatgpt-companion/skills/dpc-aio-enrollment/SKILL.md'),
              Path('plugins/chatgpt-companion/skills/dpc-aio-enrollment/references/provisioning-contract.md'),
              Path('docs/PROVISIONING-QR.md'),
              Path('docs/superpowers/plans/2026-08-22-dpc-aio-chatgpt-plugin-full-upgrade.md'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = text.replace('apps/dpc/build/outputs', 'apps/dpc/app/build/outputs')
              path.write_text(text, encoding='utf-8')

          guard = Path('tools/tests/test_build_output_paths_114_contract.py')
          guard.write_text('''#!/usr/bin/env python3
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          FILES = [
              ROOT / '.github/workflows/build-aio-enrollment.yml',
              ROOT / '.github/workflows/build-emergency-enrollment.yml',
              ROOT / 'plugins/chatgpt-companion/skills/dpc-aio-build/SKILL.md',
              ROOT / 'plugins/chatgpt-companion/skills/dpc-aio-enrollment/SKILL.md',
              ROOT / 'plugins/chatgpt-companion/skills/dpc-aio-enrollment/references/provisioning-contract.md',
              ROOT / 'docs/PROVISIONING-QR.md',
              ROOT / 'docs/superpowers/plans/2026-08-22-dpc-aio-chatgpt-plugin-full-upgrade.md',
          ]
          errors = []
          for path in FILES:
              text = path.read_text(encoding='utf-8')
              if 'apps/dpc/build/outputs' in text:
                  errors.append(f'{path.relative_to(ROOT)} still points at obsolete apps/dpc/build/outputs')
          for wf in FILES[:2]:
              text = wf.read_text(encoding='utf-8')
              if 'apps/dpc/app/build/outputs/apk/enterprise/release' not in text:
                  errors.append(f'{wf.relative_to(ROOT)} does not locate APK under app module build outputs')
              if 'apps/dpc/app/build/outputs/provisioning/enterprise/release' not in text:
                  errors.append(f'{wf.relative_to(ROOT)} does not collect provisioning under app module build outputs')
          if errors:
              print('BUILD_OUTPUT_PATHS_114_CONTRACT: FAIL')
              for error in errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print('BUILD_OUTPUT_PATHS_114_CONTRACT: PASS')
          ''', encoding='utf-8')

          emergency = Path('.github/workflows/build-emergency-enrollment.yml')
          text = emergency.read_text(encoding='utf-8')
          line = '          python3 tools/tests/test_build_output_paths_114_contract.py\n'
          if line not in text:
              marker = '          python3 tools/tests/test_installer_android_compile_114_contract.py\n'
              if marker not in text:
                  raise SystemExit('Emergency workflow validation marker missing')
              text = text.replace(marker, marker + line, 1)
          emergency.write_text(text, encoding='utf-8')

          production = Path('.github/workflows/build-aio-enrollment.yml')
          text = production.read_text(encoding='utf-8')
          block = '''      - name: Validate build output paths
          shell: bash
          run: python3 tools/tests/test_build_output_paths_114_contract.py
          '''
          if 'name: Validate build output paths' not in text:
              marker = '      - name: Build enterpriseRelease and generate provisioning QR\n'
              if marker not in text:
                  raise SystemExit('Production workflow build marker missing')
              text = text.replace(marker, block + marker, 1)
          production.write_text(text, encoding='utf-8')
          PY
          chmod +x tools/tests/test_build_output_paths_114_contract.py
          python3 tools/tests/test_build_output_paths_114_contract.py
          git diff --check

      - name: Commit fix, remove one-shot workflow, dispatch emergency enrollment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-output-paths.yml
          git add .github/workflows/build-aio-enrollment.yml \
                  .github/workflows/build-emergency-enrollment.yml \
                  tools/tests/test_build_output_paths_114_contract.py \
                  plugins/chatgpt-companion/skills/dpc-aio-build/SKILL.md \
                  plugins/chatgpt-companion/skills/dpc-aio-enrollment/SKILL.md \
                  plugins/chatgpt-companion/skills/dpc-aio-enrollment/references/provisioning-contract.md \
                  docs/PROVISIONING-QR.md \
                  docs/superpowers/plans/2026-08-22-dpc-aio-chatgpt-plugin-full-upgrade.md
          git commit -m "Fix DPC app-module build output paths [skip ci]"
          git push origin HEAD:main
          gh workflow run build-emergency-enrollment.yml --repo "$GITHUB_REPOSITORY" --ref main
