name: Implement Task 8 network Wi-Fi parity

on:
  push:
    branches:
      - feat/dpc-aio-130-network-wifi-parity
    paths:
      - tools/.task8_apply.py
      - apps/dpc/modules/policy/android/src/main/kotlin/io/dpcaio/policy/android/parity/AndroidNetworkParityGateway.kt
      - .github/workflows/implement-network-wifi-parity.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Apply Task 8 catalog and router transform
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/.task8_apply.py

      - name: Verify focused Task 8 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_123_testdpc_parity_catalog_169.py
          python3 tools/tests/test_124_parity_handler_coverage.py
          python3 tools/tests/test_125_parity_ui_contract.py
          python3 tools/tests/test_130_app_package_parity_contract.py
          python3 tools/tests/test_131_network_wifi_parity_contract.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
          git diff --check

      - name: Remove implementation-only files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-network-wifi-parity-red.yml
          rm -f .github/workflows/implement-network-wifi-parity.yml
          rm -f tools/.task8_apply.py
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2
          test -f .github/workflows/build-aio-enrollment.yml
          test -f .github/workflows/build-emergency-enrollment.yml

      - name: Commit Task 8 implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add network Wi-Fi TestDPC parity APIs'
          git push origin HEAD:feat/dpc-aio-130-network-wifi-parity
