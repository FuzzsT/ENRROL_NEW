name: Finalize DPC-AIO 1.3.0 contracts v2
on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-dpc-130-v2.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {fetch-depth: 0}
      - name: Synchronize active 1.3.0 contracts and model final topology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          R=Path.cwd()
          def rd(p): return (R/p).read_text('utf-8')
          def wr(p,t): (R/p).write_text(t,'utf-8')
          g=rd('apps/dpc/app/build.gradle.kts'); assert 'versionName = "1.3.0"' in g and re.search(r'versionCode\s*=\s*27\b',g)
          p='tools/tests/test_release_version_contract.py'; t=rd(p); t=t.replace("EXPECTED = '1.2.0'\nEXPECTED_CODE = '26'","EXPECTED = '1.3.0'\nEXPECTED_CODE = '27'"); wr(p,t)
          p='tools/tests/test_114_qr_release_bundle_contract.py'; t=rd(p)
          for a,b in [('versionName = "1.2.0"','versionName = "1.3.0"'),('versionName 1.2.0 missing','versionName 1.3.0 missing'),('int(m.group(1)) < 26','int(m.group(1)) < 27'),('versionCode >=26 required','versionCode >=27 required'),('DPC-AIO 1.2.0','DPC-AIO 1.3.0'),('README 1.2.0 QR release highlights missing','README 1.3.0 QR release highlights missing'),("obj.get('version')!='1.2.0'","obj.get('version')!='1.3.0'"),('release report version !=1.2.0','release report version !=1.3.0'),('1.2.0 contract not wired into host tests','1.3.0 contract not wired into host tests')]: t=t.replace(a,b)
          wr(p,t)
          p='README.md'; t=rd(p).replace('# DPC-AIO 1.2.0 — Enterprise + Samsung OEM AIO','# DPC-AIO 1.3.0 — TestDPC Parity + Enterprise + Samsung OEM AIO',1).replace('## 1.2.0 highlights','## 1.3.0 highlights',1).replace('DPC-AIO-1.2.0-QR-RELEASE-BUNDLE.zip','DPC-AIO-1.3.0-QR-RELEASE-BUNDLE.zip',1); wr(p,t)
          for p in ['docs/releases/PACKAGE-INFO.txt','docs/publishing/GITHUB-READY.md','docs/history/checkpoints/CHECKPOINT.md']:
              t=rd(p)
              if '1.3.0' not in t: t=t.replace('1.2.0','1.3.0')
              if p.endswith('CHECKPOINT.md'): t=t.replace('versionCode 26','versionCode 27')
              wr(p,t)
          p='RELEASE-VERIFICATION.json'; o=json.loads(rd(p)); o['version']='1.3.0'; raw=json.dumps(o,indent=2,ensure_ascii=False)+'\n'; raw=raw.replace('dpcVersion=1.2.0','dpcVersion=1.3.0').replace('DPC-AIO-1.2.0-QR-RELEASE-BUNDLE.zip','DPC-AIO-1.3.0-QR-RELEASE-BUNDLE.zip').replace('DPC-AIO 1.2.0 QR Release Bundle','DPC-AIO 1.3.0 TestDPC Parity + QR Release Bundle'); wr(p,raw)
          p='tools/run_host_tests.sh'; t=rd(p); line='python3 "$ROOT/tools/tests/test_123_testdpc_parity_catalog_169.py"\n'; marker='python3 "$ROOT/tools/tests/test_release_version_contract.py"\n';
          if line not in t: assert t.count(marker)==1; t=t.replace(marker,line+marker,1); wr(p,t)
          print('SYNC_130_V2: PASS')
          PY
          rm -f .github/workflows/finalize-dpc-130-v2.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with: {accept-android-sdk-licenses: true, log-accepted-android-sdk-licenses: false, packages: platform-tools}
      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          s="$(command -v sdkmanager)"; l="$RUNNER_TEMP/sdk.txt"; "$s" --list --channel=3 > "$l"
          p="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$l"|head -1)"
          [[ -n "$p" ]] || p="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1~/^platforms;android-37\.[0-9]+$/{print $1}' "$l"|sort -V|tail -1)"
          [[ -n "$p" ]] || { grep -q 'platforms;android-CinnamonBun' "$l" && p='platforms;android-CinnamonBun'; }
          [[ -n "$p" ]] || exit 2
          b="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1~/^build-tools;37\.[0-9]+\.[0-9]+$/{print $1}' "$l"|sort -V|tail -1)"; [[ -n "$b" ]] || b='build-tools;36.0.0'
          "$s" "$p" "$b" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then i="$ANDROID_SDK_ROOT/platforms/${p#platforms;}"; ln -sfn "$i" "$ANDROID_SDK_ROOT/platforms/android-37"; fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
      - name: Verify final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 tools/tests/test_123_testdpc_parity_catalog_169.py
          python3 tools/tests/test_release_version_contract.py
          python3 tools/tests/test_114_qr_release_bundle_contract.py
          python3 tools/tests/test_102_qr_production_readiness_contract.py
          python3 tools/tests/test_113_github_upload_ready_contract.py
          python3 tools/tests/test_release_secret_scan.py
          python3 tools/tests/test_non_sdk_api_scan.py
          bash -n tools/run_host_tests.sh
          python3 - <<'PY'
          import yaml
          for p in ('.github/workflows/build-aio-enrollment.yml','.github/workflows/build-emergency-enrollment.yml'): yaml.safe_load(open(p,encoding='utf-8'))
          print('WORKFLOW_YAML_PARSE: PASS')
          PY
          chmod +x gradlew
          ./gradlew :policy-core:compileKotlin :policy-core:compileTestKotlin :app-dpc:compileEnterpriseReleaseKotlin --console=plain --stacktrace
      - name: Commit synchronized contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md RELEASE-VERIFICATION.json docs/releases/PACKAGE-INFO.txt docs/publishing/GITHUB-READY.md docs/history/checkpoints/CHECKPOINT.md tools/tests/test_release_version_contract.py tools/tests/test_114_qr_release_bundle_contract.py tools/run_host_tests.sh
          git commit -m 'chore: synchronize DPC-AIO 1.3.0 release contracts'
          git push origin HEAD:main
