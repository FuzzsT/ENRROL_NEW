name: Build AIO + enrollment QR

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional HTTPS URL that Setup Wizard will use to download the APK. If empty, the workflow publishes and uses the stable continuous-release URL."
        required: false
        type: string
      enrollment_token:
        description: "Optional enrollment token embedded in admin extras"
        required: false
        type: string
      enrollment_endpoint:
        description: "Optional HTTPS DPC-AIO Enrollment Engine v2 endpoint"
        required: false
        type: string
      enrollment_signing_public_key:
        description: "Optional Base64 DER Ed25519 public key used by the DPC to verify signed bootstrap responses"
        required: false
        type: string
      policy_profile:
        description: "Policy profile placed in admin extras"
        required: false
        default: "default"
        type: string
      provisioning_mode:
        description: "Compatibility QR mode; dedicated Work Profile and Device Owner QR files are always generated"
        required: true
        default: "work-profile"
        type: choice
        options:
          - auto
          - work-profile
          - fully-managed
      allow_offline:
        description: "Force Android 13+ offline provisioning when deployment cannot reach the internet"
        required: false
        default: false
        type: boolean
      enrollment_offline_mode:
        description: "DPC enrollment route used after Setup Wizard installs the DPC"
        required: false
        default: "ONLINE"
        type: choice
        options:
          - ONLINE
          - ONLINE_PREFERRED
          - FULL_OFFLINE
          - OFFLINE_THEN_SYNC
      offline_bundle_id:
        description: "Signed local offline bundle/profile id; required for FULL_OFFLINE and OFFLINE_THEN_SYNC"
        required: false
        type: string
      release_signing_password:
        description: "Optional run-scoped password used only to unlock the persistent release keystore stored in repository secrets"
        required: false
        type: string

  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: dpc-aio-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DPC_AIO_VERSION: "1.1.4"
  DPC_AIO_CONTINUOUS_RELEASE_TAG: "dpc-aio-continuous"
  DPC_AIO_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    name: Build, verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools"

      - name: Install Android 17 SDK + native toolchain
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager)"
          SDK_LIST="$RUNNER_TEMP/android-sdk-packages.txt"

          "$SDKMANAGER" --list --channel=3 > "$SDK_LIST"

          has_package() {
            awk -F'|' -v wanted="$1" '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 == wanted { found=1 }
              END { exit(found ? 0 : 1) }
            ' "$SDK_LIST"
          }

          platform_pkg=""
          if has_package "platforms;android-37"; then
            platform_pkg="platforms;android-37"
          else
            platform_pkg="$(
              awk -F'|' '
                { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
                $1 ~ /^platforms;android-37\.[0-9]+$/ { print $1 }
              ' "$SDK_LIST" | sort -V | tail -n1
            )"
          fi

          if [[ -z "$platform_pkg" ]] && has_package "platforms;android-CinnamonBun"; then
            platform_pkg="platforms;android-CinnamonBun"
          fi

          if [[ -z "$platform_pkg" ]]; then
            echo "Android 17 / API 37 platform not found." >&2
            grep -E 'platforms;android-(37|CinnamonBun)' "$SDK_LIST" || true
            exit 1
          fi

          build_tools_pkg="$(
            awk -F'|' '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 ~ /^build-tools;37\./ { print $1 }
            ' "$SDK_LIST" | sort -V | tail -n1
          )"

          if [[ -z "$build_tools_pkg" ]]; then
            echo "Android 17 build-tools 37.x were not found." >&2
            grep -E 'build-tools;37\.' "$SDK_LIST" || true
            exit 1
          fi

          echo "Selected platform: $platform_pkg"
          echo "Selected build tools: $build_tools_pkg"

          "$SDKMANAGER" \
            "$platform_pkg" \
            "$build_tools_pkg" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            --channel=3

          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            installed_name="${platform_pkg#platforms;}"
            installed_path="$ANDROID_SDK_ROOT/platforms/$installed_name"
            if [[ -d "$installed_path" ]]; then
              ln -sfn "$installed_path" "$ANDROID_SDK_ROOT/platforms/android-37"
            fi
          fi

          test -f "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Set up Python QR dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tools/provisioning/requirements.txt

      - name: Resolve and validate provisioning configuration
        shell: bash
        env:
          INPUT_APK_URL: ${{ inputs.apk_url || '' }}
          INPUT_OFFLINE_MODE: ${{ inputs.enrollment_offline_mode || vars.DPC_AIO_ENROLLMENT_OFFLINE_MODE || 'ONLINE' }}
          INPUT_OFFLINE_BUNDLE_ID: ${{ inputs.offline_bundle_id || vars.DPC_AIO_OFFLINE_BUNDLE_ID || '' }}
          INPUT_ENROLLMENT_ENDPOINT: ${{ inputs.enrollment_endpoint || vars.DPC_AIO_ENROLLMENT_ENDPOINT || '' }}
        run: |
          set -euo pipefail

          validate_https_url() {
            local value="$1"
            local label="$2"
            [[ -z "$value" ]] && return 0

            python3 - "$value" "$label" <<'PY'
          import sys
          from urllib.parse import urlparse

          value, label = sys.argv[1], sys.argv[2]
          parsed = urlparse(value)
          if parsed.scheme.lower() != "https" or not parsed.netloc:
              raise SystemExit(f"{label} must be an absolute HTTPS URL: {value!r}")
          PY
          }

          validate_https_url "$INPUT_APK_URL" "apk_url"
          validate_https_url "$INPUT_ENROLLMENT_ENDPOINT" "enrollment_endpoint"

          case "$INPUT_OFFLINE_MODE" in
            ONLINE|ONLINE_PREFERRED)
              ;;
            FULL_OFFLINE|OFFLINE_THEN_SYNC)
              if [[ -z "$INPUT_OFFLINE_BUNDLE_ID" ]]; then
                echo "offline_bundle_id is required when enrollment_offline_mode=$INPUT_OFFLINE_MODE" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported enrollment_offline_mode: $INPUT_OFFLINE_MODE" >&2
              exit 1
              ;;
          esac

          if [[ -n "$INPUT_APK_URL" ]]; then
            url="$INPUT_APK_URL"
            custom_url="true"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/DPC-AIO-enterprise-release.apk"
            custom_url="false"
          else
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DPC_AIO_CONTINUOUS_RELEASE_TAG}/DPC-AIO-enterprise-release.apk"
            custom_url="false"
          fi

          {
            echo "DPC_AIO_PROVISIONING_APK_URL=$url"
            echo "DPC_AIO_CUSTOM_APK_URL=$custom_url"
          } >> "$GITHUB_ENV"

          echo "Provisioning APK URL: $url"

      - name: Load manual keystore password
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          password="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          print(payload.get("inputs", {}).get("release_signing_password", ""), end="")
          PY
          )"

          if [[ -n "$password" ]]; then
            printf '::add-mask::%s\n' "$password"
            printf 'DPC_AIO_MANUAL_SIGNING_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          fi

      - name: Prepare persistent enterprise release signing
        shell: bash
        env:
          DPC_AIO_RELEASE_KEYSTORE_B64: ${{ secrets.DPC_AIO_RELEASE_KEYSTORE_B64 }}
          DPC_AIO_RELEASE_STORE_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_STORE_PASSWORD }}
          DPC_AIO_RELEASE_KEY_ALIAS: ${{ secrets.DPC_AIO_RELEASE_KEY_ALIAS }}
          DPC_AIO_RELEASE_KEY_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_KEY_PASSWORD }}
          DPC_AIO_EXPECTED_SIGNING_CERT_SHA256: ${{ vars.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 || secrets.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          store_password="${DPC_AIO_RELEASE_STORE_PASSWORD:-${DPC_AIO_MANUAL_SIGNING_PASSWORD:-}}"
          key_password="${DPC_AIO_RELEASE_KEY_PASSWORD:-$store_password}"

          missing=0
          for name in \
            DPC_AIO_RELEASE_KEYSTORE_B64 \
            DPC_AIO_RELEASE_KEY_ALIAS \
            DPC_AIO_EXPECTED_SIGNING_CERT_SHA256
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required signing configuration: $name" >&2
              missing=1
            fi
          done

          if [[ -z "$store_password" ]]; then
            echo "Missing release keystore password. Configure DPC_AIO_RELEASE_STORE_PASSWORD or provide the run-scoped release_signing_password input." >&2
            missing=1
          fi

          if [[ "$missing" != "0" ]]; then
            exit 1
          fi

          printf '::add-mask::%s\n' "$store_password"
          printf '::add-mask::%s\n' "$key_password"

          keystore="$RUNNER_TEMP/dpc-aio-release.p12"
          printf '%s' "$DPC_AIO_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          expected="$(
            printf '%s' "$DPC_AIO_EXPECTED_SIGNING_CERT_SHA256" \
              | tr -d ':[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"

          observed="$(
            keytool -exportcert \
              -rfc \
              -storetype PKCS12 \
              -keystore "$keystore" \
              -storepass "$store_password" \
              -alias "$DPC_AIO_RELEASE_KEY_ALIAS" \
            | openssl x509 -noout -fingerprint -sha256 \
            | awk -F= '{print $2}' \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          if [[ -z "$observed" || "$observed" != "$expected" ]]; then
            echo "KEYSTORE_CERT_MISMATCH expected=$expected observed=$observed" >&2
            rm -f "$keystore"
            exit 1
          fi

          {
            echo "DPC_AIO_RELEASE_KEYSTORE_PATH=$keystore"
            echo "DPC_AIO_RELEASE_STORE_PASSWORD=$store_password"
            echo "DPC_AIO_RELEASE_KEY_ALIAS=$DPC_AIO_RELEASE_KEY_ALIAS"
            echo "DPC_AIO_RELEASE_KEY_PASSWORD=$key_password"
            echo "DPC_AIO_EXPECTED_SIGNING_CERT_SHA256=$expected"
          } >> "$GITHUB_ENV"

          echo "Persistent signing certificate verified: $observed"

      - name: Verify Android build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/android_build_preflight.py \
            --require-signing \
            --json-out dist/build-environment.json

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build enterpriseRelease and generate provisioning QR
        shell: bash
        env:
          DPC_AIO_ENROLLMENT_TOKEN: ${{ inputs.enrollment_token || '' }}
          DPC_AIO_ENROLLMENT_ENDPOINT: ${{ inputs.enrollment_endpoint || vars.DPC_AIO_ENROLLMENT_ENDPOINT || '' }}
          DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY: ${{ inputs.enrollment_signing_public_key || vars.DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY || '' }}
          DPC_AIO_POLICY_PROFILE: ${{ inputs.policy_profile || 'default' }}
          DPC_AIO_PROVISIONING_MODE: ${{ inputs.provisioning_mode || 'work-profile' }}
          DPC_AIO_ALLOW_OFFLINE: ${{ inputs.allow_offline || false }}
          DPC_AIO_ENROLLMENT_OFFLINE_MODE: ${{ inputs.enrollment_offline_mode || vars.DPC_AIO_ENROLLMENT_OFFLINE_MODE || 'ONLINE' }}
          DPC_AIO_OFFLINE_BUNDLE_ID: ${{ inputs.offline_bundle_id || vars.DPC_AIO_OFFLINE_BUNDLE_ID || '' }}
        run: |
          set -euo pipefail
          ./gradlew :app-dpc:assembleEnterpriseRelease

      - name: Collect AIO enrollment artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          apk="$(
            find apps/dpc/build/outputs/apk/enterprise/release \
              -type f \
              -name '*.apk' \
              -print \
            | sort \
            | head -n1
          )"

          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo "enterpriseRelease APK not found." >&2
            exit 1
          fi

          provisioning_dir="apps/dpc/build/outputs/provisioning/enterprise/release"

          required_files=(
            provisioning.json
            provisioning-payload.txt
            provisioning-metadata.json
            provisioning-qr.png
            work-profile-provisioning.json
            work-profile-provisioning-payload.txt
            work-profile-provisioning-metadata.json
            work-profile-qr.png
            device-owner-provisioning.json
            device-owner-provisioning-payload.txt
            device-owner-provisioning-metadata.json
            device-owner-qr.png
          )

          cp "$apk" dist/DPC-AIO-enterprise-release.apk

          for file in "${required_files[@]}"; do
            src="$provisioning_dir/$file"
            if [[ ! -f "$src" ]]; then
              echo "Missing provisioning artifact: $src" >&2
              exit 1
            fi
            cp "$src" dist/
          done

      - name: Verify enterprise release signing certificate
        shell: bash
        run: |
          set -euo pipefail

          apk="dist/DPC-AIO-enterprise-release.apk"
          apksigner_bin="$(
            find "$ANDROID_SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              -print \
            | sort -V \
            | tail -n1
          )"

          test -f "$apk"
          test -x "$apksigner_bin"

          "$apksigner_bin" verify --verbose "$apk"

          observed="$(
            "$apksigner_bin" verify --print-certs "$apk" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          expected="$(
            printf '%s' "$DPC_AIO_EXPECTED_SIGNING_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          if [[ -z "$observed" || "$observed" != "$expected" ]]; then
            echo "SIGNING_CERT_MISMATCH expected=$expected observed=$observed" >&2
            exit 1
          fi

          echo "APK signing certificate SHA-256: $observed"

      - name: Verify custom APK URL matches this build
        if: env.DPC_AIO_CUSTOM_APK_URL == 'true'
        shell: bash
        run: |
          set -euo pipefail

          downloaded="$RUNNER_TEMP/DPC-AIO-enterprise-release.custom.apk"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            "$DPC_AIO_PROVISIONING_APK_URL" \
            --output "$downloaded"

          if ! cmp -s dist/DPC-AIO-enterprise-release.apk "$downloaded"; then
            echo "Custom apk_url does not serve the exact APK produced by this run." >&2
            echo "Built APK:"
            sha256sum dist/DPC-AIO-enterprise-release.apk
            echo "Downloaded APK:"
            sha256sum "$downloaded"
            exit 1
          fi

          echo "Custom APK URL is byte-identical to the built release APK."

      - name: Validate enrollment QR files
        shell: bash
        run: |
          set -euo pipefail

          compat_mode="$(
            python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["provisioningMode"])' \
              dist/provisioning-metadata.json
          )"

          python3 tools/provisioning/verify_provisioning_qr.py \
            --json dist/provisioning.json \
            --qr dist/provisioning-qr.png \
            --apk dist/DPC-AIO-enterprise-release.apk \
            --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" \
            --expected-mode "$compat_mode" \
            > dist/provisioning-validation.json

          python3 tools/provisioning/verify_provisioning_qr.py \
            --json dist/work-profile-provisioning.json \
            --qr dist/work-profile-qr.png \
            --apk dist/DPC-AIO-enterprise-release.apk \
            --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" \
            --expected-mode work-profile \
            > dist/work-profile-validation.json

          python3 tools/provisioning/verify_provisioning_qr.py \
            --json dist/device-owner-provisioning.json \
            --qr dist/device-owner-qr.png \
            --apk dist/DPC-AIO-enterprise-release.apk \
            --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" \
            --expected-mode fully-managed \
            > dist/device-owner-validation.json

          cat dist/provisioning-validation.json
          cat dist/work-profile-validation.json
          cat dist/device-owner-validation.json

      - name: Build QR release bundle
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/release/build_qr_release_bundle.py \
            --dist dist \
            --version "$DPC_AIO_VERSION" \
            --apk-url "$DPC_AIO_PROVISIONING_APK_URL"

          test -f "dist/DPC-AIO-${DPC_AIO_VERSION}-QR-RELEASE-BUNDLE.zip"
          test -f "dist/DPC-AIO-${DPC_AIO_VERSION}-QR-RELEASE-BUNDLE.zip.sha256"
          test -f dist/QR-README.md
          test -f dist/RELEASE-INDEX.json
          test -f dist/SHA256SUMS.txt

      - name: Cleanup release signing material before third-party runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DPC_AIO_RELEASE_KEYSTORE_PATH:-}" ]]; then
            rm -f "$DPC_AIO_RELEASE_KEYSTORE_PATH"
          fi
          echo "Release signing keystore removed before emulator actions."

      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AOSP Device Owner runtime smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            python3 tools/runtime/android_device_owner_smoke.py
            --apk dist/DPC-AIO-enterprise-release.apk
            --out dist/android-runtime-smoke.json
            --expected-version ${{ env.DPC_AIO_VERSION }}

      - name: Upload Android runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DPC-AIO-android-runtime-smoke
          path: dist/android-runtime-smoke.json
          if-no-files-found: warn

      - name: Upload full build + enrollment artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DPC-AIO-enterpriseRelease-enrollment
          path: dist/
          if-no-files-found: warn

      - name: Upload build environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DPC-AIO-build-environment
          path: dist/build-environment.json
          if-no-files-found: ignore

      - name: Cleanup release signing material fallback
        if: always()
        shell: bash
        run: |
          if [[ -n "${DPC_AIO_RELEASE_KEYSTORE_PATH:-}" ]]; then
            rm -f "$DPC_AIO_RELEASE_KEYSTORE_PATH"
          fi

  publish:
    name: Publish verified release assets
    needs: build
    if: >-
      ${{
        needs.build.result == 'success' &&
        (
          github.ref_type == 'tag' ||
          (
            github.event_name == 'workflow_dispatch' &&
            (inputs.apk_url || '') == ''
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DPC-AIO-enterpriseRelease-enrollment
          path: dist

      - name: Resolve published APK URL
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/DPC-AIO-enterprise-release.apk"
          else
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DPC_AIO_CONTINUOUS_RELEASE_TAG}/DPC-AIO-enterprise-release.apk"
          fi

          echo "DPC_AIO_PROVISIONING_APK_URL=$url" >> "$GITHUB_ENV"
          echo "Published APK URL: $url"

      - name: Publish continuous enrollment assets
        if: github.event_name == 'workflow_dispatch' && (inputs.apk_url || '') == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$DPC_AIO_CONTINUOUS_RELEASE_TAG"
          api_ref="repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"

          if gh api "$api_ref" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "$api_ref" \
              -f sha="$GITHUB_SHA" \
              -F force=true \
              >/dev/null
          fi

          notes="Continuously updated DPC-AIO enrollment artifacts from commit ${GITHUB_SHA}. Includes Work Profile, Device Owner, compatibility QR assets, runtime evidence and the verified QR Release Bundle."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit \
              "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DPC-AIO Continuous Enrollment" \
              --notes "$notes" \
              --prerelease
          else
            gh release create \
              "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DPC-AIO Continuous Enrollment" \
              --notes "$notes" \
              --prerelease
          fi

          gh release upload \
            "$tag" \
            dist/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify continuous APK is publicly downloadable
        if: github.event_name == 'workflow_dispatch' && (inputs.apk_url || '') == ''
        shell: bash
        run: |
          set -euo pipefail

          downloaded="$RUNNER_TEMP/DPC-AIO-enterprise-release.continuous.downloaded.apk"
          matched=0

          for attempt in 1 2 3 4 5 6; do
            rm -f "$downloaded"

            if curl \
              --fail \
              --location \
              --connect-timeout 15 \
              --max-time 180 \
              "$DPC_AIO_PROVISIONING_APK_URL" \
              --output "$downloaded" \
              && cmp -s dist/DPC-AIO-enterprise-release.apk "$downloaded"
            then
              matched=1
              break
            fi

            echo "Continuous asset not ready or not matching yet (attempt $attempt/6)."
            sleep 5
          done

          if [[ "$matched" != "1" ]]; then
            echo "Continuous enrollment APK is not publicly downloadable or does not match this build." >&2
            sha256sum dist/DPC-AIO-enterprise-release.apk
            [[ -f "$downloaded" ]] && sha256sum "$downloaded" || true
            exit 1
          fi

          echo "Continuous enrollment APK URL is public and byte-identical to this build."

      - name: Publish tag release assets
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          notes="DPC-AIO verified release from commit ${GITHUB_SHA}. Includes Work Profile, Device Owner, compatibility QR assets, runtime evidence and DPC-AIO-${DPC_AIO_VERSION}-QR-RELEASE-BUNDLE.zip."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit \
              "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "$notes"
          else
            gh release create \
              "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes"
          fi

          gh release upload \
            "$tag" \
            dist/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify tag release APK is publicly downloadable
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          downloaded="$RUNNER_TEMP/DPC-AIO-enterprise-release.tag.downloaded.apk"
          matched=0

          for attempt in 1 2 3 4 5 6; do
            rm -f "$downloaded"

            if curl \
              --fail \
              --location \
              --connect-timeout 15 \
              --max-time 180 \
              "$DPC_AIO_PROVISIONING_APK_URL" \
              --output "$downloaded" \
              && cmp -s dist/DPC-AIO-enterprise-release.apk "$downloaded"
            then
              matched=1
              break
            fi

            echo "Tag release asset not ready or not matching yet (attempt $attempt/6)."
            sleep 5
          done

          if [[ "$matched" != "1" ]]; then
            echo "Tag release APK is not publicly downloadable or does not match this build." >&2
            sha256sum dist/DPC-AIO-enterprise-release.apk
            [[ -f "$downloaded" ]] && sha256sum "$downloaded" || true
            exit 1
          fi

          echo "Tag release APK URL is public and byte-identical to this build."
