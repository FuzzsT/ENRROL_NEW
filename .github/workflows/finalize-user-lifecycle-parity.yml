name: Finalize user lifecycle parity

on:
  push:
    branches:
      - feat/dpc-aio-130-user-lifecycle-parity

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android 17 SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          list="$RUNNER_TEMP/android-sdk-packages.txt"
          "$sdkmanager_bin" --list --channel=3 > "$list"
          platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$list" | head -n1)"
          if [[ -z "$platform_pkg" ]]; then
            platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^platforms;android-37\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          fi
          if [[ -z "$platform_pkg" ]] && grep -q 'platforms;android-CinnamonBun' "$list"; then
            platform_pkg='platforms;android-CinnamonBun'
          fi
          [[ -n "$platform_pkg" ]] || { echo 'Android 17 platform not found' >&2; exit 1; }
          "$sdkmanager_bin" "$platform_pkg" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then
            installed="$ANDROID_SDK_ROOT/platforms/${platform_pkg#platforms;}"
            [[ -d "$installed" ]] && ln -sfn "$installed" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
      - name: Provision host test dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt
      - name: Focused Task 9 gates
        run: |
          python3 tools/tests/test_123_testdpc_parity_catalog_169.py
          python3 tools/tests/test_124_parity_handler_coverage.py
          python3 tools/tests/test_132_user_lifecycle_parity_contract.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
      - name: Canonical host suite with production workflow topology
        run: |
          rm -f .github/workflows/verify-user-lifecycle-parity-red.yml
          rm -f .github/workflows/implement-user-lifecycle-parity.yml
          rm -f .github/workflows/verify-user-lifecycle-parity-compile.yml
          rm -f .github/workflows/finalize-user-lifecycle-parity.yml
          rm -f tools/patch_user_lifecycle_parity.py
          ./tools/run_host_tests.sh
      - name: Compile enterprise app
        run: ./gradlew --no-daemon :app-dpc:compileEnterpriseReleaseKotlin
      - name: Verify production workflow topology
        run: |
          rm -f .github/workflows/verify-user-lifecycle-parity-red.yml
          rm -f .github/workflows/implement-user-lifecycle-parity.yml
          rm -f .github/workflows/verify-user-lifecycle-parity-compile.yml
          rm -f .github/workflows/finalize-user-lifecycle-parity.yml
          count="$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$count" = "2"
          test -f .github/workflows/build-aio-enrollment.yml
          test -f .github/workflows/build-emergency-enrollment.yml
