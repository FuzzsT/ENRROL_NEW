name: TEMP future age guard patch

on:
  push:
    branches:
      - fix/activity-launcher-future-age-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/activity-launcher-future-age-guard
          fetch-depth: 0

      - name: Apply exact future-age guard patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('apps/dpc/app/src/main/kotlin/io/dpcaio/app/ActivityLauncherHubActivity.kt')
          source = path.read_text(encoding='utf-8')

          def git_blob_sha(text: str) -> str:
              data = text.encode('utf-8')
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          expected_before = '3be616d905c7c97b1ba7f078687b96d1982d7fcf'
          expected_after = '14761d05dbd9b71e8c81a0e5f4ad31fcee66142d'
          actual_before = git_blob_sha(source)
          if actual_before != expected_before:
              raise SystemExit(f'Unexpected input blob: {actual_before} != {expected_before}')

          anchor = '    private fun renderDateAgeBar() {'
          helper = (
              '    private fun isTimestampWithinAge(timestamp: Long, now: Long, maxAgeMs: Long): Boolean =\n'
              '        timestamp > 0L && timestamp <= now && now - timestamp <= maxAgeMs\n'
              '\n'
          )
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one renderDateAgeBar anchor, got {source.count(anchor)}')
          source = source.replace(anchor, helper + anchor, 1)

          replacements = {
              'InstallAgeFilter.HOURS_24 -> sourceFiltered.filter { it.firstInstallTime > 0 && now - it.firstInstallTime <= INSTALL_AGE_24H_MS }':
                  'InstallAgeFilter.HOURS_24 -> sourceFiltered.filter { isTimestampWithinAge(it.firstInstallTime, now, INSTALL_AGE_24H_MS) }',
              'InstallAgeFilter.DAYS_7 -> sourceFiltered.filter { it.firstInstallTime > 0 && now - it.firstInstallTime <= INSTALL_AGE_7D_MS }':
                  'InstallAgeFilter.DAYS_7 -> sourceFiltered.filter { isTimestampWithinAge(it.firstInstallTime, now, INSTALL_AGE_7D_MS) }',
              'InstallAgeFilter.DAYS_30 -> sourceFiltered.filter { it.firstInstallTime > 0 && now - it.firstInstallTime <= INSTALL_AGE_30D_MS }':
                  'InstallAgeFilter.DAYS_30 -> sourceFiltered.filter { isTimestampWithinAge(it.firstInstallTime, now, INSTALL_AGE_30D_MS) }',
              'UpdateAgeFilter.HOURS_24 -> ageFiltered.filter { it.lastUpdateTime > 0 && now - it.lastUpdateTime <= UPDATE_AGE_24H_MS }':
                  'UpdateAgeFilter.HOURS_24 -> ageFiltered.filter { isTimestampWithinAge(it.lastUpdateTime, now, UPDATE_AGE_24H_MS) }',
              'UpdateAgeFilter.DAYS_7 -> ageFiltered.filter { it.lastUpdateTime > 0 && now - it.lastUpdateTime <= UPDATE_AGE_7D_MS }':
                  'UpdateAgeFilter.DAYS_7 -> ageFiltered.filter { isTimestampWithinAge(it.lastUpdateTime, now, UPDATE_AGE_7D_MS) }',
              'UpdateAgeFilter.DAYS_30 -> ageFiltered.filter { it.lastUpdateTime > 0 && now - it.lastUpdateTime <= UPDATE_AGE_30D_MS }':
                  'UpdateAgeFilter.DAYS_30 -> ageFiltered.filter { isTimestampWithinAge(it.lastUpdateTime, now, UPDATE_AGE_30D_MS) }',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one old predicate: {old!r}; got {source.count(old)}')
              source = source.replace(old, new, 1)

          actual_after = git_blob_sha(source)
          if actual_after != expected_after:
              raise SystemExit(f'Unexpected output blob: {actual_after} != {expected_after}')
          path.write_text(source, encoding='utf-8')
          print(f'PATCH_BLOB_OK: {actual_after}')
          PY

      - name: Verify focused contract and diff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_activity_launcher_app_manager_contract.py
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "apps/dpc/app/src/main/kotlin/io/dpcaio/app/ActivityLauncherHubActivity.kt"
          git diff -- apps/dpc/app/src/main/kotlin/io/dpcaio/app/ActivityLauncherHubActivity.kt

      - name: Commit exact GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/dpc/app/src/main/kotlin/io/dpcaio/app/ActivityLauncherHubActivity.kt
          git commit -m 'fix: reject future Activity Launcher age timestamps'
          git push origin HEAD:fix/activity-launcher-future-age-guard
