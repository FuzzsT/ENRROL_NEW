name: Finalize DPC-AIO 1.3.0 release contracts

on:
  push:
    branches: [main]
    paths: [.github/workflows/finalize-dpc-130.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Synchronize 1.3.0 active contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          ROOT=Path.cwd()
          def read(path): return (ROOT/path).read_text('utf-8')
          def write(path,text): (ROOT/path).write_text(text,'utf-8')
          def once(path,old,new):
              text=read(path); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match for {old!r}, got {count}')
              write(path,text.replace(old,new,1))
          gradle=read('apps/dpc/app/build.gradle.kts')
          assert re.search(r'versionCode\s*=\s*27\b',gradle), 'versionCode 27 missing'
          assert 'versionName = "1.3.0"' in gradle, 'versionName 1.3.0 missing'

          once('tools/tests/test_release_version_contract.py', "EXPECTED = '1.2.0'\nEXPECTED_CODE = '26'", "EXPECTED = '1.3.0'\nEXPECTED_CODE = '27'")

          p='tools/tests/test_114_qr_release_bundle_contract.py'; t=read(p)
          replacements=[
              ('versionName = "1.2.0"','versionName = "1.3.0"'),
              ('versionName 1.2.0 missing','versionName 1.3.0 missing'),
              ('int(m.group(1)) < 26','int(m.group(1)) < 27'),
              ('versionCode >=26 required','versionCode >=27 required'),
              ('DPC-AIO 1.2.0','DPC-AIO 1.3.0'),
              ('README 1.2.0 QR release highlights missing','README 1.3.0 QR release highlights missing'),
              ("obj.get('version')!='1.2.0'","obj.get('version')!='1.3.0'"),
              ('release report version !=1.2.0','release report version !=1.3.0'),
              ('1.2.0 contract not wired into host tests','1.3.0 contract not wired into host tests'),
          ]
          for old,new in replacements:
              if old not in t: raise SystemExit(f'{p}: missing {old!r}')
              t=t.replace(old,new)
          write(p,t)

          once('README.md','# DPC-AIO 1.2.0 — Enterprise + Samsung OEM AIO','# DPC-AIO 1.3.0 — TestDPC Parity + Enterprise + Samsung OEM AIO')
          once('README.md','## 1.2.0 highlights','## 1.3.0 highlights')
          once('README.md','DPC-AIO-1.2.0-QR-RELEASE-BUNDLE.zip','DPC-AIO-1.3.0-QR-RELEASE-BUNDLE.zip')

          for path in ('docs/releases/PACKAGE-INFO.txt','docs/publishing/GITHUB-READY.md','docs/history/checkpoints/CHECKPOINT.md'):
              t=read(path)
              if '1.3.0' not in t:
                  if '1.2.0' not in t: raise SystemExit(f'{path}: neither 1.2.0 nor 1.3.0 found')
                  t=t.replace('1.2.0','1.3.0')
                  if path.endswith('CHECKPOINT.md'): t=t.replace('versionCode 26','versionCode 27')
                  write(path,t)

          p='RELEASE-VERIFICATION.json'; obj=json.loads(read(p))
          obj['version']='1.3.0'
          if isinstance(obj.get('target'),dict) and isinstance(obj['target'].get('name'),str):
              obj['target']['name']=obj['target']['name'].replace('DPC-AIO 1.2.0','DPC-AIO 1.3.0 TestDPC Parity')
          raw=json.dumps(obj,indent=2,ensure_ascii=False)+'\n'
          raw=raw.replace('dpcVersion=1.2.0','dpcVersion=1.3.0').replace('DPC-AIO-1.2.0-QR-RELEASE-BUNDLE.zip','DPC-AIO-1.3.0-QR-RELEASE-BUNDLE.zip')
          write(p,raw)

          p='tools/run_host_tests.sh'; t=read(p)
          line='python3 "$ROOT/tools/tests/test_123_testdpc_parity_catalog_169.py"\n'
          if line not in t:
              marker='python3 "$ROOT/tools/tests/test_release_version_contract.py"\n'
              if t.count(marker)!=1: raise SystemExit(f'{p}: release marker count={t.count(marker)}')
              t=t.replace(marker,line+marker,1); write(p,t)
          print('SYNC_DPC_130_CONTRACTS: PASS')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Resolve Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          list="$RUNNER_TEMP/android-sdk-packages.txt"
          "$sdkmanager_bin" --list --channel=3 > "$list"
          platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$list" | head -n1)"
          if [[ -z "$platform_pkg" ]]; then platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^platforms;android-37\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"; fi
          if [[ -z "$platform_pkg" ]] && grep -q 'platforms;android-CinnamonBun' "$list"; then platform_pkg='platforms;android-CinnamonBun'; fi
          [[ -n "$platform_pkg" ]] || { echo 'Android 17 platform not found' >&2; exit 1; }
          build_tools_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^build-tools;37\.[0-9]+\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg='build-tools;36.0.0'
          "$sdkmanager_bin" "$platform_pkg" "$build_tools_pkg" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then installed="$ANDROID_SDK_ROOT/platforms/${platform_pkg#platforms;}"; [[ -d "$installed" ]] && ln -sfn "$installed" "$ANDROID_SDK_ROOT/platforms/android-37"; fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Run final parity release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 tools/tests/test_123_testdpc_parity_catalog_169.py
          python3 tools/tests/test_release_version_contract.py
          python3 tools/tests/test_114_qr_release_bundle_contract.py
          python3 tools/tests/test_102_qr_production_readiness_contract.py
          python3 tools/tests/test_113_github_upload_ready_contract.py
          python3 tools/tests/test_release_secret_scan.py
          python3 tools/tests/test_non_sdk_api_scan.py
          bash -n tools/run_host_tests.sh
          python3 - <<'PY'
          import yaml
          for p in ('.github/workflows/build-aio-enrollment.yml','.github/workflows/build-emergency-enrollment.yml'): yaml.safe_load(open(p,encoding='utf-8'))
          print('WORKFLOW_YAML_PARSE: PASS')
          PY
          chmod +x gradlew
          ./gradlew :policy-core:compileKotlin :policy-core:compileTestKotlin :app-dpc:compileEnterpriseReleaseKotlin --console=plain --stacktrace

      - name: Commit synchronized 1.3.0 contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/dpc/app/build.gradle.kts tools/tests/test_release_version_contract.py tools/tests/test_114_qr_release_bundle_contract.py README.md docs/releases/PACKAGE-INFO.txt docs/publishing/GITHUB-READY.md docs/history/checkpoints/CHECKPOINT.md RELEASE-VERIFICATION.json tools/run_host_tests.sh
          git diff --cached --quiet && { echo 'No synchronization changes'; exit 0; }
          git commit -m 'chore: synchronize DPC-AIO 1.3.0 release contracts'
          git push origin HEAD:main
