name: Implement user lifecycle parity

on:
  push:
    branches:
      - feat/dpc-aio-130-user-lifecycle-parity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire catalog router and host runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          catalog_path = Path('apps/dpc/modules/policy/core/src/main/kotlin/io/dpcaio/policy/parity/TestDpcParityCatalog.kt')
          catalog = catalog_path.read_text('utf-8')
          replacements = {
            'create_managed_profile': '        entry(testDpcKey = "create_managed_profile", googleTitle = "@string/create_managed_profile", category = "@string/user_management", state = TestDpcImplementationState.MODERN_EQUIVALENT, destination = ParityDestination.WORK_PROFILE_COPE, minSdk = 26, owner = OwnerRequirement.DEVICE_OWNER, unavailableReason = "Use the existing DPC-AIO Work Profile / COPE lifecycle surface.", replacementGuidance = "Use Work Profile / COPE to provision and manage the managed profile.", requiredFeatures = setOf(PlatformFeature.MANAGED_USERS)),',
            'create_and_manage_user': '        entry(testDpcKey = "create_and_manage_user", googleTitle = "@string/create_and_manage_user", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.create", minSdk = 24, owner = OwnerRequirement.DEVICE_OWNER, requiredFeatures = setOf(PlatformFeature.MANAGED_USERS), inputs = listOf(ParityInputField(key = "name", label = "User name", type = ParityInputType.TEXT), ParityInputField(key = "flags", label = "Create-user flags (integer, optional)", type = ParityInputType.INTEGER, required = false))),',
            'remove_user': '        entry(testDpcKey = "remove_user", googleTitle = "@string/remove_user", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.remove", minSdk = 21, owner = OwnerRequirement.DEVICE_OWNER, requiredFeatures = setOf(PlatformFeature.MANAGED_USERS), destructive = true, inputs = listOf(ParityInputField(key = "user_serial", label = "User serial", type = ParityInputType.LONG))),',
            'switch_user': '        entry(testDpcKey = "switch_user", googleTitle = "@string/switch_user", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.switch", minSdk = 21, owner = OwnerRequirement.DEVICE_OWNER, requiredFeatures = setOf(PlatformFeature.MANAGED_USERS), inputs = listOf(ParityInputField(key = "user_serial", label = "User serial", type = ParityInputType.LONG))),',
            'start_user_in_background': '        entry(testDpcKey = "start_user_in_background", googleTitle = "@string/start_user_in_background", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.start_background", minSdk = 28, owner = OwnerRequirement.DEVICE_OWNER, requiredFeatures = setOf(PlatformFeature.MANAGED_USERS), inputs = listOf(ParityInputField(key = "user_serial", label = "User serial", type = ParityInputType.LONG))),',
            'stop_user': '        entry(testDpcKey = "stop_user", googleTitle = "@string/stop_user", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.stop", minSdk = 28, owner = OwnerRequirement.DEVICE_OWNER, requiredFeatures = setOf(PlatformFeature.MANAGED_USERS), destructive = true, inputs = listOf(ParityInputField(key = "user_serial", label = "User serial", type = ParityInputType.LONG))),',
            'logout_user': '        entry(testDpcKey = "logout_user", googleTitle = "@string/logout_user", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.logout", minSdk = 28, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER),',
            'enable_logout': '        entry(testDpcKey = "enable_logout", googleTitle = "@string/enable_logout", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.logout_enabled", minSdk = 28, owner = OwnerRequirement.DEVICE_OWNER, inputs = listOf(ParityInputField(key = "enabled", label = "Enable logout", type = ParityInputType.BOOLEAN))),',
            'set_user_session_message': '        entry(testDpcKey = "set_user_session_message", googleTitle = "@string/set_user_session_message", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.session_messages", minSdk = 28, owner = OwnerRequirement.DEVICE_OWNER, inputs = listOf(ParityInputField(key = "start_message", label = "Start session message (blank clears)", type = ParityInputType.TEXT, required = false), ParityInputField(key = "end_message", label = "End session message (blank clears)", type = ParityInputType.TEXT, required = false))),',
            'affiliated_user': '        entry(testDpcKey = "affiliated_user", googleTitle = "@string/affiliated_user", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.is_affiliated", minSdk = 28, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER),',
            'ephemeral_user': '        entry(testDpcKey = "ephemeral_user", googleTitle = "@string/ephemeral_user", category = "@string/user_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.is_ephemeral", minSdk = 28, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER),',
            'set_user_restrictions': '        entry(testDpcKey = "set_user_restrictions", googleTitle = "@string/user_restrictions_preference_title", category = "@string/user_restrictions_management_title", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.restriction", minSdk = 21, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER, inputs = listOf(ParityInputField(key = "restriction_key", label = "UserManager restriction key", type = ParityInputType.TEXT), ParityInputField(key = "enabled", label = "Enable restriction", type = ParityInputType.BOOLEAN))),',
            'set_user_restrictions_parent': '        entry(testDpcKey = "set_user_restrictions_parent", googleTitle = "@string/user_restrictions_parent_preference_title", category = "@string/user_restrictions_management_title", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.restriction_parent", minSdk = 30, owner = OwnerRequirement.COPE, inputs = listOf(ParityInputField(key = "restriction_key", label = "Parent UserManager restriction key", type = ParityInputType.TEXT), ParityInputField(key = "enabled", label = "Enable restriction", type = ParityInputType.BOOLEAN))),',
            'set_short_support_message': '        entry(testDpcKey = "set_short_support_message", googleTitle = "@string/set_short_support_message", category = "@string/support_messages", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.short_support", minSdk = 24, inputs = listOf(ParityInputField(key = "message", label = "Short support message (blank clears)", type = ParityInputType.TEXT, required = false))),',
            'set_long_support_message': '        entry(testDpcKey = "set_long_support_message", googleTitle = "@string/set_long_support_message", category = "@string/support_messages", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "user.long_support", minSdk = 24, inputs = listOf(ParityInputField(key = "message", label = "Long support message (blank clears)", type = ParityInputType.TEXT, required = false))),',
            'request_bugreport': '        entry(testDpcKey = "request_bugreport", googleTitle = "@string/request_bugreport", category = "@string/device_owner_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "device.request_bugreport", minSdk = 24, owner = OwnerRequirement.DEVICE_OWNER),',
            'enable_backup_service': '        entry(testDpcKey = "enable_backup_service", googleTitle = "@string/enable_backup_service", category = "@string/device_owner_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "device.backup_service", minSdk = 26, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER, inputs = listOf(ParityInputField(key = "enabled", label = "Enable backup service", type = ParityInputType.BOOLEAN))),',
            'common_criteria_mode': '        entry(testDpcKey = "common_criteria_mode", googleTitle = "@string/common_criteria_mode", category = "@string/device_owner_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "device.common_criteria", minSdk = 30, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER, inputs = listOf(ParityInputField(key = "enabled", label = "Enable Common Criteria mode", type = ParityInputType.BOOLEAN))),',
            'remove_device_owner': '        entry(testDpcKey = "remove_device_owner", googleTitle = "@string/remove_device_owner", category = "@string/device_owner_management", state = TestDpcImplementationState.DEPRECATED_UNAVAILABLE, minSdk = 21, owner = OwnerRequirement.DEVICE_OWNER, destructive = true, unavailableReason = "Legacy clearDeviceOwnerApp is deprecated since API 26 and documented for testing only; DPC-AIO does not expose it as a parity action.", replacementGuidance = "Use factory reset and re-enrollment to remove device-owner management cleanly."),',
            'reboot': '        entry(testDpcKey = "reboot", googleTitle = "@string/reboot", category = "@string/device_owner_management", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "device.reboot", minSdk = 24, owner = OwnerRequirement.DEVICE_OWNER, destructive = true),',
            'remove_managed_profile': '        entry(testDpcKey = "remove_managed_profile", googleTitle = "@string/remove_managed_profile", category = "@string/data_wipe_section", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "device.wipe_profile", minSdk = 21, owner = OwnerRequirement.PROFILE_OWNER, destructive = true, inputs = listOf(ParityInputField(key = "flags", label = "Wipe flags (integer, optional)", type = ParityInputType.INTEGER, required = false))),',
            'factory_reset_device': '        entry(testDpcKey = "factory_reset_device", googleTitle = "@string/factory_reset_device", category = "@string/data_wipe_section", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "device.factory_reset", minSdk = 21, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER, destructive = true, inputs = listOf(ParityInputField(key = "flags", label = "Wipe flags (integer, optional)", type = ParityInputType.INTEGER, required = false))),',
            'transfer_ownership_to_component': '        entry(testDpcKey = "transfer_ownership_to_component", googleTitle = "@string/transfer_ownership_to_component", category = "@string/transfer_ownership", state = TestDpcImplementationState.IMPLEMENT_PUBLIC_API, handlerId = "device.transfer_ownership", minSdk = 28, owner = OwnerRequirement.DEVICE_OR_PROFILE_OWNER, destructive = true, inputs = listOf(ParityInputField(key = "target_component", label = "Target admin component", type = ParityInputType.COMPONENT_NAME))),',
          }
          for key, new_line in replacements.items():
              pattern = rf'^\s*entry\(testDpcKey = "{re.escape(key)}".*$'
              catalog, count = re.subn(pattern, new_line, catalog, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'CATALOG_REPLACE_FAILED:{key}:{count}')
          catalog_path.write_text(catalog, 'utf-8')

          router_path = Path('apps/dpc/app/src/main/kotlin/io/dpcaio/app/TestDpcParityActionRouter.kt')
          router = router_path.read_text('utf-8')
          import_anchor = 'import io.dpcaio.policy.android.parity.AndroidNetworkParityGateway\n'
          import_line = 'import io.dpcaio.policy.android.parity.AndroidUserParityGateway\n'
          if import_line not in router:
              router = router.replace(import_anchor, import_anchor + import_line, 1)
          field_anchor = '    private val networkParityGateway = AndroidNetworkParityGateway(appContext, admin)\n'
          field_line = '    private val userParityGateway = AndroidUserParityGateway(appContext, admin)\n'
          if field_line not in router:
              router = router.replace(field_anchor, field_anchor + field_line, 1)
          handler_anchor = '        "network.wifi_ssid_policy" to ParityActionHandler(::setWifiSsidPolicy),\n'
          handler_block = '''        "user.create" to ParityActionHandler(::createManagedUser),
        "user.remove" to ParityActionHandler(::removeManagedUser),
        "user.switch" to ParityActionHandler(::switchManagedUser),
        "user.start_background" to ParityActionHandler(::startManagedUserInBackground),
        "user.stop" to ParityActionHandler(::stopManagedUser),
        "user.logout" to ParityActionHandler(::logoutManagedUser),
        "user.logout_enabled" to ParityActionHandler(::setLogoutEnabled),
        "user.session_messages" to ParityActionHandler(::setUserSessionMessages),
        "user.is_affiliated" to ParityActionHandler(::queryAffiliatedUser),
        "user.is_ephemeral" to ParityActionHandler(::queryEphemeralUser),
        "user.restriction" to ParityActionHandler { request -> setUserRestriction(request, false) },
        "user.restriction_parent" to ParityActionHandler { request -> setUserRestriction(request, true) },
        "user.short_support" to ParityActionHandler(::setShortSupportMessage),
        "user.long_support" to ParityActionHandler(::setLongSupportMessage),
        "device.request_bugreport" to ParityActionHandler(::requestBugreport),
        "device.backup_service" to ParityActionHandler(::setBackupServiceEnabled),
        "device.common_criteria" to ParityActionHandler(::setCommonCriteriaModeEnabled),
        "device.reboot" to ParityActionHandler(::rebootDevice),
        "device.wipe_profile" to ParityActionHandler(::wipeManagedProfile),
        "device.factory_reset" to ParityActionHandler(::factoryResetDevice),
        "device.transfer_ownership" to ParityActionHandler(::transferOwnership),
'''
          if '"user.create" to ParityActionHandler' not in router:
              if handler_anchor not in router:
                  raise SystemExit('ROUTER_HANDLER_ANCHOR_MISSING')
              router = router.replace(handler_anchor, handler_anchor + handler_block, 1)

          function_anchor = '    private fun setProfileName(request: ParityActionRequest): PolicyResult<String> {'
          function_block = '''    private fun createManagedUser(request: ParityActionRequest): PolicyResult<String> {
        val name = requiredValue(request, "name")
            ?: return invalidInput("name", "user name is required")
        val rawFlags = request.values["flags"]?.trim().orEmpty()
        val flags = if (rawFlags.isBlank()) 0 else rawFlags.toIntOrNull()
            ?: return invalidInput("flags", "expected integer flags")
        return userParityGateway.createAndManageUser(name, flags).asText { serial ->
            "userSerial=${serial ?: "unknown"}"
        }
    }

    private fun removeManagedUser(request: ParityActionRequest): PolicyResult<String> {
        val serial = requiredValue(request, "user_serial")
            ?: return invalidInput("user_serial", "user serial is required")
        return userParityGateway.removeUser(serial).asText { "removedSerial=$serial" }
    }

    private fun switchManagedUser(request: ParityActionRequest): PolicyResult<String> {
        val serial = requiredValue(request, "user_serial")
            ?: return invalidInput("user_serial", "user serial is required")
        return userParityGateway.switchUser(serial).asText { "switchSerial=$serial" }
    }

    private fun startManagedUserInBackground(request: ParityActionRequest): PolicyResult<String> {
        val serial = requiredValue(request, "user_serial")
            ?: return invalidInput("user_serial", "user serial is required")
        return userParityGateway.startUserInBackground(serial).asText { result -> "result=${result ?: -1},serial=$serial" }
    }

    private fun stopManagedUser(request: ParityActionRequest): PolicyResult<String> {
        val serial = requiredValue(request, "user_serial")
            ?: return invalidInput("user_serial", "user serial is required")
        return userParityGateway.stopUser(serial).asText { result -> "result=${result ?: -1},serial=$serial" }
    }

    private fun logoutManagedUser(request: ParityActionRequest): PolicyResult<String> =
        userParityGateway.logoutUser().asText { result -> "result=${result ?: -1}" }

    private fun setLogoutEnabled(request: ParityActionRequest): PolicyResult<String> {
        val enabled = parseBoolean(request.values["enabled"])
            ?: return invalidInput("enabled", "expected true/false")
        return userParityGateway.setLogoutEnabled(enabled).asText { "enabled=$enabled" }
    }

    private fun setUserSessionMessages(request: ParityActionRequest): PolicyResult<String> {
        val start = request.values["start_message"]?.takeIf { it.isNotBlank() }
        val end = request.values["end_message"]?.takeIf { it.isNotBlank() }
        return userParityGateway.setUserSessionMessages(start, end).asText {
            "start=${if (start == null) "<cleared>" else "set"},end=${if (end == null) "<cleared>" else "set"}"
        }
    }

    private fun queryAffiliatedUser(request: ParityActionRequest): PolicyResult<String> =
        userParityGateway.isAffiliatedUser().asText { affiliated -> "affiliated=${affiliated == true}" }

    private fun queryEphemeralUser(request: ParityActionRequest): PolicyResult<String> =
        userParityGateway.isEphemeralUser().asText { ephemeral -> "ephemeral=${ephemeral == true}" }

    private fun setUserRestriction(request: ParityActionRequest, parent: Boolean): PolicyResult<String> {
        val key = requiredValue(request, "restriction_key")
            ?: return invalidInput("restriction_key", "UserManager restriction key is required")
        val enabled = parseBoolean(request.values["enabled"])
            ?: return invalidInput("enabled", "expected true/false")
        return userParityGateway.setUserRestriction(key, enabled, parent).asText {
            "restriction=$key,enabled=$enabled,parent=$parent"
        }
    }

    private fun setShortSupportMessage(request: ParityActionRequest): PolicyResult<String> {
        val message = request.values["message"]?.takeIf { it.isNotBlank() }
        return userParityGateway.setShortSupportMessage(message).asText { "shortSupport=${if (message == null) "cleared" else "set"}" }
    }

    private fun setLongSupportMessage(request: ParityActionRequest): PolicyResult<String> {
        val message = request.values["message"]?.takeIf { it.isNotBlank() }
        return userParityGateway.setLongSupportMessage(message).asText { "longSupport=${if (message == null) "cleared" else "set"}" }
    }

    private fun requestBugreport(request: ParityActionRequest): PolicyResult<String> =
        userParityGateway.requestBugreport().asText { "bugreport=requested" }

    private fun setBackupServiceEnabled(request: ParityActionRequest): PolicyResult<String> {
        val enabled = parseBoolean(request.values["enabled"])
            ?: return invalidInput("enabled", "expected true/false")
        return userParityGateway.setBackupServiceEnabled(enabled).asText { "backupService=$enabled" }
    }

    private fun setCommonCriteriaModeEnabled(request: ParityActionRequest): PolicyResult<String> {
        val enabled = parseBoolean(request.values["enabled"])
            ?: return invalidInput("enabled", "expected true/false")
        return userParityGateway.setCommonCriteriaModeEnabled(enabled).asText { "commonCriteria=$enabled" }
    }

    private fun rebootDevice(request: ParityActionRequest): PolicyResult<String> =
        userParityGateway.reboot().asText { "reboot=requested" }

    private fun wipeManagedProfile(request: ParityActionRequest): PolicyResult<String> {
        val flags = parseOptionalFlags(request) ?: return invalidInput("flags", "expected integer flags")
        return userParityGateway.wipeManagedProfile(flags).asText { "profileWipe=requested,flags=$flags" }
    }

    private fun factoryResetDevice(request: ParityActionRequest): PolicyResult<String> {
        val flags = parseOptionalFlags(request) ?: return invalidInput("flags", "expected integer flags")
        return userParityGateway.factoryResetDevice(flags).asText { "factoryReset=requested,flags=$flags" }
    }

    private fun transferOwnership(request: ParityActionRequest): PolicyResult<String> {
        val raw = requiredValue(request, "target_component")
            ?: return invalidInput("target_component", "target admin component is required")
        val target = ComponentName.unflattenFromString(raw)
            ?: return invalidInput("target_component", "expected package/class component")
        return userParityGateway.transferOwnership(target).asText { "target=${target.flattenToShortString()}" }
    }

    private fun parseOptionalFlags(request: ParityActionRequest): Int? {
        val raw = request.values["flags"]?.trim().orEmpty()
        return if (raw.isBlank()) 0 else raw.toIntOrNull()
    }

'''
          if 'private fun createManagedUser(' not in router:
              if function_anchor not in router:
                  raise SystemExit('ROUTER_FUNCTION_ANCHOR_MISSING')
              router = router.replace(function_anchor, function_block + function_anchor, 1)
          router_path.write_text(router, 'utf-8')

          runner_path = Path('tools/run_host_tests.sh')
          runner = runner_path.read_text('utf-8')
          addition = 'python3 "$ROOT/tools/tests/test_132_user_lifecycle_parity_contract.py"\n'
          if addition not in runner:
              anchor = 'python3 "$ROOT/tools/tests/test_131_network_wifi_parity_contract.py"\n'
              if anchor not in runner:
                  anchor = 'python3 "$ROOT/tools/tests/test_133_samsung_firmware_diagnostics_contract.py"\n'
                  if anchor not in runner:
                      raise SystemExit('RUNNER_ANCHOR_MISSING')
                  runner = runner.replace(anchor, addition + anchor, 1)
              else:
                  runner = runner.replace(anchor, anchor + addition, 1)
              runner_path.write_text(runner, 'utf-8')
          PY
      - name: Commit implementation wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dpc/modules/policy/core/src/main/kotlin/io/dpcaio/policy/parity/TestDpcParityCatalog.kt \
                  apps/dpc/app/src/main/kotlin/io/dpcaio/app/TestDpcParityActionRouter.kt \
                  tools/run_host_tests.sh
          git commit -m "feat: wire user lifecycle parity actions"
          git push origin HEAD:feat/dpc-aio-130-user-lifecycle-parity
