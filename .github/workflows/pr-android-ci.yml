name: Android CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install provisioning test dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Run host/source test suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/run_host_tests.sh
          ./tools/run_host_tests.sh

  apk-build:
    name: Enterprise debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android 17 SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          SDK_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          "$SDKMANAGER" --list --channel=3 > "$SDK_LIST"

          has_package() {
            awk -F'|' -v wanted="$1" '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 == wanted { found=1 }
              END { exit(found ? 0 : 1) }
            ' "$SDK_LIST"
          }

          platform_pkg=""
          if has_package "platforms;android-37"; then
            platform_pkg="platforms;android-37"
          else
            platform_pkg="$(
              awk -F'|' '
                { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
                $1 ~ /^platforms;android-37\.[0-9]+$/ { print $1 }
              ' "$SDK_LIST" | sort -V | tail -n1
            )"
          fi
          if [[ -z "$platform_pkg" ]] && has_package "platforms;android-CinnamonBun"; then
            platform_pkg="platforms;android-CinnamonBun"
          fi
          if [[ -z "$platform_pkg" ]]; then
            echo "Android 17 platform not found." >&2
            grep -E 'platforms;android-(37|CinnamonBun)' "$SDK_LIST" || true
            exit 1
          fi

          build_tools_pkg="$(
            awk -F'|' '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 ~ /^build-tools;37\./ { print $1 }
            ' "$SDK_LIST" | sort -V | tail -n1
          )"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg="build-tools;36.0.0"

          "$SDKMANAGER" \
            "$platform_pkg" \
            "$build_tools_pkg" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            --channel=3

          installed_name="${platform_pkg#platforms;}"
          installed_path="$ANDROID_SDK_ROOT/platforms/$installed_name"
          test -e "$installed_path/android.jar"

      - name: Install provisioning build dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Assemble enterprise debug APK
        env:
          DPC_AIO_GITHUB_REPOSITORY: ${{ github.repository }}
          DPC_AIO_CONTINUOUS_RELEASE_TAG: dpc-aio-continuous
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app-dpc:assembleEnterpriseDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find apps/dpc/app/build/outputs/apk/enterprise/debug -type f -name '*.apk' -print -quit | grep -q .

  verify:
    name: verify
    if: always()
    needs:
      - source-contracts
      - apk-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate required checks
        env:
          SOURCE_RESULT: ${{ needs.source-contracts.result }}
          APK_RESULT: ${{ needs.apk-build.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "source-contracts=$SOURCE_RESULT"
          echo "apk-build=$APK_RESULT"
          [[ "$SOURCE_RESULT" == "success" ]]
          [[ "$APK_RESULT" == "success" ]]
