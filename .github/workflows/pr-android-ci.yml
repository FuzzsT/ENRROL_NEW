name: Android CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: Source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install provisioning test dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Run host/source test suite
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/run_host_tests.sh
          ./tools/run_host_tests.sh

      - name: Run Self Update HTTP diagnostics contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_self_update_http_diagnostics.py
          python3 tools/tests/test_stable_signing_diagnostics.py
          python3 tools/tests/test_stable_signing_recovery_behavior.py
          python3 tools/tests/test_stable_signer_recovery_integrity_contract.py
          python3 tools/tests/test_stable_signer_recovery_preflight_contract.py
          python3 tools/tests/test_stable_signer_rotation_contract.py
          python3 tools/tests/test_migration_signing_workflow_contract.py
          python3 tools/tests/test_migration_secrets_configurator.py
          python3 tools/tests/test_migration_secrets_windows_launcher_contract.py
          python3 tools/tests/test_migration_apk_validation_report_contract.py
          python3 tools/tests/test_migration_adb_update_matrix.py
          python3 tools/tests/test_migration_update_matrix_aggregate.py
          python3 tools/tests/test_migration_update_matrix_workflow_contract.py
          python3 tools/tests/test_migration_update_matrix_dispatch_helper.py
          python3 tools/tests/test_migration_update_matrix_windows_launcher_contract.py
          python3 tools/tests/test_migration_update_matrix_artifact_fetcher.py
          python3 tools/tests/test_migration_update_matrix_artifact_windows_launcher_contract.py
          python3 tools/tests/test_migration_update_matrix_aio_windows_launcher_contract.py
          python3 tools/tests/test_migration_update_matrix_artifact_auto_runid.py
          python3 tools/tests/test_kpe_provisioning_secret_contract.py
          python3 tools/tests/test_knox_license_controller_contract.py
          python3 tools/tests/test_knox_license_retry_contract.py
          python3 tools/tests/test_knox_license_status_retry_contract.py
          python3 tools/tests/test_knox_license_ui_diagnostics_contract.py
          python3 tools/tests/test_knox_license_history_contract.py
          python3 tools/tests/test_knox_license_history_ui_controls_contract.py

      - name: Run PIN and app lock contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_pin_guard_contract.py
          python3 tools/tests/test_app_lock_pin_contract.py
          python3 tools/tests/test_install_pin_guard_contract.py

      - name: Run package export contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_package_export_contract.py
          python3 tools/tests/test_package_export_ui_contract.py

      - name: Run secret code inventory contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_secret_code_inventory_contract.py
          python3 tools/tests/test_secret_code_inventory_runtime_contract.py
          python3 tools/tests/test_signature_code_derivation_contract.py
          python3 tools/tests/test_signature_code_android_contract.py
          python3 tools/tests/test_signature_code_lab_ui_contract.py

      - name: Run workflow organization contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_workflow_organization_contract.py

  apk-build:
    name: Enterprise debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android 17 SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_CLI="$(command -v android)"
          test -x "$ANDROID_CLI"
          SDK_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          "$ANDROID_CLI" sdk list --all --all-versions --canary > "$SDK_LIST"

          has_package() {
            awk -v wanted="$1" '$1 == wanted { found=1 } END { exit(found ? 0 : 1) }' "$SDK_LIST"
          }

          platform_pkg="$(awk '$1 ~ /^platforms\/android-37\.[0-9]+$/ { print $1 }' "$SDK_LIST" | sort -V | tail -n1)"
          if [[ -z "$platform_pkg" ]] && has_package "platforms/android-CinnamonBun"; then
            platform_pkg="platforms/android-CinnamonBun"
          fi
          if [[ -z "$platform_pkg" ]]; then
            echo "Android 17 platform not found." >&2
            grep -E 'platforms/android-(37|CinnamonBun)' "$SDK_LIST" || true
            exit 1
          fi

          build_tools_pkg="$(awk '$1 ~ /^build-tools\/37\./ { print $1 }' "$SDK_LIST" | sort -V | tail -n1)"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg="build-tools/36.0.0"

          "$ANDROID_CLI" sdk install --canary "$platform_pkg" "$build_tools_pkg" "ndk/28.2.13676358" "cmake/3.22.1"

          installed_name="${platform_pkg#platforms/}"
          installed_path="$ANDROID_SDK_ROOT/platforms/$installed_name"
          test -e "$installed_path/android.jar"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -x "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

      - name: Install provisioning build dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Assemble enterprise debug APK
        env:
          DPC_AIO_GITHUB_REPOSITORY: ${{ github.repository }}
          DPC_AIO_CONTINUOUS_RELEASE_TAG: dpc-aio-continuous
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app-dpc:assembleEnterpriseDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          find apps/dpc/app/build/outputs/apk/enterprise/debug -type f -name '*.apk' -print -quit | grep -q .

  verify:
    name: verify
    if: always()
    needs:
      - source-contracts
      - apk-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate required checks
        env:
          SOURCE_RESULT: ${{ needs.source-contracts.result }}
          APK_RESULT: ${{ needs.apk-build.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "source-contracts=$SOURCE_RESULT"
          echo "apk-build=$APK_RESULT"
          [[ "$SOURCE_RESULT" == "success" ]]
          [[ "$APK_RESULT" == "success" ]]
