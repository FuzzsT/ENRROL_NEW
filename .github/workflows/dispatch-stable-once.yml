name: Dispatch stable enrollment once

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable enrollment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-aio-enrollment.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched build-aio-enrollment.yml on main."
