name: Build AIO + enrollment QR

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "HTTPS URL Setup Wizard will use to download the APK (optional; defaults to latest GitHub release asset)"
        required: false
        type: string
      enrollment_token:
        description: "Optional enrollment token embedded in admin extras"
        required: false
        type: string
      policy_profile:
        description: "Policy profile placed in admin extras"
        required: false
        default: "default"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DPC_AIO_GITHUB_REPOSITORY: ${{ github.repository }}
      DPC_AIO_ENROLLMENT_TOKEN: ${{ inputs.enrollment_token }}
      DPC_AIO_POLICY_PROFILE: ${{ inputs.policy_profile || 'default' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android 17 SDK + native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          SDK_LIST="$RUNNER_TEMP/android-sdk-packages.txt"

          # Android 17 / API 37 is still distributed through preview/canary
          # repositories on some runners. Discover the actual package id instead
          # of assuming that platforms;android-37 exists in channel 0.
          "$SDKMANAGER" --list --channel=3 > "$SDK_LIST"

          has_package() {
            awk -F'|' -v wanted="$1" '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 == wanted { found=1 }
              END { exit(found ? 0 : 1) }
            ' "$SDK_LIST"
          }

          platform_pkg=""
          if has_package "platforms;android-37"; then
            platform_pkg="platforms;android-37"
          else
            platform_pkg="$(
              awk -F'|' '
                { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
                $1 ~ /^platforms;android-37\.[0-9]+$/ { print $1 }
              ' "$SDK_LIST" | sort -V | tail -n1
            )"
          fi
          if [[ -z "$platform_pkg" ]] && has_package "platforms;android-CinnamonBun"; then
            platform_pkg="platforms;android-CinnamonBun"
          fi
          if [[ -z "$platform_pkg" ]]; then
            echo "Android 17 platform not found. Available API 37/CinnamonBun packages:" >&2
            grep -E 'platforms;android-(37|CinnamonBun)' "$SDK_LIST" || true
            exit 1
          fi

          build_tools_pkg="$(
            awk -F'|' '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 ~ /^build-tools;37\./ { print $1 }
            ' "$SDK_LIST" | sort -V | tail -n1
          )"
          if [[ -z "$build_tools_pkg" ]]; then
            build_tools_pkg="build-tools;36.0.0"
          fi

          echo "Selected platform: $platform_pkg"
          echo "Selected build tools: $build_tools_pkg"
          "$SDKMANAGER" \
            "$platform_pkg" \
            "$build_tools_pkg" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            --channel=3

          # Some preview repositories install API 37 under android-37.x or
          # android-CinnamonBun. AGP compileSdk=37 expects android-37.
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            installed_name="${platform_pkg#platforms;}"
            installed_path="$ANDROID_SDK_ROOT/platforms/$installed_name"
            if [[ -d "$installed_path" ]]; then
              ln -sfn "$installed_path" "$ANDROID_SDK_ROOT/platforms/android-37"
            fi
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Set up Python QR dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Resolve public APK URL
        shell: bash
        run: |
          if [[ -n "${{ inputs.apk_url }}" ]]; then
            url='${{ inputs.apk_url }}'
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/DPC-AIO-enterprise-debug.apk"
          else
            url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/DPC-AIO-enterprise-debug.apk"
          fi
          echo "DPC_AIO_PROVISIONING_APK_URL=$url" >> "$GITHUB_ENV"
          echo "Provisioning APK URL: $url"

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Build enterpriseDebug and generate provisioning QR
        run: ./gradlew :app-dpc:assembleEnterpriseDebug

      - name: Collect AIO enrollment artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app-dpc/build/outputs/apk/enterprise/debug -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          cp "$apk" dist/DPC-AIO-enterprise-debug.apk
          cp app-dpc/build/outputs/provisioning/enterprise/debug/provisioning.json dist/
          cp app-dpc/build/outputs/provisioning/enterprise/debug/provisioning-payload.txt dist/
          cp app-dpc/build/outputs/provisioning/enterprise/debug/provisioning-metadata.json dist/
          cp app-dpc/build/outputs/provisioning/enterprise/debug/provisioning-qr.png dist/
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload full build + enrollment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DPC-AIO-enterpriseDebug-enrollment
          path: dist/

      - name: Publish tag release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DPC-AIO-enterprise-debug.apk
            dist/provisioning.json
            dist/provisioning-payload.txt
            dist/provisioning-metadata.json
            dist/provisioning-qr.png
            dist/SHA256SUMS.txt
