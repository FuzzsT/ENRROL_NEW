name: Build AIO + enrollment QR

on:
  workflow_dispatch:
    inputs:
      release_signing_password:
        description: "Jedyne pole do wpisania: hasło do podpisu password-backed release (min. 12 znaków; używaj tego samego przy kolejnych runach)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: dpc-aio-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DPC_AIO_BUILD_ARTIFACT_NAME: DPC-AIO-enterpriseRelease-enrollment-${{ github.run_id }}-${{ github.run_attempt }}
  DPC_AIO_RUNTIME_ARTIFACT_NAME: DPC-AIO-android-runtime-smoke-${{ github.run_id }}-${{ github.run_attempt }}
  DPC_AIO_RELEASE_APK_NAME: ${{ vars.DPC_AIO_RELEASE_APK_NAME || 'DPC-AIO-enterprise-release.apk' }}
  DPC_AIO_CONTINUOUS_RELEASE_TAG: ${{ vars.DPC_AIO_CONTINUOUS_RELEASE_TAG || 'dpc-aio-continuous' }}
  DPC_AIO_GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      signing_mode: ${{ steps.signing.outputs.mode }}
      app_version: ${{ steps.metadata.outputs.app_version }}
      qr_bundle_name: ${{ steps.metadata.outputs.qr_bundle_name }}
      release_apk_name: ${{ steps.config.outputs.release_apk_name }}
      continuous_release_tag: ${{ steps.config.outputs.continuous_release_tag }}
    env:
      # Auto-filled compatibility names retained for host contracts:
      # enrollment_endpoint -> vars.DPC_AIO_ENROLLMENT_ENDPOINT
      # enrollment_signing_public_key -> vars.DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY
      DPC_AIO_CFG_ENROLLMENT_TOKEN: ${{ secrets.DPC_AIO_ENROLLMENT_TOKEN || vars.DPC_AIO_ENROLLMENT_TOKEN }}
      DPC_AIO_CFG_ENROLLMENT_ENDPOINT: ${{ vars.DPC_AIO_ENROLLMENT_ENDPOINT }}
      DPC_AIO_CFG_ENROLLMENT_SIGNING_PUBLIC_KEY: ${{ vars.DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY }}
      DPC_AIO_CFG_POLICY_PROFILE: ${{ vars.DPC_AIO_POLICY_PROFILE }}
      DPC_AIO_CFG_PROVISIONING_MODE: ${{ vars.DPC_AIO_PROVISIONING_MODE }}
      DPC_AIO_CFG_ALLOW_OFFLINE: ${{ vars.DPC_AIO_ALLOW_OFFLINE }}
      DPC_AIO_CFG_ENROLLMENT_OFFLINE_MODE: ${{ vars.DPC_AIO_ENROLLMENT_OFFLINE_MODE }}
      DPC_AIO_CFG_OFFLINE_BUNDLE_ID: ${{ vars.DPC_AIO_OFFLINE_BUNDLE_ID }}
      DPC_AIO_CFG_RELEASE_APK_NAME: ${{ vars.DPC_AIO_RELEASE_APK_NAME }}
      DPC_AIO_CFG_CONTINUOUS_RELEASE_TAG: ${{ vars.DPC_AIO_CONTINUOUS_RELEASE_TAG }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve project release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('apps/dpc/app/build.gradle.kts').read_text(encoding='utf-8')
          m = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit('VERSION_NAME_NOT_FOUND')
          print(m.group(1))
          PY
          )"
          bundle="DPC-AIO-${version}-QR-RELEASE-BUNDLE.zip"
          echo "DPC_AIO_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "DPC_AIO_QR_BUNDLE_NAME=$bundle" >> "$GITHUB_ENV"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "qr_bundle_name=$bundle" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $version"

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android 17 SDK + stable verifier
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          list="$RUNNER_TEMP/android-sdk-packages.txt"
          "$sdkmanager_bin" --list --channel=3 > "$list"

          platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$list" | head -n1)"
          if [[ -z "$platform_pkg" ]]; then
            platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^platforms;android-37\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          fi
          if [[ -z "$platform_pkg" ]] && grep -q 'platforms;android-CinnamonBun' "$list"; then
            platform_pkg='platforms;android-CinnamonBun'
          fi
          [[ -n "$platform_pkg" ]] || { echo 'Android 17 platform not found' >&2; exit 1; }

          build_tools_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^build-tools;37\.[0-9]+\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg='build-tools;36.0.0'

          echo "Selected platform: $platform_pkg"
          echo "Selected build tools: $build_tools_pkg"
          "$sdkmanager_bin" "$platform_pkg" "$build_tools_pkg" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3

          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then
            installed="$ANDROID_SDK_ROOT/platforms/${platform_pkg#platforms;}"
            [[ -d "$installed" ]] && ln -sfn "$installed" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Set up Python QR dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Resolve automatic enrollment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          # Three-level fallback chain:
          #   1. GitHub Secrets / Variables
          #   2. repository-local .github/dpc-aio-defaults.env
          #   3. safe built-in values below
          defaults_file='.github/dpc-aio-defaults.env'
          if [[ -f "$defaults_file" ]]; then
            set -a
            # shellcheck disable=SC1090
            source "$defaults_file"
            set +a
          fi

          pick() {
            local configured="$1" fallback="$2" builtin="$3"
            if [[ -n "$configured" ]]; then printf '%s' "$configured"
            elif [[ -n "$fallback" ]]; then printf '%s' "$fallback"
            else printf '%s' "$builtin"
            fi
          }
          bool() { case "${1,,}" in 1|true|yes|on) echo true;; *) echo false;; esac; }

          release_apk="$(pick "${DPC_AIO_CFG_RELEASE_APK_NAME:-}" "${DPC_AIO_DEFAULT_RELEASE_APK_NAME:-}" 'DPC-AIO-enterprise-release.apk')"
          if [[ ! "$release_apk" =~ ^[A-Za-z0-9._-]+\.apk$ ]]; then
            echo "AUTO_CONFIG_WARNING: invalid release APK name '$release_apk'; using DPC-AIO-enterprise-release.apk" >&2
            release_apk='DPC-AIO-enterprise-release.apk'
          fi

          release_tag="$(pick "${DPC_AIO_CFG_CONTINUOUS_RELEASE_TAG:-}" "${DPC_AIO_DEFAULT_CONTINUOUS_RELEASE_TAG:-}" 'dpc-aio-continuous')"
          if [[ ! "$release_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "AUTO_CONFIG_WARNING: invalid continuous release tag '$release_tag'; using dpc-aio-continuous" >&2
            release_tag='dpc-aio-continuous'
          fi

          profile="$(pick "${DPC_AIO_CFG_POLICY_PROFILE:-}" "${DPC_AIO_DEFAULT_POLICY_PROFILE:-}" 'default')"
          mode="$(pick "${DPC_AIO_CFG_PROVISIONING_MODE:-}" "${DPC_AIO_DEFAULT_PROVISIONING_MODE:-}" 'work-profile')"
          case "$mode" in auto|work-profile|fully-managed) ;; *) mode=work-profile;; esac

          allow_raw="$(pick "${DPC_AIO_CFG_ALLOW_OFFLINE:-}" "${DPC_AIO_DEFAULT_ALLOW_OFFLINE:-}" 'false')"
          allow="$(bool "$allow_raw")"
          offline="$(pick "${DPC_AIO_CFG_ENROLLMENT_OFFLINE_MODE:-}" "${DPC_AIO_DEFAULT_ENROLLMENT_OFFLINE_MODE:-}" 'ONLINE')"
          offline="${offline^^}"; offline="${offline//-/_}"
          case "$offline" in ONLINE|ONLINE_PREFERRED|FULL_OFFLINE|OFFLINE_THEN_SYNC) ;; *) offline=ONLINE;; esac

          bundle="$(pick "${DPC_AIO_CFG_OFFLINE_BUNDLE_ID:-}" "${DPC_AIO_DEFAULT_OFFLINE_BUNDLE_ID:-}" '')"
          if [[ "$offline" == FULL_OFFLINE || "$offline" == OFFLINE_THEN_SYNC ]]; then
            if [[ -z "$bundle" ]]; then
              echo 'AUTO_CONFIG_WARNING: offline bundle is not configured; falling back to ONLINE.' >&2
              offline=ONLINE
              allow=false
            fi
          fi

          endpoint="$(pick "${DPC_AIO_CFG_ENROLLMENT_ENDPOINT:-}" "${DPC_AIO_DEFAULT_ENROLLMENT_ENDPOINT:-}" '')"
          if [[ -n "$endpoint" && "$endpoint" != https://* ]]; then
            echo 'AUTO_CONFIG_WARNING: enrollment endpoint is not HTTPS; standalone/default routing will be used.' >&2
            endpoint=''
          fi

          token="$(pick "${DPC_AIO_CFG_ENROLLMENT_TOKEN:-}" "${DPC_AIO_DEFAULT_ENROLLMENT_TOKEN:-}" '')"
          public_key="$(pick "${DPC_AIO_CFG_ENROLLMENT_SIGNING_PUBLIC_KEY:-}" "${DPC_AIO_DEFAULT_ENROLLMENT_SIGNING_PUBLIC_KEY:-}" '')"

          {
            printf 'DPC_AIO_RELEASE_APK_NAME=%s\n' "$release_apk"
            printf 'DPC_AIO_CONTINUOUS_RELEASE_TAG=%s\n' "$release_tag"
            printf 'DPC_AIO_ENROLLMENT_TOKEN=%s\n' "$token"
            printf 'DPC_AIO_ENROLLMENT_ENDPOINT=%s\n' "$endpoint"
            printf 'DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY=%s\n' "$public_key"
            printf 'DPC_AIO_POLICY_PROFILE=%s\n' "$profile"
            printf 'DPC_AIO_PROVISIONING_MODE=%s\n' "$mode"
            printf 'DPC_AIO_ALLOW_OFFLINE=%s\n' "$allow"
            printf 'DPC_AIO_ENROLLMENT_OFFLINE_MODE=%s\n' "$offline"
            printf 'DPC_AIO_OFFLINE_BUNDLE_ID=%s\n' "$bundle"
          } >> "$GITHUB_ENV"
          {
            printf 'release_apk_name=%s\n' "$release_apk"
            printf 'continuous_release_tag=%s\n' "$release_tag"
          } >> "$GITHUB_OUTPUT"

          echo "AUTO CONFIG: release_tag=$release_tag apk=$release_apk profile=$profile mode=$mode allow_offline=$allow offline_mode=$offline"
          echo "AUTO CONFIG: endpoint=$([[ -n "$endpoint" ]] && echo configured || echo standalone-default), token=$([[ -n "$token" ]] && echo configured || echo none), public_key=$([[ -n "$public_key" ]] && echo configured || echo none)"

      - name: Load manual signing password
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          password="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              print(json.load(f).get('inputs', {}).get('release_signing_password', ''), end='')
          PY
          )"
          [[ ${#password} -ge 12 ]] || { echo 'RELEASE_SIGNING_PASSWORD_TOO_SHORT: minimum 12 characters' >&2; exit 1; }
          printf '::add-mask::%s\n' "$password"
          printf 'DPC_AIO_MANUAL_SIGNING_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

      - name: Prepare enterprise release signing
        id: signing
        env:
          DPC_AIO_RELEASE_KEYSTORE_B64: ${{ secrets.DPC_AIO_RELEASE_KEYSTORE_B64 }}
          DPC_AIO_RELEASE_STORE_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_STORE_PASSWORD }}
          DPC_AIO_RELEASE_KEY_ALIAS: ${{ secrets.DPC_AIO_RELEASE_KEY_ALIAS }}
          DPC_AIO_RELEASE_KEY_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_KEY_PASSWORD }}
          DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256: ${{ secrets.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 || vars.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 }}
          DPC_AIO_STRICT_EXPECTED_SIGNING_CERT: ${{ vars.DPC_AIO_STRICT_EXPECTED_SIGNING_CERT || 'false' }}
        shell: bash
        run: bash tools/release/prepare_enterprise_signing.sh

      - name: Verify signing keystore file and path before build
        shell: bash
        run: |
          set -euo pipefail
          : "${DPC_AIO_RELEASE_KEYSTORE_PATH:?DPC_AIO_RELEASE_KEYSTORE_PATH is required}"
          : "${DPC_AIO_RELEASE_STORE_PASSWORD:?DPC_AIO_RELEASE_STORE_PASSWORD is required}"
          : "${DPC_AIO_RELEASE_KEY_ALIAS:?DPC_AIO_RELEASE_KEY_ALIAS is required}"
          raw="$DPC_AIO_RELEASE_KEYSTORE_PATH"
          test -f "$raw"
          test -s "$raw"
          resolved="$(realpath -e "$raw")"
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          case "$resolved" in
            "$runner_temp"/*) ;;
            *) echo "SIGNING_KEYSTORE_PATH_INVALID: expected a runner-temporary file, got $resolved" >&2; exit 1 ;;
          esac
          export DPC_AIO_EFFECTIVE_STORE_PASSWORD="$DPC_AIO_RELEASE_STORE_PASSWORD"
          keytool -list \
            -keystore "$resolved" \
            -alias "$DPC_AIO_RELEASE_KEY_ALIAS" \
            -storepass:env DPC_AIO_EFFECTIVE_STORE_PASSWORD >/dev/null
          chmod 600 "$resolved"
          echo "DPC_AIO_RELEASE_KEYSTORE_PATH=$resolved" >> "$GITHUB_ENV"
          echo "Verified signing keystore path: $resolved"
      - name: Require stable signing key for tag release
        if: ${{ github.ref_type == 'tag' && steps.signing.outputs.mode != 'stable-secrets' }}
        run: |
          echo 'STABLE_SIGNING_KEY_REQUIRED: tag releases require repository stable signing secrets' >&2
          exit 1

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/android_build_preflight.py --require-signing --json-out dist/build-environment.json
          chmod +x gradlew
          ./gradlew --version

      - name: Build enterpriseRelease and generate provisioning QR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./gradlew :app-dpc:assembleEnterpriseRelease --console=plain 2>&1 \
            | tee dist/gradle-build.log \
            | python3 tools/ci/filter_gradle_output.py

      - name: Resolve and verify built APK path
        shell: bash
        run: |
          set -euo pipefail
          apk_dir='apps/dpc/app/build/outputs/apk/enterprise/release'
          test -d "$apk_dir"
          mapfile -t candidates < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print | sort)
          [[ ${#candidates[@]} -eq 1 ]] || {
            printf 'BUILT_APK_COUNT_INVALID: expected exactly 1 APK under %s, found %d\n' "$apk_dir" "${#candidates[@]}" >&2
            printf 'candidate: %s\n' "${candidates[@]:-<none>}" >&2
            exit 1
          }
          apk="$(realpath -e "${candidates[0]}")"
          apk_root="$(realpath -e "$apk_dir")"
          case "$apk" in
            "$apk_root"/*) ;;
            *) echo "BUILT_APK_PATH_INVALID: $apk escapes $apk_root" >&2; exit 1 ;;
          esac
          test -f "$apk"
          test -s "$apk"
          echo "DPC_AIO_BUILT_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified built APK path: $apk"
          stat --printf='APK size: %s bytes\n' "$apk"
          sha256sum "$apk"

      - name: Verify enterprise release signing certificate
        shell: bash
        run: |
          set -euo pipefail
          : "${DPC_AIO_BUILT_APK_PATH:?DPC_AIO_BUILT_APK_PATH is required}"
          apk="$DPC_AIO_BUILT_APK_PATH"
          test -f "$apk"
          test -s "$apk"
          signer="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$signer"
          cert_output="$($signer verify --verbose --print-certs "$apk" 2>&1)"
          printf '%s\n' "$cert_output"
          observed="$(printf '%s\n' "$cert_output" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/ip' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$DPC_AIO_EXPECTED_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$observed" ]] || { echo SIGNING_CERT_PARSE_FAILED >&2; exit 1; }
          [[ "$observed" == "$expected" ]] || { echo "SIGNING_CERT_MISMATCH expected=$expected observed=$observed" >&2; exit 1; }
          echo "Release signing certificate SHA-256: $observed"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          src='apps/dpc/app/build/outputs/provisioning/enterprise/release'
          : "${DPC_AIO_BUILT_APK_PATH:?DPC_AIO_BUILT_APK_PATH is required}"
          apk="$DPC_AIO_BUILT_APK_PATH"
          test -f "$apk"
          test -s "$apk"
          cp "$apk" "dist/$DPC_AIO_RELEASE_APK_NAME"
          cp "$src"/provisioning.json "$src"/provisioning-payload.txt "$src"/provisioning-metadata.json "$src"/provisioning-qr.png dist/
          cp "$src"/work-profile-provisioning.json "$src"/work-profile-provisioning-payload.txt "$src"/work-profile-provisioning-metadata.json "$src"/work-profile-qr.png dist/
          cp "$src"/device-owner-provisioning.json "$src"/device-owner-provisioning-payload.txt "$src"/device-owner-provisioning-metadata.json "$src"/device-owner-qr.png dist/
          if [[ -n "${DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH:-}" && -f "$DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH" ]]; then
            cp "$DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH" dist/DPC-AIO-signing-keystore.enc
          fi
          set -uo pipefail
          compat="$(python3 -c 'import json; print(json.load(open("dist/provisioning-metadata.json"))["provisioningMode"])')"
          signer="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          status=0
          check() {
            report="$1"; shift
            python3 tools/provisioning/verify_provisioning_qr.py "$@" > "$report" || status=1
            echo "===== $report ====="; cat "$report" || true
          }
          check dist/provisioning-validation.json --json dist/provisioning.json --qr dist/provisioning-qr.png --apk "dist/$DPC_AIO_RELEASE_APK_NAME" --apksigner "$signer" --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode "$compat"
          check dist/work-profile-validation.json --json dist/work-profile-provisioning.json --qr dist/work-profile-qr.png --apk "dist/$DPC_AIO_RELEASE_APK_NAME" --apksigner "$signer" --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode work-profile
          check dist/device-owner-validation.json --json dist/device-owner-provisioning.json --qr dist/device-owner-qr.png --apk "dist/$DPC_AIO_RELEASE_APK_NAME" --apksigner "$signer" --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode fully-managed
          [[ "$status" == 0 ]] || { echo QR_VALIDATION_FAILED >&2; exit 1; }

      - name: Cleanup release signing material before runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DPC_AIO_RELEASE_KEYSTORE_PATH:-}" ]]; then
            rm -f "$DPC_AIO_RELEASE_KEYSTORE_PATH"
          fi
          echo "Release signing keystore removed before third-party runtime actions."

      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          sudo groupadd -f kvm || true
          sudo usermod -a -G kvm $USER || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AOSP Device Owner runtime smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            python3 tools/runtime/android_device_owner_smoke.py
            --apk dist/${{ env.DPC_AIO_RELEASE_APK_NAME }}
            --out dist/android-runtime-smoke.json
            --expected-version "${{ env.DPC_AIO_APP_VERSION }}"

      - name: Upload Android runtime smoke evidence
        if: ${{ hashFiles('dist/android-runtime-smoke.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: ${{ env.DPC_AIO_RUNTIME_ARTIFACT_NAME }}
          path: dist/android-runtime-smoke.json
          if-no-files-found: error
      - name: Build QR release bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/build_qr_release_bundle.py --dist dist --version "$DPC_AIO_APP_VERSION" --apk-url "$DPC_AIO_PROVISIONING_APK_URL" --apk-name "$DPC_AIO_RELEASE_APK_NAME"
          test -f "dist/$DPC_AIO_QR_BUNDLE_NAME"
          test -f "dist/$DPC_AIO_QR_BUNDLE_NAME.sha256"
          test -f dist/QR-README.md
          test -f dist/RELEASE-INDEX.json
          test -f dist/SHA256SUMS.txt

      - name: Upload full build + enrollment artifacts
        if: ${{ always() && hashFiles('dist/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: ${{ env.DPC_AIO_BUILD_ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          [[ -z "${DPC_AIO_RELEASE_KEYSTORE_PATH:-}" ]] || rm -f "$DPC_AIO_RELEASE_KEYSTORE_PATH"
          [[ -z "${DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH:-}" ]] || rm -f "$DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH"

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' && ((github.ref_type == 'tag' && needs.build.outputs.signing_mode == 'stable-secrets') || (github.event_name == 'workflow_dispatch' && (needs.build.outputs.signing_mode == 'stable-secrets' || needs.build.outputs.signing_mode == 'password-release-keystore'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DPC_AIO_APP_VERSION: ${{ needs.build.outputs.app_version }}
      DPC_AIO_QR_BUNDLE_NAME: ${{ needs.build.outputs.qr_bundle_name }}
      DPC_AIO_RELEASE_APK_NAME: ${{ needs.build.outputs.release_apk_name }}
      DPC_AIO_CONTINUOUS_RELEASE_TAG: ${{ needs.build.outputs.continuous_release_tag }}
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.DPC_AIO_BUILD_ARTIFACT_NAME }}
          path: dist

      - name: Resolve release target
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"; title="$GITHUB_REF_NAME"; prerelease=false
          else
            tag="$DPC_AIO_CONTINUOUS_RELEASE_TAG"; title='DPC-AIO Continuous Enrollment'; prerelease=true
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${DPC_AIO_RELEASE_APK_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Create or update release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          title='${{ steps.release.outputs.title }}'
          notes="DPC-AIO $DPC_AIO_APP_VERSION release from commit $GITHUB_SHA. Includes enterprise APK, Work Profile QR, Device Owner QR, validation reports and $DPC_AIO_QR_BUNDLE_NAME. Signing mode: ${{ needs.build.outputs.signing_mode }}."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ '${{ steps.release.outputs.prerelease }}' == true ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease
            else
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
            fi
          else
            if [[ '${{ steps.release.outputs.prerelease }}' == true ]]; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease
            else
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes"
            fi
          fi
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish continuous enrollment assets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          tag="$DPC_AIO_CONTINUOUS_RELEASE_TAG"
          title='DPC-AIO Continuous Enrollment'
          if [[ "${{ needs.build.outputs.signing_mode }}" == "password-release-keystore" ]]; then
            signing_note="Zero-Settings mode: the APK is signed with a password-backed keystore persisted as the encrypted DPC-AIO-signing-keystore.enc release asset. Reuse the same Run workflow password to keep future APK updates signature-compatible."
          else
            signing_note="This run used the stable repository signing key and is update-compatible with other builds signed by that key."
          fi
          notes="DPC-AIO $DPC_AIO_APP_VERSION rolling release from commit $GITHUB_SHA. Includes enterprise APK, Work Profile QR, Device Owner QR, validation reports and $DPC_AIO_QR_BUNDLE_NAME. Signing mode: ${{ needs.build.outputs.signing_mode }}. $signing_note"
          rm -f dist/gradle-build.log
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --prerelease
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify continuous APK is publicly downloadable
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DPC_AIO_CONTINUOUS_RELEASE_TAG}/${DPC_AIO_RELEASE_APK_NAME}"
          downloaded="$RUNNER_TEMP/DPC-AIO-enterprise-release.continuous.downloaded.apk"
          matched=0
          for attempt in 1 2 3 4 5 6; do
            rm -f "$downloaded"
            if curl -fL --connect-timeout 15 --max-time 180 "$url" -o "$downloaded" && cmp -s "dist/$DPC_AIO_RELEASE_APK_NAME" "$downloaded"; then
              matched=1
              break
            fi
            echo "Release asset not ready yet ($attempt/6)"
            sleep 5
          done
            fi
            echo "Release asset not ready yet ($attempt/6)"
            sleep 5
          done
          if [[ "$matched" != "1" ]]; then
            echo "Continuous enrollment APK is not publicly downloadable or does not match this build: $url" >&2
            exit 1
          fi
          echo "Continuous enrollment APK URL is public and byte-identical to this build."

      - name: Publish tag release assets
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          notes="DPC-AIO $DPC_AIO_APP_VERSION verified release from commit $GITHUB_SHA. Includes Work Profile, Device Owner and compatibility QR assets plus $DPC_AIO_QR_BUNDLE_NAME."
          rm -f dist/gradle-build.log
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; updating notes and uploading verified assets with --clobber."
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$notes"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          fi
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify tag release APK is publicly downloadable
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${DPC_AIO_RELEASE_APK_NAME}"
          downloaded="$RUNNER_TEMP/DPC-AIO-enterprise-release.tag.downloaded.apk"
          matched=0
          for attempt in 1 2 3 4 5 6; do
            rm -f "$downloaded"
            if curl -fL --connect-timeout 15 --max-time 180 "$url" -o "$downloaded" && cmp -s "dist/$DPC_AIO_RELEASE_APK_NAME" "$downloaded"; then
              matched=1
              break
            fi
            echo "Tag release asset not ready/matching yet (attempt $attempt/6)."
            sleep 5
          done
          if [[ "$matched" != "1" ]]; then
            echo "Tag release enrollment APK is not publicly downloadable or does not match this build: $url" >&2
            exit 1
          fi
          echo "Tag release APK URL is public and byte-identical to this build."
