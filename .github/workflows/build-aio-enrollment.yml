name: Enrollment build + release
run-name: 'Release | ${{ github.event_name }} | ${{ github.ref_name }}'

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - 'apps/dpc/**'
      - 'tools/**'
      - 'services/provisioning/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-aio-enrollment.yml'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Signing/release mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - stable
          - emergency
          - continuous-v2
      publish_continuous_v2:
        description: "Publish verified Continuous v2 artifacts (manual opt-in)"
        required: false
        default: false
        type: boolean
      first_continuous_v2_release:
        description: "Confirm first v2 publication only if no v2 release exists"
        required: false
        default: false
        type: boolean
      repair_manifests_only:
        description: "Repair existing Self Update manifests only; do not rebuild or re-sign APKs"
        required: false
        default: false
        type: boolean
      apk_url:
        description: "Optional public APK URL used by provisioning QR (stable manual runs only)"
        required: false
        type: string
      enrollment_token:
        description: "Optional enrollment token embedded in admin extras"
        required: false
        type: string
      enrollment_endpoint:
        description: "HTTPS DPC-AIO Enrollment Engine v2 endpoint"
        required: false
        type: string
      enrollment_signing_public_key:
        description: "Base64 DER Ed25519 public key used by the DPC to verify bootstrap responses"
        required: false
        type: string
      policy_profile:
        description: "Policy profile placed in admin extras"
        required: false
        default: default
        type: string
      provisioning_mode:
        description: "Compatibility QR mode; dedicated Work Profile and Device Owner QRs are also generated"
        required: true
        default: work-profile
        type: choice
        options:
          - auto
          - work-profile
          - fully-managed
      allow_offline:
        description: "Allow Android offline provisioning when supported"
        required: false
        default: false
        type: boolean
      enrollment_offline_mode:
        description: "DPC route after Setup Wizard installs the APK"
        required: false
        default: ONLINE
        type: choice
        options:
          - ONLINE
          - ONLINE_PREFERRED
          - FULL_OFFLINE
          - OFFLINE_THEN_SYNC
      offline_bundle_id:
        description: "Signed local bundle/profile id for FULL_OFFLINE/OFFLINE_THEN_SYNC"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: enrollment-${{ github.ref }}${{ inputs.signing_mode == 'continuous-v2' && '-v2' || '' }}
  cancel-in-progress: ${{ inputs.signing_mode != 'continuous-v2' }}

jobs:
  repair-self-update-manifests:
    name: Repair existing Self Update manifests
    if: (github.event_name == 'workflow_dispatch' && inputs.repair_manifests_only == true && inputs.signing_mode != 'continuous-v2' && inputs.publish_continuous_v2 != true && inputs.first_continuous_v2_release != true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install APK metadata tooling
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_CLI="$(command -v android)"
          test -x "$ANDROID_CLI"
          "$ANDROID_CLI" sdk install "build-tools/36.0.0"
          aapt_bin="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$aapt_bin"

      - name: Backfill and verify live manifests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair
          aapt_bin="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$aapt_bin"
          export PATH="$(dirname "$aapt_bin"):$PATH"

          for tag in dpc-aio-continuous dpc-aio-emergency-enrollment; do
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "REPAIR_SELF_UPDATE_RELEASE_SKIPPED_MISSING tag=$tag"
              continue
            fi
            dir="repair/$tag"
            rm -rf "$dir"
            mkdir -p "$dir"
            (
              cd "$dir"
              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'DPC-AIO-enterprise-release.apk' \
                --clobber

              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'DPC-AIO-enterprise-release.apk.sha256' \
                --clobber || true

              gh release download "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern 'signing-mode.txt' \
                --clobber || true

              if [[ "$tag" == "dpc-aio-emergency-enrollment" ]]; then
                signing_mode="$(tr -d '[:space:]' < signing-mode.txt 2>/dev/null || true)"
                if [[ "$signing_mode" != "stable" ]]; then
                  echo "REPAIR_SELF_UPDATE_EMERGENCY_SKIPPED_EPHEMERAL_SIGNER tag=$tag signing_mode=${signing_mode:-missing}"
                  exit 0
                fi
              fi

              asset_digest="$(
                gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                  --jq '.assets[] | select(.name=="DPC-AIO-enterprise-release.apk") | .digest' \
                  | head -n1
              )"
              [[ "$asset_digest" == sha256:* ]] || {
                echo "REPAIR_SELF_UPDATE_DIGEST_MISSING tag=$tag digest=$asset_digest" >&2
                exit 1
              }
              expected_sha="${asset_digest#sha256:}"
              expected_sha="$(printf '%s' "$expected_sha" | tr '[:upper:]' '[:lower:]')"
              [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]] || {
                echo "REPAIR_SELF_UPDATE_DIGEST_INVALID tag=$tag digest=$asset_digest" >&2
                exit 1
              }
              actual_sha="$(sha256sum DPC-AIO-enterprise-release.apk | awk '{print $1}')"
              [[ "$actual_sha" == "$expected_sha" ]] || {
                echo "REPAIR_SELF_UPDATE_DIGEST_MISMATCH tag=$tag metadata=$expected_sha actual=$actual_sha" >&2
                exit 1
              }

              if [[ -f DPC-AIO-enterprise-release.apk.sha256 ]]; then
                sidecar_sha="$(awk 'NR==1 {print $1}' DPC-AIO-enterprise-release.apk.sha256 | tr '[:upper:]' '[:lower:]')"
                [[ "$sidecar_sha" =~ ^[0-9a-f]{64}$ ]] || {
                  echo "REPAIR_SELF_UPDATE_SIDECAR_INVALID tag=$tag sha=$sidecar_sha" >&2
                  exit 1
                }
                [[ "$sidecar_sha" == "$expected_sha" ]] || {
                  echo "REPAIR_SELF_UPDATE_SIDECAR_MISMATCH tag=$tag metadata=$expected_sha sidecar=$sidecar_sha" >&2
                  exit 1
                }
                printf '%s  DPC-AIO-enterprise-release.apk\n' "$sidecar_sha" > DPC-AIO-enterprise-release.apk.sha256
                sha256sum -c DPC-AIO-enterprise-release.apk.sha256
              fi

              package_line="$(aapt dump badging DPC-AIO-enterprise-release.apk | head -n1)"
              package_name="$(printf '%s\n' "$package_line" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
              version_code="$(printf '%s\n' "$package_line" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
              version_name="$(printf '%s\n' "$package_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
              [[ "$package_name" == "io.dpcaio.app" ]]
              [[ "$version_code" =~ ^[0-9]+$ ]]
              [[ -n "$version_name" ]]

              if [[ "$tag" == "dpc-aio-continuous" ]]; then
                channel="continuous"
              else
                channel="emergency"
              fi

              apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/DPC-AIO-enterprise-release.apk"
              notes_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
              published_at="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')"
              [[ -n "$published_at" && "$published_at" != "null" ]]

              python3 "$GITHUB_WORKSPACE/tools/release/build_self_update_manifest.py" \
                --apk DPC-AIO-enterprise-release.apk \
                --out self-update.json \
                --channel "$channel" \
                --package "$package_name" \
                --version-name "$version_name" \
                --version-code "$version_code" \
                --apk-url "$apk_url" \
                --published-at "$published_at" \
                --release-notes-url "$notes_url"

              test -s self-update.json
              existing_manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/self-update.json?cb=pre-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${tag}"
              if curl -fsSL --retry 2 --retry-delay 2 "$existing_manifest_url" -o existing-self-update.json \
                  && cmp -s existing-self-update.json self-update.json; then
                echo "SELF_UPDATE_MANIFEST_UNCHANGED tag=$tag; keeping existing release asset untouched"
              else
                gh release upload "$tag" self-update.json --clobber --repo "$GITHUB_REPOSITORY"
              fi

              public_manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/self-update.json?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${tag}"
              curl -fL --retry 3 --retry-delay 3 "$public_manifest_url" -o public-self-update.json

              python3 "$GITHUB_WORKSPACE/tools/release/verify_self_update_manifest.py" \
                --manifest public-self-update.json \
                --apk DPC-AIO-enterprise-release.apk \
                --tag "$tag" \
                --channel "$channel" \
                --package "$package_name" \
                --version-code "$version_code" \
                --version-name "$version_name" \
                --apk-url "$apk_url" \
                --apk-sha256 "$expected_sha"

              echo "REPAIR_SELF_UPDATE_MANIFEST_OK tag=$tag channel=$channel version=$version_name code=$version_code sha256=$expected_sha"
            )
          done

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.repair_manifests_only != true || inputs.signing_mode == 'continuous-v2' || inputs.publish_continuous_v2 == true || inputs.first_continuous_v2_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      artifact_name: ${{ steps.mode.outputs.artifact_name }}
      should_publish: ${{ steps.mode.outputs.should_publish }}
      stable_signing_configured: ${{ steps.mode.outputs.stable_signing_configured }}
      signing_mode: ${{ steps.signing.outputs.mode || steps.signing_v2.outputs.mode }}
      self_update_manifest: ${{ steps.self_update_manifest.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve pipeline mode
        id: mode
        env:
          HAS_RELEASE_KEYSTORE: ${{ secrets.DPC_AIO_RELEASE_KEYSTORE_B64 != '' }}
          HAS_RELEASE_STORE_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_STORE_PASSWORD != '' }}
          HAS_RELEASE_KEY_ALIAS: ${{ secrets.DPC_AIO_RELEASE_KEY_ALIAS != '' }}
          HAS_RELEASE_KEY_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_KEY_PASSWORD != '' }}
          HAS_EXPECTED_SIGNING_CERT: ${{ vars.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 != '' || secrets.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 != '' }}
          STABLE_SIGNING_CONFIGURED: ${{ secrets.DPC_AIO_RELEASE_KEYSTORE_B64 != '' && secrets.DPC_AIO_RELEASE_STORE_PASSWORD != '' && secrets.DPC_AIO_RELEASE_KEY_ALIAS != '' && secrets.DPC_AIO_RELEASE_KEY_PASSWORD != '' && (vars.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 != '' || secrets.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 != '') }}
          HAS_LEGACY_SIGNING_PASSWORD: ${{ secrets.DPC_AIO_LEGACY_SIGNING_PASSWORD != '' }}
          HAS_V2_CUSTOM_APK_URL: ${{ inputs.apk_url != '' }}
          HAS_V2_REPAIR_REQUEST: ${{ inputs.repair_manifests_only == true }}
          V2_PUBLISH_REQUESTED: ${{ inputs.publish_continuous_v2 == true }}
          V2_FIRST_RELEASE_REQUESTED: ${{ inputs.first_continuous_v2_release == true }}
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.signing_mode || 'auto' }}"

          missing=()
          [[ "$HAS_RELEASE_KEYSTORE" == "true" ]] || missing+=("DPC_AIO_RELEASE_KEYSTORE_B64")
          [[ "$HAS_RELEASE_STORE_PASSWORD" == "true" ]] || missing+=("DPC_AIO_RELEASE_STORE_PASSWORD")
          [[ "$HAS_RELEASE_KEY_ALIAS" == "true" ]] || missing+=("DPC_AIO_RELEASE_KEY_ALIAS")
          [[ "$HAS_RELEASE_KEY_PASSWORD" == "true" ]] || missing+=("DPC_AIO_RELEASE_KEY_PASSWORD")
          [[ "$HAS_EXPECTED_SIGNING_CERT" == "true" ]] || missing+=("DPC_AIO_EXPECTED_SIGNING_CERT_SHA256")

          AUTO_EMERGENCY_FALLBACK="false"
          if [[ "$requested" != "continuous-v2" && ( "$V2_PUBLISH_REQUESTED" == "true" || "$V2_FIRST_RELEASE_REQUESTED" == "true" ) ]]; then
            echo "CONTINUOUS_V2_ROUTE_INVALID: v2 publication flags require continuous-v2 mode" >&2
            exit 1
          fi
          if [[ "$V2_FIRST_RELEASE_REQUESTED" == "true" && "$V2_PUBLISH_REQUESTED" != "true" ]]; then
            echo "CONTINUOUS_V2_ROUTE_INVALID: initial release requires explicit publication" >&2
            exit 1
          fi
          if [[ "$requested" == "continuous-v2" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REPOSITORY" != "FuzzsT/ENRROL_NEW" || "$HAS_V2_CUSTOM_APK_URL" == "true" || "$HAS_V2_REPAIR_REQUEST" == "true" ]]; then
              echo "CONTINUOUS_V2_ROUTE_INVALID: use a manual main build without custom APK URL or repair-only mode" >&2
              exit 1
            fi
            mode="continuous-v2"
          elif [[ "$requested" == "auto" ]]; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" && "$STABLE_SIGNING_CONFIGURED" != "true" && "$HAS_LEGACY_SIGNING_PASSWORD" != "true" ]]; then
              mode="emergency"
              AUTO_EMERGENCY_FALLBACK="true"
              echo "AUTO_EMERGENCY_FALLBACK: stable signing is unavailable; publishing a fresh recovery APK instead of failing the rolling build."
              echo "::warning title=CONTINUOUS_BLOCKED::Stable signing is unavailable. Emergency is a recovery build only; configure DPC_AIO_LEGACY_SIGNING_PASSWORD to update Continuous."
              printf '%s\n' '### Continuous: BLOCKED' 'Emergency recovery only. Configure the existing stable signer via repository Actions secrets (DPC_AIO_LEGACY_SIGNING_PASSWORD or the full signing configuration).' >> "$GITHUB_STEP_SUMMARY"
            else
              mode="stable"
            fi
          else
            mode="$requested"
          fi

          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$mode" == "emergency" && "$AUTO_EMERGENCY_FALLBACK" != "true" ]]; then
            echo "Emergency signing is opt-in only unless auto fallback is required on main." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$mode" != "stable" ]]; then
            echo "Tag builds must use stable signing." >&2
            exit 1
          fi

          # A partial stable configuration must not be mixed with a legacy password.
          if [[ "$mode" == "stable" && "$STABLE_SIGNING_CONFIGURED" != "true" && ( "$HAS_RELEASE_KEYSTORE" == "true" || "$HAS_RELEASE_STORE_PASSWORD" == "true" || "$HAS_RELEASE_KEY_ALIAS" == "true" || "$HAS_RELEASE_KEY_PASSWORD" == "true" ) ]]; then
            echo "SIGNING_CONFIG_CONFLICT: incomplete stable signer configuration; complete the original key configuration or use only the legacy secret." >&2
            echo "Missing stable signing configuration: ${missing[*]}" >&2
            exit 1
          fi

          if [[ "$mode" == "stable" && "$STABLE_SIGNING_CONFIGURED" != "true" ]]; then
            if [[ "$HAS_LEGACY_SIGNING_PASSWORD" == "true" ]]; then
              echo "PASSWORD_RELEASE_KEYSTORE: stable repository secrets are absent; using the persisted password-backed continuous-release signer."
            else
              echo "STABLE_SIGNING_KEY_REQUIRED: normal/stable build will not fall back to emergency signing." >&2
              echo "::error title=CONTINUOUS_BLOCKED::Configure the existing signer using DPC_AIO_LEGACY_SIGNING_PASSWORD or the complete stable signing configuration."
              printf '%s\n' '### Continuous: BLOCKED' 'No stable signing configuration is available. Configure the existing signing key in Settings > Secrets and variables > Actions.' >> "$GITHUB_STEP_SUMMARY"
              echo "Missing stable signing configuration: ${missing[*]}" >&2
              echo "For the existing dpc-aio-continuous channel, configure the original password in the DPC_AIO_LEGACY_SIGNING_PASSWORD Actions secret." >&2
              exit 1
            fi
          fi

          if [[ "$mode" == "continuous-v2" ]]; then
            release_tag="dpc-aio-continuous-v2"
            artifact_name="DPC-AIO-continuous-v2-verified-build-only"
            should_publish="false"
            if [[ "$V2_PUBLISH_REQUESTED" == "true" ]]; then
              artifact_name="DPC-AIO-continuous-v2-verified-release"
              should_publish="true"
            else
              echo "::notice title=CONTINUOUS_V2_BUILD_ONLY::Verified artifacts only; publication was not requested."
            fi
          elif [[ "$mode" == "emergency" ]]; then
            release_tag="dpc-aio-emergency-enrollment"
            artifact_name="DPC-AIO-emergency-enrollment"
            should_publish="true"
          else
            artifact_name="DPC-AIO-enterpriseRelease-enrollment"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              release_tag="$GITHUB_REF_NAME"
              should_publish="true"
            else
              release_tag="dpc-aio-continuous"
              if [[ "$mode" == "stable" && "$GITHUB_REF" == "refs/heads/main" && -z "${{ inputs.apk_url }}" ]]; then
                should_publish="true"
              elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.apk_url }}" ]]; then
                should_publish="true"
              else
                should_publish="false"
              fi
            fi
          fi

          {
            echo "mode=$mode"
            echo "release_tag=$release_tag"
            echo "artifact_name=$artifact_name"
            echo "should_publish=$should_publish"
            echo "stable_signing_configured=$STABLE_SIGNING_CONFIGURED"
            echo "auto_emergency_fallback=$AUTO_EMERGENCY_FALLBACK"
          } >> "$GITHUB_OUTPUT"

          {
            echo "DPC_AIO_PIPELINE_MODE=$mode"
            echo "DPC_AIO_RELEASE_TAG=$release_tag"
            echo "DPC_AIO_ARTIFACT_NAME=$artifact_name"
            echo "DPC_AIO_GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
            echo "DPC_AIO_SIGNING_ENV=$RUNNER_TEMP/dpc-aio-signing.env"
          } >> "$GITHUB_ENV"

          echo "Pipeline mode: $mode"
          echo "Release tag: $release_tag"
          echo "Publish: $should_publish"

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android 17 SDK + native toolchain
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_CLI="$(command -v android)"
          test -x "$ANDROID_CLI"
          SDK_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          "$ANDROID_CLI" sdk list --all --all-versions --canary > "$SDK_LIST"

          has_package() {
            awk -v wanted="$1" '
              $1 == wanted { found=1 }
              END { exit(found ? 0 : 1) }
            ' "$SDK_LIST"
          }

          platform_pkg="$(
            awk '$1 ~ /^platforms\/android-37\.[0-9]+$/ { print $1 }' "$SDK_LIST" | sort -V | tail -n1
          )"
          if [[ -z "$platform_pkg" ]] && has_package "platforms/android-CinnamonBun"; then
            platform_pkg="platforms/android-CinnamonBun"
          fi
          if [[ -z "$platform_pkg" ]]; then
            echo "Android 17 platform not found." >&2
            grep -E 'platforms/android-(37|CinnamonBun)' "$SDK_LIST" || true
            exit 1
          fi

          build_tools_pkg="$(
            awk '$1 ~ /^build-tools\/37\./ { print $1 }' "$SDK_LIST" | sort -V | tail -n1
          )"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg="build-tools/36.0.0"

          "$ANDROID_CLI" sdk install --canary \
            "$platform_pkg" \
            "$build_tools_pkg" \
            "ndk/28.2.13676358" \
            "cmake/3.22.1"

          installed_name="${platform_pkg#platforms/}"
          installed_path="$ANDROID_SDK_ROOT/platforms/$installed_name"
          test -e "$installed_path/android.jar"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -x "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"

      - name: Set up Python QR dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Resolve public APK URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DPC_AIO_PIPELINE_MODE" == "stable" && -n "${{ inputs.apk_url }}" ]]; then
            url='${{ inputs.apk_url }}'
          else
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DPC_AIO_RELEASE_TAG}/DPC-AIO-enterprise-release.apk"
          fi
          echo "DPC_AIO_PROVISIONING_APK_URL=$url" >> "$GITHUB_ENV"
          echo "DPC_AIO_PERSISTED_SIGNING_KEYSTORE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/dpc-aio-continuous/DPC-AIO-signing-keystore.enc" >> "$GITHUB_ENV"
          echo "Provisioning APK URL: $url"

      - name: Prepare Continuous v2 signer
        id: signing_v2
        if: env.DPC_AIO_PIPELINE_MODE == 'continuous-v2'
        env:
          DPC_AIO_V2_RELEASE_KEYSTORE_B64: ${{ secrets.DPC_AIO_V2_RELEASE_KEYSTORE_B64 }}
          DPC_AIO_V2_RELEASE_STORE_PASSWORD: ${{ secrets.DPC_AIO_V2_RELEASE_STORE_PASSWORD }}
          DPC_AIO_V2_RELEASE_KEY_ALIAS: ${{ secrets.DPC_AIO_V2_RELEASE_KEY_ALIAS }}
          DPC_AIO_V2_RELEASE_KEY_PASSWORD: ${{ secrets.DPC_AIO_V2_RELEASE_KEY_PASSWORD }}
          DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256_VARIABLE: ${{ vars.DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256 }}
          DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256_SECRET: ${{ secrets.DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256 }}
          DPC_AIO_STRICT_EXPECTED_SIGNING_CERT: "true"
          DPC_AIO_MANUAL_SIGNING_PASSWORD: ""
          DPC_AIO_PERSISTED_SIGNING_KEYSTORE_URL: ""
          DPC_AIO_REQUIRE_PERSISTED_SIGNER: "true"
        shell: bash
        run: |
          set -euo pipefail
          DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256="$(python3 tools/release/resolve_signing_pin.py DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256)"
          export DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256
          python3 tools/release/check_continuous_v2_preflight.py
          export DPC_AIO_RELEASE_KEYSTORE_B64="$DPC_AIO_V2_RELEASE_KEYSTORE_B64"
          export DPC_AIO_RELEASE_STORE_PASSWORD="$DPC_AIO_V2_RELEASE_STORE_PASSWORD"
          export DPC_AIO_RELEASE_KEY_ALIAS="$DPC_AIO_V2_RELEASE_KEY_ALIAS"
          export DPC_AIO_RELEASE_KEY_PASSWORD="$DPC_AIO_V2_RELEASE_KEY_PASSWORD"
          export DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256="$DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256"
          bash tools/release/prepare_enterprise_signing.sh

      - name: Prepare stable signer
        id: signing
        if: env.DPC_AIO_PIPELINE_MODE == 'stable' || (env.DPC_AIO_PIPELINE_MODE == 'emergency' && steps.mode.outputs.stable_signing_configured == 'true')
        env:
          DPC_AIO_RELEASE_KEYSTORE_B64: ${{ secrets.DPC_AIO_RELEASE_KEYSTORE_B64 }}
          DPC_AIO_RELEASE_STORE_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_STORE_PASSWORD }}
          DPC_AIO_RELEASE_KEY_ALIAS: ${{ secrets.DPC_AIO_RELEASE_KEY_ALIAS }}
          DPC_AIO_RELEASE_KEY_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_KEY_PASSWORD }}
          DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256_VARIABLE: ${{ vars.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 }}
          DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256_SECRET: ${{ secrets.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 }}
          DPC_AIO_STRICT_EXPECTED_SIGNING_CERT: "false"
          DPC_AIO_MANUAL_SIGNING_PASSWORD: ${{ secrets.DPC_AIO_LEGACY_SIGNING_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          DPC_AIO_REQUIRE_PERSISTED_SIGNER: "true"
        shell: bash
        run: |
          set -euo pipefail
          DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256="$(python3 tools/release/resolve_signing_pin.py DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256 --allow-missing)"
          export DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256
          if [[ "${{ steps.mode.outputs.stable_signing_configured }}" == "true" ]]; then
            for name in DPC_AIO_RELEASE_KEYSTORE_B64 DPC_AIO_RELEASE_STORE_PASSWORD DPC_AIO_RELEASE_KEY_ALIAS DPC_AIO_RELEASE_KEY_PASSWORD DPC_AIO_CONFIGURED_SIGNING_CERT_SHA256; do
              if [[ -z "${!name:-}" ]]; then
                echo "STABLE_SIGNING_KEY_REQUIRED: $name is not configured" >&2
                exit 1
              fi
            done
          else
            if ! DPC_AIO_PERSISTED_SIGNING_KEYSTORE_SHA256="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dpc-aio-continuous" --jq '[.assets[] | select(.name == "DPC-AIO-signing-keystore.enc")] | if length == 1 then .[0].digest else empty end')"; then
              echo "PERSISTED_SIGNING_ASSET_METADATA_UNAVAILABLE" >&2
              exit 1
            fi
            if [[ ! "$DPC_AIO_PERSISTED_SIGNING_KEYSTORE_SHA256" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
              echo "PERSISTED_SIGNING_ASSET_DIGEST_INVALID" >&2
              exit 1
            fi
            export DPC_AIO_PERSISTED_SIGNING_KEYSTORE_SHA256
          fi
          bash tools/release/prepare_enterprise_signing.sh

      - name: Prepare emergency ephemeral signer
        if: env.DPC_AIO_PIPELINE_MODE == 'emergency' && steps.mode.outputs.stable_signing_configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dpc-aio-emergency-release.p12"
          alias="dpc-aio-emergency-ci"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          umask 077

          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$alias" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 3650 \
            -dname "CN=DPC-AIO Emergency CI, OU=GitHub Actions, O=DPC-AIO, C=PL" \
            -noprompt

          fingerprint="$(keytool -list -v -keystore "$keystore" -storetype PKCS12 -storepass "$password" -alias "$alias" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$fingerprint"

          {
            printf 'DPC_AIO_RELEASE_KEYSTORE_PATH=%q\n' "$keystore"
            printf 'DPC_AIO_RELEASE_STORE_PASSWORD=%q\n' "$password"
            printf 'DPC_AIO_RELEASE_KEY_ALIAS=%q\n' "$alias"
            printf 'DPC_AIO_RELEASE_KEY_PASSWORD=%q\n' "$password"
            printf 'DPC_AIO_EXPECTED_SIGNING_CERT_SHA256=%q\n' "$fingerprint"
            printf 'DPC_AIO_SIGNING_MODE=%q\n' 'ephemeral'
          } > "$DPC_AIO_SIGNING_ENV"
          chmod 600 "$DPC_AIO_SIGNING_ENV"

      - name: Verify Android build environment
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DPC_AIO_SIGNING_ENV"
          set -a
          source "$DPC_AIO_SIGNING_ENV"
          set +a
          mkdir -p dist
          python3 tools/android_build_preflight.py --require-signing --json-out dist/build-environment.json

      - name: Validate source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_gradle_source_completeness.py
          python3 tools/tests/test_app_android_classpath_114_contract.py
          python3 tools/tests/test_installer_android_compile_114_contract.py
          python3 tools/tests/test_build_output_paths_114_contract.py
          python3 tools/tests/test_apksigner_cert_parser_114_contract.py
          python3 tools/tests/test_app_dpc_compile_114_contract_v2.py
          python3 tools/tests/test_114_qr_release_bundle_contract.py
          python3 tools/tests/test_112_runtime_smoke_parser.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
          python3 tools/tests/test_self_update_release_manifest.py
          python3 tools/tests/test_main_stable_signing_policy_contract.py
          python3 tools/tests/test_continuous_password_signer_contract.py

      - name: Build signed enterpriseRelease
        env:
          DPC_AIO_ENROLLMENT_TOKEN: ${{ inputs.enrollment_token }}
          DPC_AIO_ENROLLMENT_ENDPOINT: ${{ inputs.enrollment_endpoint || vars.DPC_AIO_ENROLLMENT_ENDPOINT }}
          ENROLLMENT_PUBLIC_KEY_INPUT: ${{ inputs.enrollment_signing_public_key }}
          ENROLLMENT_PUBLIC_KEY_VARIABLE: ${{ vars.DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY }}
          ENROLLMENT_PUBLIC_KEY_SECRET: ${{ secrets.DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY }}
          DPC_AIO_POLICY_PROFILE: ${{ inputs.policy_profile || 'default' }}
          DPC_AIO_PROVISIONING_MODE: ${{ inputs.provisioning_mode || 'work-profile' }}
          DPC_AIO_ALLOW_OFFLINE: ${{ inputs.allow_offline || false }}
          DPC_AIO_ENROLLMENT_OFFLINE_MODE: ${{ inputs.enrollment_offline_mode || vars.DPC_AIO_ENROLLMENT_OFFLINE_MODE || 'ONLINE' }}
          DPC_AIO_OFFLINE_BUNDLE_ID: ${{ inputs.offline_bundle_id || vars.DPC_AIO_OFFLINE_BUNDLE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DPC_AIO_SIGNING_ENV"
          set -a
          source "$DPC_AIO_SIGNING_ENV"
          set +a
          DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY="$(python3 tools/release/resolve_enrollment_public_key.py)"
          export DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY
          export DPC_AIO_CI_VERSION_CODE=$((26 + GITHUB_RUN_NUMBER))
          if [[ "$DPC_AIO_PIPELINE_MODE" == "continuous-v2" ]]; then
            export DPC_AIO_CONTINUOUS_V2_BUILD=true
          fi
          echo "CI version code: $DPC_AIO_CI_VERSION_CODE"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app-dpc:assembleEnterpriseRelease

      - name: Verify signer and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DPC_AIO_SIGNING_ENV"
          set -a
          source "$DPC_AIO_SIGNING_ENV"
          set +a

          mkdir -p dist
          apk="$(find apps/dpc/app/build/outputs/apk/enterprise/release -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          apksigner_bin="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner_bin"

          cert_output="$("$apksigner_bin" verify --print-certs "$apk" 2>&1)"
          printf '%s\n' "$cert_output"
          observed="$(printf '%s\n' "$cert_output" | python3 tools/release/extract_apksigner_sha256.py)"
          expected="$(printf '%s' "$DPC_AIO_EXPECTED_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$observed" && "$observed" == "$expected" ]] || {
            echo "SIGNING_CERT_MISMATCH expected=$expected observed=$observed" >&2
            exit 1
          }

          cp "$apk" dist/DPC-AIO-enterprise-release.apk
          if [[ -n "${DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH:-}" && -f "$DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH" ]]; then
            cp "$DPC_AIO_SIGNING_EXPORT_ENCRYPTED_PATH" dist/DPC-AIO-signing-keystore.enc
          fi
          for file in \
            provisioning.json provisioning-payload.txt provisioning-metadata.json provisioning-qr.png \
            work-profile-provisioning.json work-profile-provisioning-payload.txt work-profile-provisioning-metadata.json work-profile-qr.png \
            device-owner-provisioning.json device-owner-provisioning-payload.txt device-owner-provisioning-metadata.json device-owner-qr.png
          do
            cp "apps/dpc/app/build/outputs/provisioning/enterprise/release/$file" dist/
          done

          printf '%s\n' "$DPC_AIO_SIGNING_MODE" > dist/signing-mode.txt
          printf '%s\n' "$observed" > dist/signing-cert-sha256.txt
          sha256sum dist/DPC-AIO-enterprise-release.apk > dist/DPC-AIO-enterprise-release.apk.sha256

      - name: Build self-update manifest
        id: self_update_manifest
        if: steps.mode.outputs.should_publish == 'true' || env.DPC_AIO_PIPELINE_MODE == 'continuous-v2'
        shell: bash
        run: |
          set -euo pipefail
          signing_mode="$(tr -d '[:space:]' < dist/signing-mode.txt)"
          if [[ "$DPC_AIO_PIPELINE_MODE" == "emergency" && "$signing_mode" != "stable" ]]; then
            rm -f dist/self-update.json
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "EMERGENCY_SELF_UPDATE_MANIFEST_SKIPPED_EPHEMERAL_SIGNER"
            exit 0
          fi

          apk="dist/DPC-AIO-enterprise-release.apk"
          test -s "$apk"

          aapt_bin="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          test -x "$aapt_bin"
          package_line="$("$aapt_bin" dump badging "$apk" | head -n1)"
          package_name="$(printf '%s\n' "$package_line" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          version_code="$(printf '%s\n' "$package_line" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$(printf '%s\n' "$package_line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          [[ -n "$package_name" && -n "$version_code" && -n "$version_name" ]]
          expected_code=$((26 + GITHUB_RUN_NUMBER))
          [[ "$version_code" == "$expected_code" ]] || {
            echo "CI_VERSION_CODE_MISMATCH expected=$expected_code observed=$version_code" >&2
            exit 1
          }

          if [[ "$DPC_AIO_PIPELINE_MODE" == "continuous-v2" ]]; then
            channel="continuous-v2"
            asset_tag="dpc-aio-continuous-v2"
            [[ "$DPC_AIO_RELEASE_TAG" == "$asset_tag" && "$signing_mode" == "stable" ]]
          elif [[ "$DPC_AIO_PIPELINE_MODE" == "emergency" ]]; then
            channel="emergency"
            asset_tag="dpc-aio-emergency-enrollment"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            channel="stable"
            asset_tag="dpc-aio-stable"
          else
            channel="continuous"
            asset_tag="$DPC_AIO_RELEASE_TAG"
          fi

          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${asset_tag}/DPC-AIO-enterprise-release.apk"
          notes_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${DPC_AIO_RELEASE_TAG}"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 tools/release/build_self_update_manifest.py \
            --apk "$apk" \
            --out dist/self-update.json \
            --channel "$channel" \
            --package "$package_name" \
            --version-name "$version_name" \
            --version-code "$version_code" \
            --apk-url "$apk_url" \
            --published-at "$published_at" \
            --release-notes-url "$notes_url"
          test -s dist/self-update.json
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Validate QR to exact APK binding
        shell: bash
        run: |
          set -euo pipefail
          compat_mode="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["provisioningMode"])' dist/provisioning-metadata.json)"
          python3 tools/provisioning/verify_provisioning_qr.py --json dist/provisioning.json --qr dist/provisioning-qr.png --apk dist/DPC-AIO-enterprise-release.apk --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode "$compat_mode" > dist/provisioning-validation.json
          python3 tools/provisioning/verify_provisioning_qr.py --json dist/work-profile-provisioning.json --qr dist/work-profile-qr.png --apk dist/DPC-AIO-enterprise-release.apk --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode work-profile > dist/work-profile-validation.json
          python3 tools/provisioning/verify_provisioning_qr.py --json dist/device-owner-provisioning.json --qr dist/device-owner-qr.png --apk dist/DPC-AIO-enterprise-release.apk --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode fully-managed > dist/device-owner-validation.json

      - name: Cleanup signing material before emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/dpc-aio-enterprise-release.jks" "$RUNNER_TEMP/dpc-aio-emergency-release.p12"
          rm -f "$DPC_AIO_SIGNING_ENV" "$RUNNER_TEMP/dpc-aio-enterprise-release.p12"
          printf '%s=\n' DPC_AIO_RELEASE_STORE_PASSWORD DPC_AIO_RELEASE_KEY_PASSWORD DPC_AIO_RELEASE_KEY_ALIAS DPC_AIO_RELEASE_KEYSTORE_PATH >> "$GITHUB_ENV"
          test ! -e "$DPC_AIO_SIGNING_ENV"
          test ! -e "$RUNNER_TEMP/dpc-aio-enterprise-release.p12"

      - name: Align cmdline-tools latest for emulator runner
        shell: bash
        run: |
          set -euo pipefail
          cmdline_tools_current="$ANDROID_SDK_ROOT/cmdline-tools/22.0"
          cmdline_tools_latest="$ANDROID_SDK_ROOT/cmdline-tools/latest"
          test -x "$cmdline_tools_current/bin/sdkmanager"
          grep -q '^Pkg.Revision=22.0$' "$cmdline_tools_current/source.properties"
          rm -rf "$cmdline_tools_latest"
          ln -s "$cmdline_tools_current" "$cmdline_tools_latest"
          test -x "$cmdline_tools_latest/bin/sdkmanager"
          grep -q '^Pkg.Revision=22.0$' "$cmdline_tools_latest/source.properties"

      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AOSP Device Owner runtime smoke
        id: runtime_smoke_primary
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          script: >-
            python3 tools/runtime/android_device_owner_smoke.py
            --apk dist/DPC-AIO-enterprise-release.apk
            --out dist/android-runtime-smoke.json
            --expected-version 1.1.4

      - name: Classify runtime smoke failure
        if: steps.runtime_smoke_primary.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/android-runtime-smoke.json
          cp dist/android-runtime-smoke.json dist/android-runtime-smoke-attempt1.json
          python3 tools/runtime/runtime_smoke_retry_gate.py --report dist/android-runtime-smoke.json
          echo "DPC_AIO_RUNTIME_RETRY=1" >> "$GITHUB_ENV"

      - name: AOSP Device Owner runtime smoke retry
        if: env.DPC_AIO_RUNTIME_RETRY == '1'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          script: >-
            python3 tools/runtime/android_device_owner_smoke.py
            --apk dist/DPC-AIO-enterprise-release.apk
            --out dist/android-runtime-smoke.json
            --expected-version 1.1.4

      - name: Build QR release bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/build_qr_release_bundle.py --dist dist --version 1.1.4 --apk-url "$DPC_AIO_PROVISIONING_APK_URL"
          test -f dist/DPC-AIO-1.1.4-QR-RELEASE-BUNDLE.zip
          test -f dist/DPC-AIO-1.1.4-QR-RELEASE-BUNDLE.zip.sha256
          test -f dist/QR-README.md
          test -f dist/RELEASE-INDEX.json
          test -f dist/SHA256SUMS.txt

      - name: Upload verified enrollment artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DPC_AIO_ARTIFACT_NAME }}
          path: dist/

      - name: Cleanup signing material fallback
        if: always()
        shell: bash
        run: |
          rm -f "$DPC_AIO_SIGNING_ENV" || true
          rm -f "$RUNNER_TEMP/dpc-aio-enterprise-release.jks" "$RUNNER_TEMP/dpc-aio-enterprise-release.p12" "$RUNNER_TEMP/dpc-aio-emergency-release.p12" || true

  publish:
    needs: [build, repair-self-update-manifests]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.should_publish == 'true' && (needs.repair-self-update-manifests.result == 'success' || needs.repair-self-update-manifests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout v2 publication guard
        if: needs.build.outputs.mode == 'continuous-v2'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download verified artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Guard Continuous v2 release progression
        id: v2_guard
        if: needs.build.outputs.mode == 'continuous-v2'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SIGNING_MODE: ${{ needs.build.outputs.signing_mode }}
          SELF_UPDATE_MANIFEST: ${{ needs.build.outputs.self_update_manifest }}
          EXPECTED_V2_CERT_VARIABLE: ${{ vars.DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256 }}
          EXPECTED_V2_CERT_SECRET: ${{ secrets.DPC_AIO_V2_EXPECTED_SIGNING_CERT_SHA256 }}
          FIRST_RELEASE: ${{ inputs.first_continuous_v2_release == true }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_V2_CERT="$(python3 tools/release/resolve_signing_pin.py EXPECTED_V2_CERT)"
          export EXPECTED_V2_CERT
          [[ "$GITHUB_REPOSITORY" == "FuzzsT/ENRROL_NEW" && "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$RELEASE_TAG" == "dpc-aio-continuous-v2" && "$SIGNING_MODE" == "stable-secrets" && "$SELF_UPDATE_MANIFEST" == "true" ]]
          guard_dir="$(mktemp -d)"
          trap 'rm -rf "$guard_dir"' EXIT
          gh api "repos/FuzzsT/ENRROL_NEW/releases?per_page=1" >/dev/null
          status="$(curl --silent --show-error --proto '=https' --connect-timeout 15 --max-time 60 \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --output "$guard_dir/release.json" --write-out '%{http_code}' \
            "https://api.github.com/repos/FuzzsT/ENRROL_NEW/releases/tags/dpc-aio-continuous-v2")"
          case "$status" in
            200)
              [[ "$FIRST_RELEASE" != "true" ]] || { echo "CONTINUOUS_V2_ALREADY_EXISTS" >&2; exit 1; }
              gh release download dpc-aio-continuous-v2 --repo FuzzsT/ENRROL_NEW --pattern self-update.json --pattern signing-cert-sha256.txt --dir "$guard_dir"
              python3 tools/release/check_continuous_v2_release.py --dist dist --tag "$RELEASE_TAG" --expected-pin "$EXPECTED_V2_CERT" --prior "$guard_dir"
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              [[ "$FIRST_RELEASE" == "true" ]] || { echo "CONTINUOUS_V2_FIRST_RELEASE_CONFIRMATION_REQUIRED" >&2; exit 1; }
              python3 tools/release/check_continuous_v2_release.py --dist dist --tag "$RELEASE_TAG" --expected-pin "$EXPECTED_V2_CERT" --first-release
              echo "release_exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "CONTINUOUS_V2_RELEASE_LOOKUP_FAILED HTTP=$status" >&2
              exit 1
              ;;
          esac

      - name: Guard continuous release progression
        if: needs.build.outputs.release_tag == 'dpc-aio-continuous'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          guard_dir="$(mktemp -d)"
          trap 'rm -rf "$guard_dir"' EXIT
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/dpc-aio-continuous" > "$guard_dir/release.json"
          gh release download dpc-aio-continuous --repo "$GITHUB_REPOSITORY" --pattern self-update.json --dir "$guard_dir"
          python3 - "$guard_dir/release.json" "$guard_dir/self-update.json" dist/self-update.json dist/DPC-AIO-enterprise-release.apk <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          release, old, new = (json.loads(Path(path).read_text(encoding="utf-8")) for path in sys.argv[1:4])
          apk = Path(sys.argv[4])
          def check_manifest(manifest):
              code = manifest.get("versionCode")
              digest = manifest.get("apkSha256")
              if (manifest.get("schemaVersion") != 1 or manifest.get("channel") != "continuous"
                  or manifest.get("packageName") != "io.dpcaio.app"
                  or type(code) is not int or not 0 < code <= 2100000000
                  or not isinstance(digest, str) or not re.fullmatch(r"[a-fA-F0-9]{64}", digest)):
                  raise SystemExit("CONTINUOUS_RELEASE_MANIFEST_INVALID")
              return code, digest.lower()
          old_code, old_sha = check_manifest(old)
          new_code, new_sha = check_manifest(new)
          assets = [asset for asset in release.get("assets", []) if asset.get("name") == apk.name]
          if len(assets) != 1 or assets[0].get("digest") != "sha256:" + old_sha:
              raise SystemExit("CONTINUOUS_RELEASE_DIGEST_MISMATCH: published manifest does not match current APK asset")
          with apk.open("rb") as stream:
              actual = hashlib.file_digest(stream, "sha256").hexdigest()
          if actual != new_sha or new.get("apkSize") != apk.stat().st_size:
              raise SystemExit("CONTINUOUS_RELEASE_DIGEST_MISMATCH: candidate manifest does not match built APK")
          if new_code < old_code:
              raise SystemExit(f"CONTINUOUS_RELEASE_ROLLBACK: published={old_code} candidate={new_code}")
          if new_code == old_code and new_sha != old_sha:
              raise SystemExit(f"CONTINUOUS_RELEASE_VERSION_REUSE: code={new_code}; start a new build instead of rerunning")
          print(f"CONTINUOUS_RELEASE_PROGRESSION_OK: published={old_code} candidate={new_code}")
          PY

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.build.outputs.mode }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SIGNING_MODE: ${{ needs.build.outputs.signing_mode }}
          SELF_UPDATE_MANIFEST: ${{ needs.build.outputs.self_update_manifest }}
          V2_RELEASE_EXISTS: ${{ steps.v2_guard.outputs.release_exists }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$MODE" == "continuous-v2" ]]; then
            [[ "$RELEASE_TAG" == "dpc-aio-continuous-v2" && "$SIGNING_MODE" == "stable-secrets" && "$SELF_UPDATE_MANIFEST" == "true" ]]
            [[ "$V2_RELEASE_EXISTS" == "true" || "$V2_RELEASE_EXISTS" == "false" ]]
            title="DPC-AIO Continuous v2 Enrollment"
            notes="Dedicated v2 signer and Self Update channel. Existing legacy installations require an authorized signing lineage for in-place updates. Commit: $GITHUB_SHA."
            prerelease="--prerelease"
          elif [[ "$MODE" == "emergency" ]]; then
            title="DPC-AIO Emergency Enrollment"
            if [[ "$SELF_UPDATE_MANIFEST" == "true" ]]; then
              notes="Emergency DPC-AIO 1.1.4 build from commit $GITHUB_SHA signed by the configured stable release key. APK and QRs are verified against each other and the build is eligible for the EMERGENCY Self Update channel."
            else
              notes="Run-specific emergency DPC-AIO 1.1.4 recovery build from commit $GITHUB_SHA. APK and QRs are verified against each other. The signer is ephemeral, so this release is fresh-install/recovery only and is not advertised through Self Update."
            fi
            prerelease="--prerelease"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            title="$RELEASE_TAG"
            notes="DPC-AIO verified stable-signing release from commit $GITHUB_SHA. Includes Work Profile, Device Owner and compatibility QR assets plus DPC-AIO-1.1.4-QR-RELEASE-BUNDLE.zip."
            prerelease=""
          else
            title="DPC-AIO Continuous Enrollment"
            if [[ "$SIGNING_MODE" == "password-release-keystore" ]]; then
              signing_note="Zero-Settings signing continuity: restored the encrypted DPC-AIO-signing-keystore.enc asset with the supplied workflow password and re-published it for future update-compatible runs."
            else
              signing_note="Signed by the configured stable repository release key."
            fi
            notes="Update-stable DPC-AIO 1.1.4 enrollment artifacts from commit $GITHUB_SHA. APK and QRs are verified against each other. Signing mode: ${SIGNING_MODE:-stable-secrets}. $signing_note"
            prerelease="--prerelease"
          fi

          if [[ "$MODE" != "continuous-v2" && "$RELEASE_TAG" == "dpc-aio-continuous-v2" ]]; then
            echo "CONTINUOUS_V2_ROUTE_INVALID" >&2
            exit 1
          fi
          if [[ "$MODE" == "continuous-v2" ]]; then
            if [[ "$V2_RELEASE_EXISTS" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $prerelease
            else
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $prerelease
            fi
          elif gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $prerelease
          fi

          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            current_bundle="DPC-AIO-1.1.4-QR-RELEASE-BUNDLE.zip"
            current_bundle_hash="${current_bundle}.sha256"
            while IFS= read -r asset; do
              [[ -n "$asset" ]] || continue
              case "$asset" in
                DPC-AIO-*-QR-RELEASE-BUNDLE.zip|DPC-AIO-*-QR-RELEASE-BUNDLE.zip.sha256)
                  if [[ "$asset" != "$current_bundle" && "$asset" != "$current_bundle_hash" ]]; then
                    echo "Removing stale rolling release asset: $asset"
                    gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
                  fi
                  ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          fi

          if [[ "$MODE" == "continuous-v2" ]]; then
            for file in dist/*; do
              [[ "$file" == "dist/self-update.json" ]] && continue
              gh release upload "$RELEASE_TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            done
            gh release upload "$RELEASE_TAG" dist/self-update.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          fi

          if [[ "$MODE" == "stable" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            stable_alias="dpc-aio-stable"
            stable_title="DPC-AIO Stable Update Channel"
            stable_notes="Rolling alias for the latest verified stable-signed DPC-AIO APK. Versioned release notes remain on $RELEASE_TAG."
            if gh release view "$stable_alias" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$stable_alias" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$stable_title" --notes "$stable_notes" --prerelease
            else
              gh release create "$stable_alias" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$stable_title" --notes "$stable_notes" --prerelease
            fi
            test -s dist/self-update.json
            gh release upload "$stable_alias" \
              dist/DPC-AIO-enterprise-release.apk \
              dist/DPC-AIO-enterprise-release.apk.sha256 \
              dist/signing-cert-sha256.txt \
              dist/self-update.json \
              --clobber --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify full release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          target="$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("target_commitish", ""))')"
          [[ "$target" == "$GITHUB_SHA" ]] || {
            echo "FULL_RELEASE_TARGET_MISMATCH tag=$RELEASE_TAG expected=$GITHUB_SHA observed=$target" >&2
            exit 1
          }

          checked=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_digest="$(printf '%s' "$release_json" | python3 -c 'import json,sys; data=json.load(sys.stdin); name=sys.argv[1]; print(next((a.get("digest", "") for a in data.get("assets", []) if a.get("name")==name), ""))' "$name")"
            if [[ "$remote_digest" != "sha256:$local_sha" ]]; then
              echo "FULL_RELEASE_ASSET_MISMATCH tag=$RELEASE_TAG asset=$name expected=sha256:$local_sha observed=${remote_digest:-missing}" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done < <(find dist -maxdepth 1 -type f -print0 | sort -z)

          (( checked > 0 )) || {
            echo "FULL_RELEASE_ASSET_MISMATCH tag=$RELEASE_TAG reason=no-local-assets" >&2
            exit 1
          }
          echo "FULL_RELEASE_ASSET_SET_VERIFIED tag=$RELEASE_TAG assets=$checked target=$target"

      - name: Verify published APK byte identity
        env:
          MODE: ${{ needs.build.outputs.mode }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum dist/DPC-AIO-enterprise-release.apk | awk '{print $1}')"

          verify_release_asset() {
            local tag="$1"
            local matched="0"
            for attempt in $(seq 1 12); do
              cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${tag}-${attempt}"
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/DPC-AIO-enterprise-release.apk?cb=${cache_bust}"
              if curl -fL --retry 2 --retry-delay 3 "$url" -o public.apk; then
                observed="$(sha256sum public.apk | awk '{print $1}')"
                if cmp -s dist/DPC-AIO-enterprise-release.apk public.apk && [[ "$observed" == "$expected" ]]; then
                  matched="1"
                  break
                fi
                echo "Attempt $attempt: $tag public APK hash $observed, waiting for release asset propagation..."
              fi
              sleep 10
            done
            [[ "$matched" == "1" ]] || {
              echo "PUBLISHED_APK_PUBLIC_VERIFY_FAILED tag=$tag" >&2
              exit 1
            }
          }

          verify_release_asset "$RELEASE_TAG"
          if [[ "$MODE" == "stable" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            verify_release_asset "dpc-aio-stable"
          fi
          echo "Published APK asset(s) are public and byte-identical to the QR-bound build."

      - name: Verify published self-update manifest
        if: needs.build.outputs.should_publish == 'true' && needs.build.outputs.self_update_manifest == 'true'
        env:
          MODE: ${{ needs.build.outputs.mode }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$MODE" == "continuous-v2" ]]; then
            [[ "$RELEASE_TAG" == "dpc-aio-continuous-v2" ]]
            manifest_tag="$RELEASE_TAG"
            expected_channel="continuous-v2"
          elif [[ "$MODE" == "emergency" ]]; then
            manifest_tag="$RELEASE_TAG"
            expected_channel="emergency"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            manifest_tag="dpc-aio-stable"
            expected_channel="stable"
          else
            manifest_tag="$RELEASE_TAG"
            expected_channel="continuous"
          fi

          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${manifest_tag}/self-update.json?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! curl -fL --retry 3 --retry-delay 3 "$manifest_url" -o public-self-update.json; then
            echo "PUBLIC_SELF_UPDATE_VERIFY_FAILED manifest_fetch tag=$manifest_tag" >&2
            exit 1
          fi

          manifest_channel="$(python3 -c 'import json; print(json.load(open("public-self-update.json", encoding="utf-8"))["channel"])')"
          manifest_package="$(python3 -c 'import json; print(json.load(open("public-self-update.json", encoding="utf-8"))["packageName"])')"
          manifest_declared_apk_url="$(python3 -c 'import json; print(json.load(open("public-self-update.json", encoding="utf-8"))["apkUrl"])')"
          manifest_apk_sha="$(python3 -c 'import json; print(json.load(open("public-self-update.json", encoding="utf-8"))["apkSha256"])')"
          manifest_apk_size="$(python3 -c 'import json; print(json.load(open("public-self-update.json", encoding="utf-8"))["apkSize"])')"
          expected_apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${manifest_tag}/DPC-AIO-enterprise-release.apk"
          local_apk_sha="$(sha256sum dist/DPC-AIO-enterprise-release.apk | awk '{print $1}')"
          local_apk_size="$(stat -c '%s' dist/DPC-AIO-enterprise-release.apk)"

          [[ "$manifest_channel" == "$expected_channel" ]] || {
            echo "PUBLIC_SELF_UPDATE_VERIFY_FAILED channel expected=$expected_channel observed=$manifest_channel" >&2
            exit 1
          }
          [[ "$manifest_package" == "io.dpcaio.app" ]] || {
            echo "PUBLIC_SELF_UPDATE_VERIFY_FAILED package=$manifest_package" >&2
            exit 1
          }
          [[ "$manifest_declared_apk_url" == "$expected_apk_url" ]] || {
            echo "PUBLIC_SELF_UPDATE_VERIFY_FAILED apk_url expected=$expected_apk_url observed=$manifest_declared_apk_url" >&2
            exit 1
          }
          [[ "$manifest_apk_size" == "$local_apk_size" ]] || {
            echo "PUBLIC_SELF_UPDATE_VERIFY_FAILED apk_size expected=$local_apk_size observed=$manifest_apk_size" >&2
            exit 1
          }

          manifest_apk_url="${manifest_declared_apk_url}?cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! curl -fL --retry 3 --retry-delay 3 "$manifest_apk_url" -o public-self-update.apk; then
            echo "PUBLIC_SELF_UPDATE_VERIFY_FAILED apk_fetch tag=$manifest_tag" >&2
            exit 1
          fi
          public_apk_sha="$(sha256sum public-self-update.apk | awk '{print $1}')"
          [[ "$public_apk_sha" == "$manifest_apk_sha" && "$public_apk_sha" == "$local_apk_sha" ]] || {
            echo "PUBLIC_SELF_UPDATE_VERIFY_FAILED sha manifest=$manifest_apk_sha public=$public_apk_sha local=$local_apk_sha" >&2
            exit 1
          }

          echo "Published self-update manifest and APK are public, consistent, and byte-identical to the local build."
