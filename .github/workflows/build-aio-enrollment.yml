name: Enrollment build + release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - 'apps/dpc/**'
      - 'tools/**'
      - 'services/provisioning/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/build-aio-enrollment.yml'
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Signing/release mode"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - stable
          - emergency
      apk_url:
        description: "Optional public APK URL used by provisioning QR (stable manual runs only)"
        required: false
        type: string
      enrollment_token:
        description: "Optional enrollment token embedded in admin extras"
        required: false
        type: string
      enrollment_endpoint:
        description: "HTTPS DPC-AIO Enrollment Engine v2 endpoint"
        required: false
        type: string
      enrollment_signing_public_key:
        description: "Base64 DER Ed25519 public key used by the DPC to verify bootstrap responses"
        required: false
        type: string
      policy_profile:
        description: "Policy profile placed in admin extras"
        required: false
        default: default
        type: string
      provisioning_mode:
        description: "Compatibility QR mode; dedicated Work Profile and Device Owner QRs are also generated"
        required: true
        default: work-profile
        type: choice
        options:
          - auto
          - work-profile
          - fully-managed
      allow_offline:
        description: "Allow Android offline provisioning when supported"
        required: false
        default: false
        type: boolean
      enrollment_offline_mode:
        description: "DPC route after Setup Wizard installs the APK"
        required: false
        default: ONLINE
        type: choice
        options:
          - ONLINE
          - ONLINE_PREFERRED
          - FULL_OFFLINE
          - OFFLINE_THEN_SYNC
      offline_bundle_id:
        description: "Signed local bundle/profile id for FULL_OFFLINE/OFFLINE_THEN_SYNC"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: enrollment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      release_tag: ${{ steps.mode.outputs.release_tag }}
      artifact_name: ${{ steps.mode.outputs.artifact_name }}
      should_publish: ${{ steps.mode.outputs.should_publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve pipeline mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.signing_mode || 'auto' }}"

          if [[ "$requested" == "auto" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              mode="stable"
            elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              mode="emergency"
            else
              mode="stable"
            fi
          else
            mode="$requested"
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$mode" != "stable" ]]; then
            echo "Tag builds must use stable signing." >&2
            exit 1
          fi

          if [[ "$mode" == "emergency" ]]; then
            release_tag="dpc-aio-emergency-enrollment"
            artifact_name="DPC-AIO-emergency-enrollment"
            should_publish="true"
          else
            artifact_name="DPC-AIO-enterpriseRelease-enrollment"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              release_tag="$GITHUB_REF_NAME"
              should_publish="true"
            else
              release_tag="dpc-aio-continuous"
              if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.apk_url }}" ]]; then
                should_publish="true"
              else
                should_publish="false"
              fi
            fi
          fi

          {
            echo "mode=$mode"
            echo "release_tag=$release_tag"
            echo "artifact_name=$artifact_name"
            echo "should_publish=$should_publish"
          } >> "$GITHUB_OUTPUT"

          {
            echo "DPC_AIO_PIPELINE_MODE=$mode"
            echo "DPC_AIO_RELEASE_TAG=$release_tag"
            echo "DPC_AIO_ARTIFACT_NAME=$artifact_name"
            echo "DPC_AIO_GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
            echo "DPC_AIO_SIGNING_ENV=$RUNNER_TEMP/dpc-aio-signing.env"
          } >> "$GITHUB_ENV"

          echo "Pipeline mode: $mode"
          echo "Release tag: $release_tag"
          echo "Publish: $should_publish"

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android 17 SDK + native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          SDK_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          "$SDKMANAGER" --list --channel=3 > "$SDK_LIST"

          has_package() {
            awk -F'|' -v wanted="$1" '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 == wanted { found=1 }
              END { exit(found ? 0 : 1) }
            ' "$SDK_LIST"
          }

          platform_pkg=""
          if has_package "platforms;android-37"; then
            platform_pkg="platforms;android-37"
          else
            platform_pkg="$(
              awk -F'|' '
                { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
                $1 ~ /^platforms;android-37\.[0-9]+$/ { print $1 }
              ' "$SDK_LIST" | sort -V | tail -n1
            )"
          fi
          if [[ -z "$platform_pkg" ]] && has_package "platforms;android-CinnamonBun"; then
            platform_pkg="platforms;android-CinnamonBun"
          fi
          if [[ -z "$platform_pkg" ]]; then
            echo "Android 17 platform not found." >&2
            grep -E 'platforms;android-(37|CinnamonBun)' "$SDK_LIST" || true
            exit 1
          fi

          build_tools_pkg="$(
            awk -F'|' '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 ~ /^build-tools;37\./ { print $1 }
            ' "$SDK_LIST" | sort -V | tail -n1
          )"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg="build-tools;36.0.0"

          "$SDKMANAGER" \
            "$platform_pkg" \
            "$build_tools_pkg" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            --channel=3

          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            installed_name="${platform_pkg#platforms;}"
            installed_path="$ANDROID_SDK_ROOT/platforms/$installed_name"
            [[ ! -d "$installed_path" ]] || ln -sfn "$installed_path" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Set up Python QR dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Resolve public APK URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DPC_AIO_PIPELINE_MODE" == "stable" && -n "${{ inputs.apk_url }}" ]]; then
            url='${{ inputs.apk_url }}'
          else
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DPC_AIO_RELEASE_TAG}/DPC-AIO-enterprise-release.apk"
          fi
          echo "DPC_AIO_PROVISIONING_APK_URL=$url" >> "$GITHUB_ENV"
          echo "Provisioning APK URL: $url"

      - name: Prepare stable signer
        if: env.DPC_AIO_PIPELINE_MODE == 'stable'
        env:
          KEYSTORE_B64: ${{ secrets.DPC_AIO_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DPC_AIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DPC_AIO_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 || secrets.DPC_AIO_EXPECTED_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT; do
            if [[ -z "${!name:-}" ]]; then
              echo "STABLE_SIGNING_KEY_REQUIRED: $name is not configured" >&2
              exit 1
            fi
          done

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          keystore="$RUNNER_TEMP/dpc-aio-enterprise-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"

          cat > "$DPC_AIO_SIGNING_ENV" <<EOF
          DPC_AIO_RELEASE_KEYSTORE_PATH='$keystore'
          DPC_AIO_RELEASE_STORE_PASSWORD='$STORE_PASSWORD'
          DPC_AIO_RELEASE_KEY_ALIAS='$KEY_ALIAS'
          DPC_AIO_RELEASE_KEY_PASSWORD='$KEY_PASSWORD'
          DPC_AIO_EXPECTED_SIGNING_CERT_SHA256='$EXPECTED_CERT'
          DPC_AIO_SIGNING_MODE='stable'
          EOF
          chmod 600 "$DPC_AIO_SIGNING_ENV"

      - name: Prepare emergency ephemeral signer
        if: env.DPC_AIO_PIPELINE_MODE == 'emergency'
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dpc-aio-emergency-release.p12"
          alias="dpc-aio-emergency-ci"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          umask 077

          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$alias" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 3650 \
            -dname "CN=DPC-AIO Emergency CI, OU=GitHub Actions, O=DPC-AIO, C=PL" \
            -noprompt

          fingerprint="$(keytool -list -v -keystore "$keystore" -storetype PKCS12 -storepass "$password" -alias "$alias" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$fingerprint"

          cat > "$DPC_AIO_SIGNING_ENV" <<EOF
          DPC_AIO_RELEASE_KEYSTORE_PATH='$keystore'
          DPC_AIO_RELEASE_STORE_PASSWORD='$password'
          DPC_AIO_RELEASE_KEY_ALIAS='$alias'
          DPC_AIO_RELEASE_KEY_PASSWORD='$password'
          DPC_AIO_EXPECTED_SIGNING_CERT_SHA256='$fingerprint'
          DPC_AIO_SIGNING_MODE='ephemeral'
          EOF
          chmod 600 "$DPC_AIO_SIGNING_ENV"

      - name: Verify Android build environment
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DPC_AIO_SIGNING_ENV"
          set -a
          source "$DPC_AIO_SIGNING_ENV"
          set +a
          mkdir -p dist
          python3 tools/android_build_preflight.py --require-signing --json-out dist/build-environment.json

      - name: Validate source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_gradle_source_completeness.py
          python3 tools/tests/test_app_android_classpath_114_contract.py
          python3 tools/tests/test_installer_android_compile_114_contract.py
          python3 tools/tests/test_build_output_paths_114_contract.py
          python3 tools/tests/test_apksigner_cert_parser_114_contract.py
          python3 tools/tests/test_app_dpc_compile_114_contract_v2.py
          python3 tools/tests/test_114_qr_release_bundle_contract.py
          python3 tools/tests/test_112_runtime_smoke_parser.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py

      - name: Build signed enterpriseRelease
        env:
          DPC_AIO_ENROLLMENT_TOKEN: ${{ inputs.enrollment_token }}
          DPC_AIO_ENROLLMENT_ENDPOINT: ${{ inputs.enrollment_endpoint || vars.DPC_AIO_ENROLLMENT_ENDPOINT }}
          DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY: ${{ inputs.enrollment_signing_public_key || vars.DPC_AIO_ENROLLMENT_SIGNING_PUBLIC_KEY }}
          DPC_AIO_POLICY_PROFILE: ${{ inputs.policy_profile || 'default' }}
          DPC_AIO_PROVISIONING_MODE: ${{ inputs.provisioning_mode || 'work-profile' }}
          DPC_AIO_ALLOW_OFFLINE: ${{ inputs.allow_offline || false }}
          DPC_AIO_ENROLLMENT_OFFLINE_MODE: ${{ inputs.enrollment_offline_mode || vars.DPC_AIO_ENROLLMENT_OFFLINE_MODE || 'ONLINE' }}
          DPC_AIO_OFFLINE_BUNDLE_ID: ${{ inputs.offline_bundle_id || vars.DPC_AIO_OFFLINE_BUNDLE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DPC_AIO_SIGNING_ENV"
          set -a
          source "$DPC_AIO_SIGNING_ENV"
          set +a
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app-dpc:assembleEnterpriseRelease

      - name: Verify signer and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "$DPC_AIO_SIGNING_ENV"
          set -a
          source "$DPC_AIO_SIGNING_ENV"
          set +a

          mkdir -p dist
          apk="$(find apps/dpc/app/build/outputs/apk/enterprise/release -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          apksigner_bin="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner_bin"

          cert_output="$("$apksigner_bin" verify --print-certs "$apk" 2>&1)"
          printf '%s\n' "$cert_output"
          observed="$(printf '%s\n' "$cert_output" | python3 tools/release/extract_apksigner_sha256.py)"
          expected="$(printf '%s' "$DPC_AIO_EXPECTED_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$observed" && "$observed" == "$expected" ]] || {
            echo "SIGNING_CERT_MISMATCH expected=$expected observed=$observed" >&2
            exit 1
          }

          cp "$apk" dist/DPC-AIO-enterprise-release.apk
          for file in \
            provisioning.json provisioning-payload.txt provisioning-metadata.json provisioning-qr.png \
            work-profile-provisioning.json work-profile-provisioning-payload.txt work-profile-provisioning-metadata.json work-profile-qr.png \
            device-owner-provisioning.json device-owner-provisioning-payload.txt device-owner-provisioning-metadata.json device-owner-qr.png
          do
            cp "apps/dpc/app/build/outputs/provisioning/enterprise/release/$file" dist/
          done

          printf '%s\n' "$DPC_AIO_SIGNING_MODE" > dist/signing-mode.txt
          printf '%s\n' "$observed" > dist/signing-cert-sha256.txt
          sha256sum dist/DPC-AIO-enterprise-release.apk > dist/DPC-AIO-enterprise-release.apk.sha256

      - name: Validate QR to exact APK binding
        shell: bash
        run: |
          set -euo pipefail
          compat_mode="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["provisioningMode"])' dist/provisioning-metadata.json)"
          python3 tools/provisioning/verify_provisioning_qr.py --json dist/provisioning.json --qr dist/provisioning-qr.png --apk dist/DPC-AIO-enterprise-release.apk --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode "$compat_mode" > dist/provisioning-validation.json
          python3 tools/provisioning/verify_provisioning_qr.py --json dist/work-profile-provisioning.json --qr dist/work-profile-qr.png --apk dist/DPC-AIO-enterprise-release.apk --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode work-profile > dist/work-profile-validation.json
          python3 tools/provisioning/verify_provisioning_qr.py --json dist/device-owner-provisioning.json --qr dist/device-owner-qr.png --apk dist/DPC-AIO-enterprise-release.apk --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode fully-managed > dist/device-owner-validation.json

      - name: Cleanup signing material before emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$DPC_AIO_SIGNING_ENV" ]]; then
            signing_keystore="$(sed -n "s/^DPC_AIO_RELEASE_KEYSTORE_PATH='\(.*\)'$/\1/p" "$DPC_AIO_SIGNING_ENV" | head -n1)"
            rm -f "${signing_keystore:-}"
          fi
          rm -f "$DPC_AIO_SIGNING_ENV"
          test ! -e "$DPC_AIO_SIGNING_ENV"

      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AOSP Device Owner runtime smoke
        id: runtime_smoke_primary
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: true
          disable-animations: true
          script: >-
            python3 tools/runtime/android_device_owner_smoke.py
            --apk dist/DPC-AIO-enterprise-release.apk
            --out dist/android-runtime-smoke.json
            --expected-version 1.1.4

      - name: Classify runtime smoke failure
        if: steps.runtime_smoke_primary.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/android-runtime-smoke.json
          cp dist/android-runtime-smoke.json dist/android-runtime-smoke-attempt1.json
          python3 tools/runtime/runtime_smoke_retry_gate.py --report dist/android-runtime-smoke.json
          echo "DPC_AIO_RUNTIME_RETRY=1" >> "$GITHUB_ENV"

      - name: AOSP Device Owner runtime smoke retry
        if: env.DPC_AIO_RUNTIME_RETRY == '1'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: true
          disable-animations: true
          script: >-
            python3 tools/runtime/android_device_owner_smoke.py
            --apk dist/DPC-AIO-enterprise-release.apk
            --out dist/android-runtime-smoke.json
            --expected-version 1.1.4

      - name: Build QR release bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/build_qr_release_bundle.py --dist dist --version 1.1.4 --apk-url "$DPC_AIO_PROVISIONING_APK_URL"
          test -f dist/DPC-AIO-1.1.4-QR-RELEASE-BUNDLE.zip
          test -f dist/DPC-AIO-1.1.4-QR-RELEASE-BUNDLE.zip.sha256
          test -f dist/QR-README.md
          test -f dist/RELEASE-INDEX.json
          test -f dist/SHA256SUMS.txt

      - name: Upload verified enrollment artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.DPC_AIO_ARTIFACT_NAME }}
          path: dist/

      - name: Cleanup signing material fallback
        if: always()
        shell: bash
        run: |
          rm -f "$DPC_AIO_SIGNING_ENV" || true
          rm -f "$RUNNER_TEMP/dpc-aio-enterprise-release.jks" "$RUNNER_TEMP/dpc-aio-emergency-release.p12" || true

  publish:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.build.outputs.mode }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$MODE" == "emergency" ]]; then
            title="DPC-AIO Emergency Enrollment"
            notes="Run-specific emergency DPC-AIO 1.1.4 enrollment build from commit $GITHUB_SHA. APK and QRs are verified against each other. The signer is ephemeral, so independent runs cannot update each other in place."
            prerelease="--prerelease"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            title="$RELEASE_TAG"
            notes="DPC-AIO verified stable-signing release from commit $GITHUB_SHA. Includes Work Profile, Device Owner and compatibility QR assets plus DPC-AIO-1.1.4-QR-RELEASE-BUNDLE.zip."
            prerelease=""
          else
            title="DPC-AIO Continuous Enrollment"
            notes="Update-stable DPC-AIO 1.1.4 enrollment artifacts from commit $GITHUB_SHA. APK and QRs are verified against each other and signed by the configured stable release key."
            prerelease="--prerelease"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $prerelease
          fi

          gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify published APK byte identity
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum dist/DPC-AIO-enterprise-release.apk | awk '{print $1}')"
          matched="0"

          for attempt in $(seq 1 12); do
            cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/DPC-AIO-enterprise-release.apk?cb=${cache_bust}"
            if curl -fL --retry 2 --retry-delay 3 "$url" -o public.apk; then
              observed="$(sha256sum public.apk | awk '{print $1}')"
              if cmp -s dist/DPC-AIO-enterprise-release.apk public.apk && [[ "$observed" == "$expected" ]]; then
                matched="1"
                break
              fi
              echo "Attempt $attempt: public APK hash $observed, waiting for release asset propagation..."
            fi
            sleep 10
          done

          [[ "$matched" == "1" ]] || {
            echo "PUBLISHED_APK_PUBLIC_VERIFY_FAILED" >&2
            exit 1
          }
          echo "Published APK is public and byte-identical to the QR-bound build."
