name: Temporary Activity Launcher future-date RED contract

on:
  push:
    branches:
      - fix/activity-launcher-future-date-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/activity-launcher-future-date-consistency
          fetch-depth: 1
      - name: Patch focused RED contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/tests/test_activity_launcher_app_manager_contract.py')
          s = p.read_text()
          old = """    'private fun isTimestampWithinAge(timestamp: Long, now: Long, maxAgeMs: Long): Boolean',\n    'timestamp > 0L && timestamp <= now && now - timestamp <= maxAgeMs',\n"""
          new = """    'private fun isValidTimestamp(timestamp: Long, now: Long): Boolean',\n    'timestamp > 0L && timestamp <= now',\n    'private fun isTimestampWithinAge(timestamp: Long, now: Long, maxAgeMs: Long): Boolean',\n    'isValidTimestamp(timestamp, now) && now - timestamp <= maxAgeMs',\n"""
          if s.count(old) != 1:
              raise SystemExit(f'Expected one age helper contract anchor, got {s.count(old)}')
          s = s.replace(old, new, 1)
          old_sort = """    'val (valid, unknown) = apps.partition { timestamp(it) > 0L }',\n    'val sortedValid = valid.sortedBy(timestamp)',\n"""
          new_sort = """    'val now = System.currentTimeMillis()',\n    'val (valid, unknown) = apps.partition { isValidTimestamp(timestamp(it), now) }',\n    'val sortedValid = valid.sortedBy(timestamp)',\n"""
          if s.count(old_sort) != 1:
              raise SystemExit(f'Expected one sort contract anchor, got {s.count(old_sort)}')
          s = s.replace(old_sort, new_sort, 1)
          format_anchor = """    'formatInstallDate(app.firstInstallTime)',\n    'formatInstallDate(app.lastUpdateTime)',\n"""
          format_new = """    'formatInstallDate(app.firstInstallTime)',\n    'formatInstallDate(app.lastUpdateTime)',\n    'if (!isValidTimestamp(time, now)) return \"unknown\"',\n"""
          if s.count(format_anchor) != 1:
              raise SystemExit(f'Expected one format contract anchor, got {s.count(format_anchor)}')
          s = s.replace(format_anchor, format_new, 1)
          stale_anchor = """    'return if (currentSortDirection == SortDirection.DESCENDING) sorted.reversed() else sorted',\n"""
          stale_new = """    'return if (currentSortDirection == SortDirection.DESCENDING) sorted.reversed() else sorted',\n    'apps.partition { timestamp(it) > 0L }',\n    'if (time <= 0L) return \"unknown\"',\n"""
          if s.count(stale_anchor) != 1:
              raise SystemExit(f'Expected one stale list anchor, got {s.count(stale_anchor)}')
          s = s.replace(stale_anchor, stale_new, 1)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "tools/tests/test_activity_launcher_app_manager_contract.py"
      - name: Commit RED contract only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/tests/test_activity_launcher_app_manager_contract.py
          git commit -m "test: require consistent future timestamp handling"
          git push origin HEAD:fix/activity-launcher-future-date-consistency
