name: Verify user lifecycle parity compile

on:
  push:
    branches:
      - feat/dpc-aio-130-user-lifecycle-parity

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if ! "$SDKMANAGER" "platforms;android-37"; then
            "$SDKMANAGER" "platforms;android-CinnamonBun"
          fi
          "$SDKMANAGER" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Focused parity gates
        run: |
          python3 tools/tests/test_132_user_lifecycle_parity_contract.py
          python3 tools/tests/test_124_parity_handler_coverage.py
          python3 tools/tests/test_123_testdpc_parity_catalog_169.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
      - name: Compile enterprise app
        run: ./gradlew --no-daemon :app-dpc:compileEnterpriseReleaseKotlin
