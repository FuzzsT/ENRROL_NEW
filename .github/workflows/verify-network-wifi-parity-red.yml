name: Verify RED Task 8 network Wi-Fi parity

on:
  push:
    branches:
      - feat/dpc-aio-130-network-wifi-parity
    paths:
      - tools/tests/test_131_network_wifi_parity_contract.py
      - .github/workflows/verify-network-wifi-parity-red.yml

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require Task 8 contract failure before implementation
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/tests/test_131_network_wifi_parity_contract.py; then
            echo 'Task 8 contract unexpectedly passed before implementation' >&2
            exit 1
          fi
          echo 'TASK_8_RED_CONFIRMED'
