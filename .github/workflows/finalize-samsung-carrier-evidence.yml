name: Finalize Samsung carrier evidence

on:
  push:
    branches:
      - feat/dpc-aio-samsung-carrier-evidence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision host test dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt
      - name: Wire canonical host runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/run_host_tests.sh')
          text = path.read_text('utf-8')
          anchor = 'python3 "$ROOT/tools/tests/test_133_samsung_firmware_diagnostics_contract.py"\n'
          addition = 'python3 "$ROOT/tools/tests/test_134_samsung_carrier_evidence_contract.py"\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('RUNNER_ANCHOR_NOT_FOUND')
              text = text.replace(anchor, anchor + addition, 1)
              path.write_text(text, 'utf-8')
          PY
      - name: Focused Samsung evidence gates
        run: |
          python3 tools/tests/test_133_samsung_firmware_diagnostics_contract.py
          python3 tools/tests/test_134_samsung_carrier_evidence_contract.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
      - name: Canonical host suite
        run: |
          rm -f .github/workflows/verify-samsung-carrier-evidence-red.yml
          rm -f .github/workflows/verify-samsung-carrier-evidence-compile.yml
          rm -f .github/workflows/finalize-samsung-carrier-evidence.yml
          ./tools/run_host_tests.sh
      - name: Compile Samsung module
        run: ./gradlew --no-daemon :samsung-settings-android:compileReleaseKotlin
      - name: Compile enterprise app
        run: ./gradlew --no-daemon :app-dpc:compileEnterpriseReleaseKotlin
      - name: Persist canonical runner wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run_host_tests.sh
          if git diff --cached --quiet; then
            echo "Runner already wired"
          else
            git commit -m "test: wire Samsung carrier evidence contract"
            git push origin HEAD:feat/dpc-aio-samsung-carrier-evidence
          fi
