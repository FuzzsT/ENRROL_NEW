name: Finalize TestDPC parity router

on:
  push:
    branches:
      - feat/dpc-aio-130-parity-router
    paths:
      - .github/workflows/finalize-parity-router.yml
      - apps/dpc/modules/policy/core/src/test/kotlin/io/dpcaio/policy/parity/TestDpcParityCatalogTest.kt
      - apps/dpc/modules/policy/core/src/test/kotlin/io/dpcaio/policy/parity/TestDpcCapabilityResolverTest.kt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Wire parity tests into canonical host runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/run_host_tests.sh')
          text = path.read_text('utf-8')

          capability = '  io.dpcaio.policy.CredentialRecoveryTestKt\n'
          parity_mains = (
              '  io.dpcaio.policy.parity.TestDpcParityCatalogTest\n'
              '  io.dpcaio.policy.parity.TestDpcCapabilityResolverTest\n'
          )
          if 'io.dpcaio.policy.parity.TestDpcParityCatalogTest' not in text:
              assert text.count(capability) == 1, 'unexpected Kotlin main insertion point'
              text = text.replace(capability, capability + parity_mains, 1)

          test123 = 'python3 "$ROOT/tools/tests/test_123_testdpc_parity_catalog_169.py"\n'
          parity_py = (
              'python3 "$ROOT/tools/tests/test_124_parity_handler_coverage.py"\n'
              'python3 "$ROOT/tools/tests/test_125_parity_ui_contract.py"\n'
          )
          if 'test_124_parity_handler_coverage.py' not in text:
              assert text.count(test123) == 1, 'unexpected Python test insertion point'
              text = text.replace(test123, test123 + parity_py, 1)

          path.write_text(text, 'utf-8')
          PY

      - name: Verify canonical parity wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'io.dpcaio.policy.parity.TestDpcParityCatalogTest' tools/run_host_tests.sh
          grep -q 'io.dpcaio.policy.parity.TestDpcCapabilityResolverTest' tools/run_host_tests.sh
          grep -q 'test_124_parity_handler_coverage.py' tools/run_host_tests.sh
          grep -q 'test_125_parity_ui_contract.py' tools/run_host_tests.sh
          python3 tools/tests/test_123_testdpc_parity_catalog_169.py
          python3 tools/tests/test_124_parity_handler_coverage.py
          python3 tools/tests/test_125_parity_ui_contract.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
          python3 - <<'PY'
          from pathlib import Path
          src = Path('tools/run_host_tests.sh').read_text('utf-8').splitlines()
          cutoff = next(i for i, line in enumerate(src) if line.startswith('python3 "$ROOT/tools/tests/test_project_layout.py"'))
          Path('tools/.parity-core-host.sh').write_text('\n'.join(src[:cutoff]) + '\n', 'utf-8')
          PY
          bash tools/.parity-core-host.sh
          rm tools/.parity-core-host.sh
          git diff --check

      - name: Remove validation-only workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/verify-parity-router-red.yml \
            .github/workflows/verify-parity-router.yml \
            .github/workflows/finalize-parity-router.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2
          test -f .github/workflows/build-aio-enrollment.yml
          test -f .github/workflows/build-emergency-enrollment.yml
          git diff --check

      - name: Commit finalized Task 5 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: wire parity router into canonical host suite'
          git push origin HEAD:feat/dpc-aio-130-parity-router
