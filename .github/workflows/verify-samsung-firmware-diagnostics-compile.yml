name: Verify Samsung firmware diagnostics full build

on:
  push:
    branches:
      - feat/dpc-aio-130-samsung-firmware-diagnostics
    paths:
      - .github/workflows/verify-samsung-firmware-diagnostics-compile.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          list="$RUNNER_TEMP/android-sdk-packages.txt"
          "$sdkmanager_bin" --list --channel=3 > "$list"
          platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$list" | head -n1)"
          if [[ -z "$platform_pkg" ]]; then
            platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^platforms;android-37\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          fi
          if [[ -z "$platform_pkg" ]] && grep -q 'platforms;android-CinnamonBun' "$list"; then
            platform_pkg='platforms;android-CinnamonBun'
          fi
          [[ -n "$platform_pkg" ]] || { echo 'Android 17 platform not found' >&2; exit 1; }
          "$sdkmanager_bin" "$platform_pkg" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then
            installed="$ANDROID_SDK_ROOT/platforms/${platform_pkg#platforms;}"
            [[ -d "$installed" ]] && ln -sfn "$installed" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Install repository host-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r tools/provisioning/requirements.txt

      - name: Run focused Samsung diagnostics gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_diagnostics_contract.py
          python3 tools/tests/test_133_samsung_firmware_diagnostics_contract.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
          git diff --check

      - name: Run canonical full host suite
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-samsung-firmware-diagnostics-compile.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2
          test -f .github/workflows/build-aio-enrollment.yml
          test -f .github/workflows/build-emergency-enrollment.yml
          chmod +x tools/run_host_tests.sh
          bash tools/run_host_tests.sh

      - name: Compile Samsung diagnostics Android surfaces
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :samsung-settings-android:compileReleaseKotlin :app-dpc:compileEnterpriseReleaseKotlin --console=plain --stacktrace

      - name: Verify working-tree topology
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/verify-samsung-firmware-diagnostics-compile.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2
          git diff --check
