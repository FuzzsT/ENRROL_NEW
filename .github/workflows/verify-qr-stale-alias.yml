name: Verify QR stale alias regression

on:
  push:
    branches:
      - fix/dpc-aio-130-hygiene-gates
    paths:
      - .github/workflows/verify-qr-stale-alias.yml
      - tools/tests/test_129_qr_stale_alias_cleanup.py
      - apps/dpc/app/build.gradle.kts
      - tools/run_host_tests.sh

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          list="$RUNNER_TEMP/android-sdk-packages.txt"
          "$sdkmanager_bin" --list --channel=3 > "$list"

          platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$list" | head -n1)"
          if [[ -z "$platform_pkg" ]]; then
            platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^platforms;android-37\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          fi
          if [[ -z "$platform_pkg" ]] && grep -q 'platforms;android-CinnamonBun' "$list"; then
            platform_pkg='platforms;android-CinnamonBun'
          fi
          [[ -n "$platform_pkg" ]] || { echo 'Android 17 platform not found' >&2; exit 1; }

          build_tools_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^build-tools;37\.[0-9]+\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg='build-tools;36.0.0'

          "$sdkmanager_bin" "$platform_pkg" "$build_tools_pkg" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then
            installed="$ANDROID_SDK_ROOT/platforms/${platform_pkg#platforms;}"
            [[ -d "$installed" ]] && ln -sfn "$installed" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 -m pip install --quiet -r tools/provisioning/requirements.txt

      - name: Apply reviewed stale-alias fix in working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle_path = Path('apps/dpc/app/build.gradle.kts')
          gradle = gradle_path.read_text(encoding='utf-8')
          marker = 'if ("fully-managed" !in selectedQrModes) {'
          start = gradle.index(marker)
          end = gradle.index('val compatibilityMode', start)
          cleanup = gradle[start:end]
          if '"fully-managed-qr.png"' not in cleanup:
              old = '''                        "device-owner-provisioning-metadata.json",
                        "device-owner-qr.png",
'''
              new = '''                        "device-owner-provisioning-metadata.json",
                        "device-owner-qr.png",
                        "fully-managed-qr.png",
'''
              assert gradle.count(old) == 1, 'unexpected fully-managed cleanup shape'
              gradle = gradle.replace(old, new, 1)
              gradle_path.write_text(gradle, encoding='utf-8')

          runner_path = Path('tools/run_host_tests.sh')
          runner = runner_path.read_text(encoding='utf-8')
          line128 = 'python3 "$ROOT/tools/tests/test_128_android_runtime_smoke_hardening.py"'
          line129 = 'python3 "$ROOT/tools/tests/test_129_qr_stale_alias_cleanup.py"'
          if line129 not in runner:
              assert runner.count(line128) == 1, 'unexpected canonical runner shape'
              runner = runner.replace(line128, line128 + '\n' + line129, 1)
              runner_path.write_text(runner, encoding='utf-8')
          PY
          git diff --check

      - name: Hide validation-only workflow from contract tests
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/verify-qr-stale-alias.yml "$RUNNER_TEMP/verify-qr-stale-alias.yml"
          rm .github/workflows/verify-qr-stale-alias.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2

      - name: Verify focused QR contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_129_qr_stale_alias_cleanup.py
          python3 tools/tests/test_122_workflow_qr_choice_contract.py
          python3 tools/tests/test_122_qr_mode_matrix.py
          python3 tools/tests/test_102_qr_production_readiness_contract.py
          python3 tools/tests/test_dual_provisioning_qr.py

      - name: Run canonical non-Kotlin host suite
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$PWD"
          sed -n '109,$p' tools/run_host_tests.sh | bash -euo pipefail

      - name: Restore validation workflow in working tree
        if: success()
        shell: bash
        run: mv "$RUNNER_TEMP/verify-qr-stale-alias.yml" .github/workflows/verify-qr-stale-alias.yml

      - name: Build enterprise debug APK
        shell: bash
        env:
          DPC_AIO_GITHUB_REPOSITORY: FuzzsT/ENRROL_NEW
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app-dpc:assembleEnterpriseDebug --console=plain --stacktrace

      - name: Verify fully-managed to work-profile cleanup on reused output
        shell: bash
        env:
          DPC_AIO_GITHUB_REPOSITORY: FuzzsT/ENRROL_NEW
        run: |
          set -euo pipefail
          out_dir='apps/dpc/app/build/outputs/provisioning/enterprise/debug'
          rm -rf "$out_dir"

          DPC_AIO_QR_TYPE=fully-managed ./gradlew --no-daemon :app-dpc:generateEnterpriseDebugProvisioningQr --rerun-tasks --console=plain
          test -f "$out_dir/fully-managed-qr.png"
          test -f "$out_dir/device-owner-qr.png"

          DPC_AIO_QR_TYPE=work-profile ./gradlew --no-daemon :app-dpc:generateEnterpriseDebugProvisioningQr --rerun-tasks --console=plain
          test -f "$out_dir/work-profile-qr.png"
          test ! -e "$out_dir/fully-managed-qr.png"
          test ! -e "$out_dir/device-owner-qr.png"
          echo 'QR_MODE_SWITCH_CLEANUP: PASS'

      - name: Commit verified source fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'apps/dpc/app/build.gradle.kts'
            'tools/run_host_tests.sh'
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected working-tree changes: %s\n' "${changed[*]}" >&2
            exit 1
          fi
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo 'No source fix to commit; committed head already contains the verified change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/dpc/app/build.gradle.kts tools/run_host_tests.sh
          git commit -m 'fix: clean stale fully-managed QR alias [skip ci]'
          git push origin HEAD:fix/dpc-aio-130-hygiene-gates
