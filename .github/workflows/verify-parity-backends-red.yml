name: Verify RED parity backend contract

on:
  push:
    branches:
      - feat/dpc-aio-130-parity-backend-bindings
    paths:
      - tools/tests/test_124_parity_handler_coverage.py
      - .github/workflows/verify-parity-backends-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require Task 6 contract failure before implementation
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/tests/test_124_parity_handler_coverage.py; then
            echo 'Task 6 contract unexpectedly passed before backend bindings were implemented' >&2
            exit 1
          fi
          echo 'RED confirmed: Task 6 backend binding contract fails before implementation.'
