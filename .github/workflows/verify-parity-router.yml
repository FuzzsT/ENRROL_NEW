name: Verify TestDPC parity action router

on:
  push:
    branches:
      - feat/dpc-aio-130-parity-router
    paths:
      - .github/workflows/verify-parity-router.yml
      - apps/dpc/modules/policy/core/src/main/kotlin/io/dpcaio/policy/parity/ParityActionContracts.kt
      - apps/dpc/app/src/main/kotlin/io/dpcaio/app/TestDpcParityActionRouter.kt
      - apps/dpc/app/src/main/kotlin/io/dpcaio/app/TestDpcParityDetailActivity.kt
      - tools/tests/test_124_parity_handler_coverage.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          list="$RUNNER_TEMP/android-sdk-packages.txt"
          "$sdkmanager_bin" --list --channel=3 > "$list"
          platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$list" | head -n1)"
          if [[ -z "$platform_pkg" ]]; then
            platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^platforms;android-37\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          fi
          if [[ -z "$platform_pkg" ]] && grep -q 'platforms;android-CinnamonBun' "$list"; then
            platform_pkg='platforms;android-CinnamonBun'
          fi
          [[ -n "$platform_pkg" ]] || { echo 'Android 17 platform not found' >&2; exit 1; }
          "$sdkmanager_bin" "$platform_pkg" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then
            installed="$ANDROID_SDK_ROOT/platforms/${platform_pkg#platforms;}"
            [[ -d "$installed" ]] && ln -sfn "$installed" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Run routing contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_124_parity_handler_coverage.py
          python3 tools/tests/test_125_parity_ui_contract.py
          python3 tools/tests/test_123_testdpc_parity_catalog_169.py
          python3 tools/tests/test_116_safe_insets_ui_contract.py
          python3 tools/tests/test_121_responsive_ui_contract.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py
          git diff --check

      - name: Compile parity core and enterprise release Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :policy-core:compileKotlin :app-dpc:compileEnterpriseReleaseKotlin --console=plain --stacktrace
