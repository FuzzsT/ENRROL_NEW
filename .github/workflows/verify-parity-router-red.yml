name: Verify RED parity router contract

on:
  push:
    branches:
      - feat/dpc-aio-130-parity-router
    paths:
      - .github/workflows/verify-parity-router-red.yml
      - tools/tests/test_124_parity_handler_coverage.py

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Require contract failure before implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(python3 tools/tests/test_124_parity_handler_coverage.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ $status -eq 0 ]]; then
            echo 'EXPECTED_RED_BUT_TEST_PASSED' >&2
            exit 1
          fi
          grep -Eq 'ParityActionContracts.kt missing|TestDpcParityActionRouter.kt missing' <<<"$output"
          echo 'PARITY_ROUTER_RED: PASS'
