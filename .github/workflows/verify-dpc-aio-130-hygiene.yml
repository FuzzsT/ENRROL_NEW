name: Verify DPC-AIO 1.3.0 hygiene gates

on:
  push:
    branches:
      - fix/dpc-aio-130-hygiene-gates
    paths:
      - .github/workflows/verify-dpc-aio-130-hygiene.yml
      - apps/dpc/app/build.gradle.kts
      - tools/run_host_tests.sh
      - tools/verify-aio
      - tools/bundle-tool
      - tools/tests/test_127_tooling_hygiene_contract.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Remove validation-only workflow from working tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-dpc-aio-130-hygiene.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android 17 SDK + stable verifier
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(command -v sdkmanager)"
          list="$RUNNER_TEMP/android-sdk-packages.txt"
          "$sdkmanager_bin" --list --channel=3 > "$list"

          platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1=="platforms;android-37"{print $1}' "$list" | head -n1)"
          if [[ -z "$platform_pkg" ]]; then
            platform_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^platforms;android-37\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          fi
          if [[ -z "$platform_pkg" ]] && grep -q 'platforms;android-CinnamonBun' "$list"; then
            platform_pkg='platforms;android-CinnamonBun'
          fi
          [[ -n "$platform_pkg" ]] || { echo 'Android 17 platform not found' >&2; exit 1; }

          build_tools_pkg="$(awk -F'|' '{gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1)} $1 ~ /^build-tools;37\.[0-9]+\.[0-9]+$/{print $1}' "$list" | sort -V | tail -n1)"
          [[ -n "$build_tools_pkg" ]] || build_tools_pkg='build-tools;36.0.0'

          echo "Selected platform: $platform_pkg"
          echo "Selected build tools: $build_tools_pkg"
          "$sdkmanager_bin" "$platform_pkg" "$build_tools_pkg" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3

          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar" ]]; then
            installed="$ANDROID_SDK_ROOT/platforms/${platform_pkg#platforms;}"
            [[ -d "$installed" ]] && ln -sfn "$installed" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 -m pip install --quiet -r tools/provisioning/requirements.txt

      - name: Verify focused hygiene and QR contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_126_android_parity_runtime_facts_contract.py
          python3 tools/tests/test_127_tooling_hygiene_contract.py
          python3 tools/tests/test_101_offline_bundle_cli.py
          python3 tools/tests/test_122_workflow_qr_choice_contract.py
          python3 tools/tests/test_122_qr_mode_matrix.py
          python3 tools/tests/test_102_qr_production_readiness_contract.py
          python3 tools/tests/test_dual_provisioning_qr.py
          python3 tools/tests/test_release_secret_scan.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 - <<'PY'
          import yaml
          for path in (
              '.github/workflows/build-aio-enrollment.yml',
              '.github/workflows/build-emergency-enrollment.yml',
          ):
              with open(path, encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          print('WORKFLOW_YAML_PARSE: PASS')
          PY

      - name: Run canonical non-Kotlin host suite
        shell: bash
        run: |
          set -euo pipefail
          export ROOT="$PWD"
          sed -n '109,$p' tools/run_host_tests.sh | bash -euo pipefail

      - name: Compile parity runtime and enterprise app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :policy-android:compileDebugKotlin :app-dpc:compileEnterpriseReleaseKotlin --console=plain --stacktrace
