name: Verify dense provisioning QR regression
on:
  push:
    branches:
      - fix/qr-dense-quiet-zone
    paths:
      - .github/workflows/tdd-dense-qr-regression.yml
      - tools/provisioning/generate_provisioning.py
      - tools/provisioning/verify_provisioning_qr.py
      - tools/provisioning/requirements.txt
      - tools/tests/test_127_dense_provisioning_qr_contract.py
      - tools/tests/test_dual_provisioning_qr.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install provisioning test dependencies
        run: python -m pip install -r tools/provisioning/requirements.txt
      - name: Run dense QR regression
        run: |
          python tools/tests/test_127_dense_provisioning_qr_contract.py
          python tools/tests/test_dual_provisioning_qr.py
