name: Emergency enrollment (ephemeral signing)

on:
  workflow_dispatch:
    inputs:
      qr_type:
        description: "Typ QR provisioning"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - work-profile
          - fully-managed

permissions:
  contents: read

concurrency:
  group: ${{ vars.DPC_AIO_EMERGENCY_CONCURRENCY_GROUP || 'dpc-aio-emergency-enrollment' }}
  cancel-in-progress: true

env:
  DPC_AIO_EMERGENCY_RELEASE_TAG: ${{ vars.DPC_AIO_EMERGENCY_RELEASE_TAG || 'dpc-aio-emergency-enrollment' }}
  DPC_AIO_EMERGENCY_ARTIFACT_NAME: DPC-AIO-emergency-enrollment-${{ github.run_id }}-${{ github.run_attempt }}
  DPC_AIO_RELEASE_APK_NAME: ${{ vars.DPC_AIO_RELEASE_APK_NAME || 'DPC-AIO-enterprise-release.apk' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}
      qr_bundle_name: ${{ steps.metadata.outputs.qr_bundle_name }}
      release_apk_name: ${{ steps.config.outputs.release_apk_name }}
      emergency_release_tag: ${{ steps.config.outputs.emergency_release_tag }}
    env:
      DPC_AIO_GITHUB_REPOSITORY: ${{ github.repository }}
      DPC_AIO_CFG_RELEASE_APK_NAME: ${{ vars.DPC_AIO_RELEASE_APK_NAME }}
      DPC_AIO_CFG_EMERGENCY_RELEASE_TAG: ${{ vars.DPC_AIO_EMERGENCY_RELEASE_TAG }}
      DPC_AIO_CFG_POLICY_PROFILE: ${{ vars.DPC_AIO_POLICY_PROFILE }}
      DPC_AIO_CFG_PROVISIONING_MODE: ${{ vars.DPC_AIO_PROVISIONING_MODE }}
      DPC_AIO_CFG_ALLOW_OFFLINE: ${{ vars.DPC_AIO_ALLOW_OFFLINE }}
      DPC_AIO_CFG_ENROLLMENT_OFFLINE_MODE: ${{ vars.DPC_AIO_ENROLLMENT_OFFLINE_MODE }}
      DPC_AIO_CFG_OFFLINE_BUNDLE_ID: ${{ vars.DPC_AIO_OFFLINE_BUNDLE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve QR selection
        shell: bash
        env:
          DISPATCH_QR_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.qr_type || '' }}
        run: |
          set -euo pipefail
          qr_type="${DISPATCH_QR_TYPE:-both}"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            qr_type="both"
          fi
          case "$qr_type" in
            both|work-profile|fully-managed) ;;
            *) echo "Unsupported qr_type: $qr_type" >&2; exit 2 ;;
          esac
          echo "DPC_AIO_QR_TYPE=$qr_type" >> "$GITHUB_ENV"
          echo "QR selection: $qr_type"

      - name: Resolve project release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PYMETA'
          import pathlib, re
          text = pathlib.Path('apps/dpc/app/build.gradle.kts').read_text(encoding='utf-8')
          match = re.search(r'versionName\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit('VERSION_NAME_NOT_FOUND')
          print(match.group(1))
          PYMETA
          )"
          bundle_name="DPC-AIO-${version}-QR-RELEASE-BUNDLE.zip"
          {
            echo "DPC_AIO_APP_VERSION=$version"
            echo "DPC_AIO_QR_BUNDLE_NAME=$bundle_name"
          } >> "$GITHUB_ENV"
          {
            echo "app_version=$version"
            echo "qr_bundle_name=$bundle_name"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $version"

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK base tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android 17 SDK + stable APK signer
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          SDK_LIST="$RUNNER_TEMP/android-sdk-packages.txt"
          "$SDKMANAGER" --list --channel=3 > "$SDK_LIST"

          has_package() {
            awk -F'|' -v wanted="$1" '
              { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
              $1 == wanted { found=1 }
              END { exit(found ? 0 : 1) }
            ' "$SDK_LIST"
          }

          platform_pkg=""
          if has_package "platforms;android-37"; then
            platform_pkg="platforms;android-37"
          else
            platform_pkg="$(
              awk -F'|' '
                { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1) }
                $1 ~ /^platforms;android-37\.[0-9]+$/ { print $1 }
              ' "$SDK_LIST" | sort -V | tail -n1
            )"
          fi
          if [[ -z "$platform_pkg" ]] && has_package "platforms;android-CinnamonBun"; then
            platform_pkg="platforms;android-CinnamonBun"
          fi
          if [[ -z "$platform_pkg" ]]; then
            echo "Android 17 platform not found." >&2
            grep -E 'platforms;android-(37|CinnamonBun)' "$SDK_LIST" || true
            exit 1
          fi

          "$SDKMANAGER" \
            "$platform_pkg" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            --channel=3

          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]]; then
            installed_name="${platform_pkg#platforms;}"
            installed_path="$ANDROID_SDK_ROOT/platforms/$installed_name"
            [[ ! -d "$installed_path" ]] || ln -sfn "$installed_path" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Set up Python QR dependencies
        run: python3 -m pip install -r tools/provisioning/requirements.txt

      - name: Resolve automatic emergency configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          defaults_file='.github/dpc-aio-defaults.env'
          if [[ -f "$defaults_file" ]]; then
            set -a
            # shellcheck disable=SC1090
            source "$defaults_file"
            set +a
          fi
          pick() {
            local configured="$1" fallback="$2" builtin="$3"
            if [[ -n "$configured" ]]; then printf '%s' "$configured"
            elif [[ -n "$fallback" ]]; then printf '%s' "$fallback"
            else printf '%s' "$builtin"; fi
          }
          bool() { case "${1,,}" in 1|true|yes|on) echo true;; *) echo false;; esac; }

          release_apk="$(pick "${DPC_AIO_CFG_RELEASE_APK_NAME:-}" "${DPC_AIO_DEFAULT_RELEASE_APK_NAME:-}" 'DPC-AIO-enterprise-release.apk')"
          [[ "$release_apk" =~ ^[A-Za-z0-9._-]+\.apk$ ]] || release_apk='DPC-AIO-enterprise-release.apk'
          release_tag="$(pick "${DPC_AIO_CFG_EMERGENCY_RELEASE_TAG:-}" "${DPC_AIO_DEFAULT_EMERGENCY_RELEASE_TAG:-}" 'dpc-aio-emergency-enrollment')"
          [[ "$release_tag" =~ ^[A-Za-z0-9._-]+$ ]] || release_tag='dpc-aio-emergency-enrollment'
          profile="$(pick "${DPC_AIO_CFG_POLICY_PROFILE:-}" "${DPC_AIO_DEFAULT_POLICY_PROFILE:-}" 'default')"
          mode="$(pick "${DPC_AIO_CFG_PROVISIONING_MODE:-}" "${DPC_AIO_DEFAULT_PROVISIONING_MODE:-}" 'work-profile')"
          case "$mode" in auto|work-profile|fully-managed) ;; *) mode=work-profile;; esac
          allow="$(bool "$(pick "${DPC_AIO_CFG_ALLOW_OFFLINE:-}" "${DPC_AIO_DEFAULT_ALLOW_OFFLINE:-}" 'false')")"
          offline="$(pick "${DPC_AIO_CFG_ENROLLMENT_OFFLINE_MODE:-}" "${DPC_AIO_DEFAULT_ENROLLMENT_OFFLINE_MODE:-}" 'ONLINE')"
          offline="${offline^^}"; offline="${offline//-/_}"
          case "$offline" in ONLINE|ONLINE_PREFERRED|FULL_OFFLINE|OFFLINE_THEN_SYNC) ;; *) offline=ONLINE;; esac
          bundle="$(pick "${DPC_AIO_CFG_OFFLINE_BUNDLE_ID:-}" "${DPC_AIO_DEFAULT_OFFLINE_BUNDLE_ID:-}" '')"
          if [[ "$offline" == FULL_OFFLINE || "$offline" == OFFLINE_THEN_SYNC ]]; then
            if [[ -z "$bundle" ]]; then offline=ONLINE; allow=false; fi
          fi
          {
            echo "DPC_AIO_RELEASE_APK_NAME=$release_apk"
            echo "DPC_AIO_EMERGENCY_RELEASE_TAG=$release_tag"
            echo "DPC_AIO_CONTINUOUS_RELEASE_TAG=$release_tag"
            echo "DPC_AIO_POLICY_PROFILE=$profile"
            echo "DPC_AIO_PROVISIONING_MODE=$mode"
            echo "DPC_AIO_ALLOW_OFFLINE=$allow"
            echo "DPC_AIO_ENROLLMENT_OFFLINE_MODE=$offline"
            echo "DPC_AIO_OFFLINE_BUNDLE_ID=$bundle"
          } >> "$GITHUB_ENV"
          {
            echo "release_apk_name=$release_apk"
            echo "emergency_release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "AUTO EMERGENCY CONFIG: tag=$release_tag apk=$release_apk profile=$profile mode=$mode offline=$offline"

      - name: Resolve emergency target APK URL (published after local validation)
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DPC_AIO_EMERGENCY_RELEASE_TAG}/${DPC_AIO_RELEASE_APK_NAME}"
          echo "DPC_AIO_PROVISIONING_APK_URL=$url" >> "$GITHUB_ENV"
          echo "Provisioning target APK URL (may not exist until publish job): $url"

      - name: Create ephemeral PKCS12 enterprise signer
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dpc-aio-emergency-release.p12"
          alias="dpc-aio-emergency-ci"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          umask 077
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias "$alias" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 3650 \
            -dname "CN=DPC-AIO Emergency CI, OU=GitHub Actions, O=DPC-AIO, C=PL" \
            -noprompt

          fingerprint="$(keytool -list -v -keystore "$keystore" -storetype PKCS12 -storepass "$password" -alias "$alias" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$fingerprint"
          {
            echo "DPC_AIO_RELEASE_KEYSTORE_PATH=$keystore"
            echo "DPC_AIO_RELEASE_STORE_PASSWORD=$password"
            echo "DPC_AIO_RELEASE_KEY_ALIAS=$alias"
            echo "DPC_AIO_RELEASE_KEY_PASSWORD=$password"
            echo "DPC_AIO_EXPECTED_SIGNING_CERT_SHA256=$fingerprint"
            echo "DPC_AIO_SIGNING_MODE=ephemeral"
          } >> "$GITHUB_ENV"
          echo "Emergency signer fingerprint: $fingerprint"

      - name: Verify signing keystore file and path before build
        shell: bash
        run: |
          set -euo pipefail
          : "${DPC_AIO_RELEASE_KEYSTORE_PATH:?DPC_AIO_RELEASE_KEYSTORE_PATH is required}"
          raw="$DPC_AIO_RELEASE_KEYSTORE_PATH"
          test -f "$raw"
          test -s "$raw"
          resolved="$(realpath -e "$raw")"
          runner_temp="$(realpath -e "$RUNNER_TEMP")"
          case "$resolved" in
            "$runner_temp"/*) ;;
            *) echo "SIGNING_KEYSTORE_PATH_INVALID: expected a runner-temporary file, got $resolved" >&2; exit 1 ;;
          esac
          export DPC_AIO_EFFECTIVE_STORE_PASSWORD="$DPC_AIO_RELEASE_STORE_PASSWORD"
          keytool -list -keystore "$resolved" -alias "$DPC_AIO_RELEASE_KEY_ALIAS" -storepass:env DPC_AIO_EFFECTIVE_STORE_PASSWORD >/dev/null
          chmod 600 "$resolved"
          echo "DPC_AIO_RELEASE_KEYSTORE_PATH=$resolved" >> "$GITHUB_ENV"
          echo "Verified signing keystore path: $resolved"

      - name: Verify Android build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/android_build_preflight.py --require-signing --json-out dist/build-environment.json

      - name: Validate source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_gradle_source_completeness.py
          python3 tools/tests/test_app_android_classpath_114_contract.py
          python3 tools/tests/test_installer_android_compile_114_contract.py
          python3 tools/tests/test_114_qr_release_bundle_contract.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 tools/tests/test_release_secret_scan.py

      - name: Build signed enterpriseRelease
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p dist
          ./gradlew :app-dpc:assembleEnterpriseRelease --console=plain 2>&1 \
            | tee dist/gradle-build.log \
            | python3 tools/ci/filter_gradle_output.py

      - name: Resolve and verify built APK path
        shell: bash
        run: |
          set -euo pipefail
          apk_dir='apps/dpc/app/build/outputs/apk/enterprise/release'
          test -d "$apk_dir"
          mapfile -t candidates < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print | sort)
          [[ ${#candidates[@]} -eq 1 ]] || {
            printf 'BUILT_APK_COUNT_INVALID: expected exactly 1 APK under %s, found %d\n' "$apk_dir" "${#candidates[@]}" >&2
            printf 'candidate: %s\n' "${candidates[@]:-<none>}" >&2
            exit 1
          }
          apk="$(realpath -e "${candidates[0]}")"
          apk_root="$(realpath -e "$apk_dir")"
          case "$apk" in
            "$apk_root"/*) ;;
            *) echo "BUILT_APK_PATH_INVALID: $apk escapes $apk_root" >&2; exit 1 ;;
          esac
          test -f "$apk"
          test -s "$apk"
          echo "DPC_AIO_BUILT_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "Verified built APK path: $apk"
          stat --printf='APK size: %s bytes\n' "$apk"
          sha256sum "$apk"

      - name: Verify APK signer and collect enrollment artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          : "${DPC_AIO_BUILT_APK_PATH:?DPC_AIO_BUILT_APK_PATH is required}"
          apk="$DPC_AIO_BUILT_APK_PATH"
          test -f "$apk"
          test -s "$apk"
          apksigner_bin="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$apksigner_bin"
          echo "APK selected: $apk"
          echo "APK signer: $($apksigner_bin --version)"
          # Capture both streams and parse tolerantly. Keep the verifier stable
          # and distinguish a parser failure from an actual certificate mismatch.
          cert_output="$($apksigner_bin verify --verbose --print-certs "$apk" 2>&1)"
          printf '%s\n' "$cert_output"
          observed="$(
            printf '%s\n' "$cert_output" \
              | sed -nE 's/.*Signer[[:space:]]*#[[:space:]]*1[[:space:]]+certificate[[:space:]]+SHA-256[[:space:]]+digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/ip' \
              | head -n1 \
              | tr -d ':[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )"
          expected="$(printf '%s' "$DPC_AIO_EXPECTED_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          if [[ -z "$observed" ]]; then
            echo "SIGNING_CERT_PARSE_FAILED: apksigner verified the APK but no signer SHA-256 was parsed" >&2
            exit 1
          fi
          if [[ "$observed" != "$expected" ]]; then
            echo "SIGNING_CERT_MISMATCH expected=$expected observed=$observed" >&2
            exit 1
          fi

          cp "$apk" dist/$DPC_AIO_RELEASE_APK_NAME
          src='apps/dpc/app/build/outputs/provisioning/enterprise/release'
          cp "$src"/provisioning.json "$src"/provisioning-payload.txt "$src"/provisioning-metadata.json "$src"/provisioning-qr.png dist/
          case "$DPC_AIO_QR_TYPE" in
            both|work-profile)
              cp "$src"/work-profile-provisioning.json "$src"/work-profile-provisioning-payload.txt \
                 "$src"/work-profile-provisioning-metadata.json "$src"/work-profile-qr.png dist/
              ;;
          esac
          case "$DPC_AIO_QR_TYPE" in
            both|fully-managed)
              cp "$src"/device-owner-provisioning.json "$src"/device-owner-provisioning-payload.txt \
                 "$src"/device-owner-provisioning-metadata.json "$src"/device-owner-qr.png dist/
              ;;
          esac
          printf '%s\n' "$DPC_AIO_SIGNING_MODE" > dist/signing-mode.txt
          printf '%s\n' "$observed" > dist/signing-cert-sha256.txt
          sha256sum dist/$DPC_AIO_RELEASE_APK_NAME > dist/$DPC_AIO_RELEASE_APK_NAME.sha256

      - name: Validate QR to exact local APK binding before release publish
        shell: bash
        run: |
          set -uo pipefail
          compat_mode="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["provisioningMode"])' dist/provisioning-metadata.json)"
          verifier_apksigner="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$verifier_apksigner"
          status=0

          validate_one() {
            local report="$1"
            shift
            if ! python3 tools/provisioning/verify_provisioning_qr.py "$@" > "$report"; then
              status=1
            fi
            echo "===== $report ====="
            cat "$report" || true
          }

          validate_one dist/provisioning-validation.json --json dist/provisioning.json --qr dist/provisioning-qr.png --apk "dist/$DPC_AIO_RELEASE_APK_NAME" --apksigner "$verifier_apksigner" --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode "$compat_mode"
          if [[ "$DPC_AIO_QR_TYPE" == "both" || "$DPC_AIO_QR_TYPE" == "work-profile" ]]; then
            validate_one dist/work-profile-validation.json --json dist/work-profile-provisioning.json --qr dist/work-profile-qr.png --apk "dist/$DPC_AIO_RELEASE_APK_NAME" --apksigner "$verifier_apksigner" --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode work-profile
          fi
          if [[ "$DPC_AIO_QR_TYPE" == "both" || "$DPC_AIO_QR_TYPE" == "fully-managed" ]]; then
            validate_one dist/device-owner-validation.json --json dist/device-owner-provisioning.json --qr dist/device-owner-qr.png --apk "dist/$DPC_AIO_RELEASE_APK_NAME" --apksigner "$verifier_apksigner" --expected-apk-url "$DPC_AIO_PROVISIONING_APK_URL" --expected-mode fully-managed
          fi

          if [[ "$status" != "0" ]]; then
            echo "QR_VALIDATION_FAILED: local QR/APK validation failed; validation reports were preserved for artifact upload." >&2
            exit "$status"
          fi

      - name: Cleanup ephemeral signer before runtime
        shell: bash
        run: rm -f "${DPC_AIO_RELEASE_KEYSTORE_PATH:-}"

      - name: Enable KVM group perms
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AOSP Device Owner runtime smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            python3 tools/runtime/android_device_owner_smoke.py
            --apk dist/$DPC_AIO_RELEASE_APK_NAME
            --out dist/android-runtime-smoke.json
            --expected-version "$DPC_AIO_APP_VERSION"

      - name: Build QR release bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/build_qr_release_bundle.py --dist dist --version "$DPC_AIO_APP_VERSION" --apk-url "$DPC_AIO_PROVISIONING_APK_URL" --apk-name "$DPC_AIO_RELEASE_APK_NAME" --qr-type "$DPC_AIO_QR_TYPE"

      - name: Upload emergency enrollment artifacts
        if: ${{ always() && hashFiles('dist/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: ${{ env.DPC_AIO_EMERGENCY_ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error

      - name: Cleanup signing material fallback
        if: always()
        shell: bash
        run: rm -f "${DPC_AIO_RELEASE_KEYSTORE_PATH:-}" || true

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DPC_AIO_APP_VERSION: ${{ needs.build.outputs.app_version }}
      DPC_AIO_QR_BUNDLE_NAME: ${{ needs.build.outputs.qr_bundle_name }}
      DPC_AIO_RELEASE_APK_NAME: ${{ needs.build.outputs.release_apk_name }}
      DPC_AIO_EMERGENCY_RELEASE_TAG: ${{ needs.build.outputs.emergency_release_tag }}
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.DPC_AIO_EMERGENCY_ARTIFACT_NAME }}
          path: dist

      - name: Publish emergency enrollment prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag="$DPC_AIO_EMERGENCY_RELEASE_TAG"
          notes="Run-specific emergency DPC-AIO $DPC_AIO_APP_VERSION enrollment build from commit $GITHUB_SHA. APK and selected QR type $DPC_AIO_QR_TYPE are verified against each other and include $DPC_AIO_QR_BUNDLE_NAME. The signer is ephemeral, so this build is not update-stable across independent runs."
          rm -f dist/gradle-build.log
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DPC-AIO Emergency Enrollment" --notes "$notes" --prerelease
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "DPC-AIO Emergency Enrollment" --notes "$notes" --prerelease
          fi
          gh release upload "$tag" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Verify public APK byte identity
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${DPC_AIO_EMERGENCY_RELEASE_TAG}/${DPC_AIO_RELEASE_APK_NAME}"
          downloaded="$RUNNER_TEMP/DPC-AIO-enterprise-release.downloaded.apk"
          matched=0
          for attempt in 1 2 3 4 5 6; do
            rm -f "$downloaded"
            if curl -fL --connect-timeout 15 --max-time 180 "$url" -o "$downloaded" && cmp -s dist/$DPC_AIO_RELEASE_APK_NAME "$downloaded"; then
              matched=1
              break
            fi
            echo "Release asset not public/matching yet (attempt $attempt/6)."
            sleep 5
          done
          [[ "$matched" == "1" ]] || { echo "EMERGENCY_APK_PUBLIC_VERIFY_FAILED" >&2; exit 1; }
          echo "Emergency APK is public and byte-identical to the QR-bound build."
