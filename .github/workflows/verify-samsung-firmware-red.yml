name: Verify Samsung firmware diagnostics RED

on:
  push:
    branches:
      - feat/dpc-aio-130-samsung-firmware-diagnostics
    paths:
      - .github/workflows/verify-samsung-firmware-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Confirm contract fails before implementation
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/tests/test_133_samsung_firmware_diagnostics_contract.py; then
            echo "Expected RED contract to fail before implementation" >&2
            exit 1
          fi
          echo "SAMSUNG_FIRMWARE_DIAGNOSTICS_133_RED_CONFIRMED"
