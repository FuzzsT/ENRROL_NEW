name: Temporary Activity Launcher preserve sort direction GREEN

on:
  push:
    branches:
      - fix/activity-launcher-preserve-sort-direction

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/activity-launcher-preserve-sort-direction
          fetch-depth: 1
      - name: Apply exact preserve-sort-direction patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          activity = Path('apps/dpc/app/src/main/kotlin/io/dpcaio/app/ActivityLauncherHubActivity.kt')
          s = activity.read_text()
          old = '''            ) {\n                currentSort = sort\n                currentSortDirection = when (sort) {\n                    AppSort.NAME, AppSort.PACKAGE -> SortDirection.ASCENDING\n                    AppSort.INSTALL_DATE, AppSort.UPDATE_DATE -> SortDirection.DESCENDING\n                }\n                renderSortBar()\n                renderApps()\n            }\n'''
          new = '''            ) {\n                if (sort != currentSort) {\n                    currentSort = sort\n                    currentSortDirection = when (sort) {\n                        AppSort.NAME, AppSort.PACKAGE -> SortDirection.ASCENDING\n                        AppSort.INSTALL_DATE, AppSort.UPDATE_DATE -> SortDirection.DESCENDING\n                    }\n                }\n                renderSortBar()\n                renderApps()\n            }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one sort callback anchor, got {s.count(old)}')
          activity.write_text(s.replace(old, new, 1))

          runner = Path('tools/run_host_tests.sh')
          r = runner.read_text()
          anchor = 'python3 "$ROOT/tools/tests/test_activity_launcher_date_sort_tiebreaker_contract.py"\n'
          addition = anchor + 'python3 "$ROOT/tools/tests/test_activity_launcher_preserve_sort_direction_contract.py"\n'
          if r.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one Activity Launcher host-test anchor, got {r.count(anchor)}')
          if 'test_activity_launcher_preserve_sort_direction_contract.py' not in r:
              r = r.replace(anchor, addition, 1)
          runner.write_text(r)
          PY
          python3 tools/tests/test_activity_launcher_preserve_sort_direction_contract.py
          python3 tools/tests/test_activity_launcher_app_manager_contract.py
          python3 tools/tests/test_component_manager_ui_contract.py
          python3 tools/tests/test_activity_launcher_date_sort_tiebreaker_contract.py
          git diff --check
          printf 'Changed files:\n'
          git diff --name-only
          expected='apps/dpc/app/src/main/kotlin/io/dpcaio/app/ActivityLauncherHubActivity.kt tools/run_host_tests.sh '
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$actual" = "$expected"
      - name: Commit exact GREEN changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/dpc/app/src/main/kotlin/io/dpcaio/app/ActivityLauncherHubActivity.kt tools/run_host_tests.sh
          git commit -m "fix: preserve Activity Launcher sort direction"
          git push origin HEAD:fix/activity-launcher-preserve-sort-direction
