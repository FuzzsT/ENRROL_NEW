name: Verify DPC QR Kotlin provisioning fix

on:
  push:
    branches:
      - fix/dpc-aio-qr-kotlin-provisioning
    paths:
      - .github/workflows/verify-dpc-fix.yml
      - .dpc-fix/normalize_aio.py

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Apply deterministic fixes and remove temporary files from working tree
        shell: bash
        run: |
          set -euo pipefail
          python3 .dpc-fix/normalize_aio.py
          python3 .dpc-fix/apply_dpc_fix.py
          rm -f .github/workflows/verify-dpc-fix.yml .dpc-fix/apply_dpc_fix.py .dpc-fix/normalize_aio.py
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android 17 build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" --channel=3
          test -e "$ANDROID_SDK_ROOT/platforms/android-37/android.jar"

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 -m pip install --quiet -r tools/provisioning/requirements.txt

      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tests/test_122_workflow_qr_choice_contract.py
          python3 tools/tests/test_activity_explorer_concurrent_map_contract.py
          python3 tools/tests/test_component_manager_ui_contract.py
          python3 tools/tests/test_qr_release_bundle_builder.py
          python3 tools/tests/test_114_qr_release_bundle_contract.py
          python3 tools/tests/test_115_app_pin_and_provisioning_modes_contract.py
          python3 tools/tests/test_122_qr_mode_matrix.py
          python3 tools/tests/test_102_qr_production_readiness_contract.py
          python3 tools/tests/test_113_github_upload_ready_contract.py
          python3 tools/tests/test_release_secret_scan.py
          python3 tools/tests/test_non_sdk_api_scan.py
          python3 - <<'PY'
          import yaml
          for path in (
              '.github/workflows/build-aio-enrollment.yml',
              '.github/workflows/build-emergency-enrollment.yml',
          ):
              with open(path, encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          print('WORKFLOW_YAML_PARSE: PASS')
          PY

      - name: Compile enterprise release Kotlin
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app-dpc:compileEnterpriseReleaseKotlin --console=plain --stacktrace

      - name: Commit verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: stabilize QR workflows Kotlin compile and provisioning'
          final_commit="$(git rev-parse HEAD)"
          echo "FINAL_COMMIT=$final_commit"
          git push origin HEAD:"$GITHUB_REF_NAME"
